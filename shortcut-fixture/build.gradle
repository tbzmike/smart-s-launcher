plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tbzmike.shortcutfixture'
    compileSdk { version = release(36) }
    defaultConfig {
        minSdk { version = release(26) }
        targetSdk { version = release(35) }
        versionCode 1
        versionName '1.0'
    }
    flavorDimensions += 'route'
    productFlavors {
        target {
            dimension 'route'
            applicationId 'com.tbzmike.shortcutfixture.target'
            manifestPlaceholders = [fixtureLabel: 'Shortcut Fixture']
        }
        icebox {
            dimension 'route'
            applicationId 'com.tbzmike.shortcutfixture.icebox'
            manifestPlaceholders = [fixtureLabel: 'Ice Box']
        }
    }
}
