MaintainerNotes: |-
  Smart S Launcher is a functional fork of KISS with applicationId
  com.tbzmike.smartslauncher and distinct Smart S Launcher artwork.

  Inherited KISS product-name text in localized Android string resources was
  migrated directly in the source tree to Smart S. Internal resource identifiers
  such as main_kiss remain unchanged because they are implementation identifiers,
  not user-visible product branding.

  Upstream provides Smart S Launcher-specific Fastlane metadata, including
  icon.png and four phone screenshots under
  fastlane/metadata/android/en-US/images/phoneScreenshots/.

  app/debug.keystore is a public debug-only CI key used upstream to keep debug
  APKs update-compatible. It is not used for release signing and is deleted by
  the F-Droid scanner/build recipe.

  Google Maps history cards can optionally show live location details, disabled
  by default. When explicitly enabled, Smart S uses Android LocationManager data
  locally to show coordinates and accuracy. It does not download map tiles or
  reverse-geocode that location, so this feature does not send location to a map
  or geocoding service.

  The Gradle 9.3.1 wrapper distribution is pinned with its verified SHA-256.
  This matches the minimum Gradle version required by Android Gradle Plugin 9.1.

  The communications index can optionally interoperate with a separately
  installed Truecaller app by reading locally exposed/provider data and, when
  the user has root, a local Truecaller cache. Truecaller is not required for
  Smart S Launcher to function, no Truecaller SDK is bundled, and this build
  does not use a Truecaller network API.

