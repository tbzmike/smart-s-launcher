MaintainerNotes: |-
  Smart S Launcher is a functional fork of KISS with applicationId
  com.tbzmike.smartslauncher and distinct Smart S launcher artwork.

  Upstream KISS translations still contain inherited product-name text in a
  number of locales. The deterministic fdroid/rebrand_strings.py prebuild step
  replaces only user-visible KISS product-name text (case-insensitively) with
  "Smart S" in every values*/strings.xml file; internal resource identifiers
  and XML attributes are not renamed.

  app/debug.keystore is a public debug-only CI key used by upstream to keep
  debug APKs update-compatible. It is not used for release signing and is
  deleted by the F-Droid scanner/build recipe.

  The communications index can optionally interoperate with a separately
  installed Truecaller app by reading locally exposed/provider data and, when
  the user has root, a local Truecaller cache. Truecaller is not required for
  Smart S Launcher to function, no Truecaller SDK is bundled, and this build
  does not use a Truecaller network API.

