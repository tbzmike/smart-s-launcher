name: Guarded 3.30.65 search return and durable notification routes
on:
  push:
    branches: [fix/3.30.65-search-notification-routes]
    paths: ['.github/workflows/apply-33065-search-notification-routes.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a6bd91534c0d29d9be3e09b2f3f1dc9231687552"
          grep -Fq 'versionName "3.30.64"' app/build.gradle
          grep -Fq 'private final VerticalCardUserScrollGesturePolicy userScrollGesturePolicy' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
      - name: Apply guarded 3.30.65 changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def p(path): return Path(path)
          def read(path): return p(path).read_text()
          def write(path, text): p(path).write_text(text)
          def rep(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              write(path, text.replace(old, new, count))

          # Version.
          rep('app/build.gradle',
              '// Smart S Launcher 3.30.64 - stationary Vertical Cards viewport and explicit latest navigation\n        versionCode 492\n        versionName "3.30.64"',
              '// Smart S Launcher 3.30.65 - reliable search return, durable notification routes and reinstall source\n        versionCode 493\n        versionName "3.30.65"')

          # One-shot lifecycle state for a successful external launch that began from a search.
          write('app/src/main/java/fr/neamar/kiss/SearchLaunchReturnState.java', '''package fr.neamar.kiss;\n\n/**\n * Tracks only the launcher transition that matters for search cleanup: a verified successful\n * external launch that began while the user had a non-empty search query. The reset is consumed\n * exactly once on the next launcher resume.\n */\nfinal class SearchLaunchReturnState {\n    private boolean startedFromSearch;\n    private boolean defaultHistoryResetPending;\n\n    void onExternalLaunchStarting(boolean activeSearch) {\n        startedFromSearch = activeSearch;\n    }\n\n    void onExternalLaunchSucceeded() {\n        if (startedFromSearch) defaultHistoryResetPending = true;\n        startedFromSearch = false;\n    }\n\n    void onExternalLaunchCancelled() {\n        startedFromSearch = false;\n    }\n\n    boolean consumeDefaultHistoryReset() {\n        if (!defaultHistoryResetPending) return false;\n        defaultHistoryResetPending = false;\n        return true;\n    }\n}\n''')
          write('app/src/test/java/fr/neamar/kiss/SearchLaunchReturnStateTest.java', '''package fr.neamar.kiss;\n\nimport static org.hamcrest.MatcherAssert.assertThat;\nimport static org.hamcrest.Matchers.is;\n\nimport org.junit.jupiter.api.Test;\n\nclass SearchLaunchReturnStateTest {\n    @Test void successfulSearchLaunchRequestsExactlyOneDefaultHistoryReset() {\n        SearchLaunchReturnState state = new SearchLaunchReturnState();\n        state.onExternalLaunchStarting(true);\n        state.onExternalLaunchSucceeded();\n        assertThat(state.consumeDefaultHistoryReset(), is(true));\n        assertThat(state.consumeDefaultHistoryReset(), is(false));\n    }\n\n    @Test void nonSearchLaunchNeverRequestsSearchReset() {\n        SearchLaunchReturnState state = new SearchLaunchReturnState();\n        state.onExternalLaunchStarting(false);\n        state.onExternalLaunchSucceeded();\n        assertThat(state.consumeDefaultHistoryReset(), is(false));\n    }\n\n    @Test void cancelledSearchLaunchDoesNotResetHistory() {\n        SearchLaunchReturnState state = new SearchLaunchReturnState();\n        state.onExternalLaunchStarting(true);\n        state.onExternalLaunchCancelled();\n        assertThat(state.consumeDefaultHistoryReset(), is(false));\n    }\n}\n''')

          # MainActivity: make return from a launched search result an explicit state transition.
          rep('app/src/main/java/fr/neamar/kiss/MainActivity.java',
              'private final LauncherHomeLifecycleState homeLifecycleState =\n            new LauncherHomeLifecycleState();\n    private boolean launcherUiResumed;',
              'private final LauncherHomeLifecycleState homeLifecycleState =\n            new LauncherHomeLifecycleState();\n    private final SearchLaunchReturnState searchLaunchReturnState =\n            new SearchLaunchReturnState();\n    private boolean launcherUiResumed;')
          rep('app/src/main/java/fr/neamar/kiss/MainActivity.java',
              'boolean refreshDeferredBackground = pendingBackgroundRefresh;\n        boolean refreshDeferredFavorites = pendingBackgroundFavoriteRefresh;',
              'boolean resetDefaultHistoryAfterSearchLaunch =\n                searchLaunchReturnState.consumeDefaultHistoryReset();\n        boolean refreshDeferredBackground = pendingBackgroundRefresh;\n        boolean refreshDeferredFavorites = pendingBackgroundFavoriteRefresh;')
          rep('app/src/main/java/fr/neamar/kiss/MainActivity.java',
              '''        // Coalesce everything that arrived while an external launch transition owned the screen.\n        // Refresh the existing search type so a queued notification event becomes a real timeline\n        // card without resetting history navigation to a different search mode.\n        if (refreshDeferredBackground\n                && SearchHandler.getInstance().getLastSearchType() != null) {\n            updateSearchRecords(true, searchEditText.getText().toString());\n        } else {\n            updateSearchRecords(false, searchEditText.getText().toString());\n        }''',
              '''        // A successful launch from a query must return to the real default History tree, not a\n        // visually frozen copy of the old query results. Arm the Vertical Cards renderer before\n        // publishing the empty query so the QUERY -> HISTORY result set is rebuilt and bottom-pinned.\n        if (resetDefaultHistoryAfterSearchLaunch) {\n            forwarderManager.prepareDefaultHistoryAfterSearchLaunch();\n            cancelSearch();\n            if (!TextUtils.isEmpty(searchEditText.getText())) {\n                clearSearchText();\n            } else {\n                updateSearchRecords(false, "");\n            }\n            displayClearOnInput();\n            hideKeyboard();\n        } else if (refreshDeferredBackground\n                && SearchHandler.getInstance().getLastSearchType() != null) {\n            updateSearchRecords(true, searchEditText.getText().toString());\n        } else {\n            updateSearchRecords(false, searchEditText.getText().toString());\n        }''')
          rep('app/src/main/java/fr/neamar/kiss/MainActivity.java',
              '''    public void externalResultLaunchStarting() {\n        // Capture the currently visible Vertical Cards viewport before Android begins the external\n        // transition. A later history recency update must not relocate the tile the user tapped.\n        forwarderManager.onExternalResultLaunchStarting();\n        launcherUiResumed = false;\n    }\n\n    @Override\n    public void externalResultLaunchOccurred() {\n        homeLifecycleState.onExternalResultLaunched();\n    }\n\n    @Override\n    public void externalResultLaunchCancelled() {\n        launcherUiResumed = true;\n        forwarderManager.onExternalResultLaunchCancelled();\n    }''',
              '''    public void externalResultLaunchStarting() {\n        // Record whether this verified external transition started from a real query before the\n        // delayed launch cleanup can clear the EditText while Smart S is in the background.\n        searchLaunchReturnState.onExternalLaunchStarting(\n                searchEditText != null && !TextUtils.isEmpty(searchEditText.getText()));\n        // Capture the currently visible Vertical Cards viewport before Android begins the external\n        // transition. A later history recency update must not relocate the tile the user tapped.\n        forwarderManager.onExternalResultLaunchStarting();\n        launcherUiResumed = false;\n    }\n\n    @Override\n    public void externalResultLaunchOccurred() {\n        searchLaunchReturnState.onExternalLaunchSucceeded();\n        homeLifecycleState.onExternalResultLaunched();\n    }\n\n    @Override\n    public void externalResultLaunchCancelled() {\n        searchLaunchReturnState.onExternalLaunchCancelled();\n        launcherUiResumed = true;\n        forwarderManager.onExternalResultLaunchCancelled();\n    }''')

          # Vertical Cards: explicit search return outranks passive frozen-history behavior.
          rep('app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              'private boolean pendingDataSetRefresh;\n    private boolean renderedActiveQuery;',
              'private boolean pendingDataSetRefresh;\n    private boolean forceNextHistoryRebuild;\n    private boolean renderedActiveQuery;')
          rep('app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              'pendingDataSetRefresh = false;\n        renderedActiveQuery = false;',
              'pendingDataSetRefresh = false;\n        forceNextHistoryRebuild = false;\n        renderedActiveQuery = false;')
          rep('app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              '''    boolean hasPendingDataSetRefresh() {\n        return pendingDataSetRefresh;\n    }''',
              '''    boolean hasPendingDataSetRefresh() {\n        return pendingDataSetRefresh;\n    }\n\n    void forceHistoryRebuildOnNextDataSetChange() {\n        forceNextHistoryRebuild = true;\n    }''')
          rep('app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              '''        return column == null || column.getChildCount() == 0\n                || (!activeQuery && renderedActiveQuery);''',
              '''        return column == null || column.getChildCount() == 0\n                || (!activeQuery && (renderedActiveQuery || forceNextHistoryRebuild));''')
          rep('app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              '''        boolean activeQuery = isActiveQuery();\n        boolean animateHistoryItems = !activeQuery && !suppressNextHistoryAnimation;''',
              '''        boolean activeQuery = isActiveQuery();\n        if (!activeQuery) forceNextHistoryRebuild = false;\n        boolean animateHistoryItems = !activeQuery && !suppressNextHistoryAnimation;''')

          rep('app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java',
              '''    /** Route the exact Android HOME intent with verified foreground/background lifecycle state. */\n    public void onNewIntent(@NonNull Intent intent, boolean launcherWasForeground) {''',
              '''    /** Force QUERY -> default HISTORY after a verified successful external search launch. */\n    public void prepareDefaultHistoryAfterSearchLaunch() {\n        if (!isVerticalCardsMode()) return;\n        smartCardListForwarder.forceHistoryRebuildOnNextDataSetChange();\n        verticalCardViewportController.beginExplicitBottomNavigation();\n    }\n\n    /** Route the exact Android HOME intent with verified foreground/background lifecycle state. */\n    public void onNewIntent(@NonNull Intent intent, boolean launcherWasForeground) {''')

          # Main notification DB: persist an app-exposed durable route in addition to shortcut id.
          rep('app/src/main/java/fr/neamar/kiss/db/NotificationHistoryRecord.java',
              'public long userSerial = -1L;\n}',
              'public long userSerial = -1L;\n    /** Verified explicit route captured from the app-published conversation shortcut. */\n    public String routeUri;\n}')
          rep('app/src/main/java/fr/neamar/kiss/db/DB.java',
              'private final static int DB_VERSION = 15;',
              'private final static int DB_VERSION = 16;')
          rep('app/src/main/java/fr/neamar/kiss/db/DB.java',
              '''shortcut_id TEXT NOT NULL DEFAULT '', user_serial INTEGER NOT NULL DEFAULT -1)''',
              '''shortcut_id TEXT NOT NULL DEFAULT '', user_serial INTEGER NOT NULL DEFAULT -1, route_uri TEXT NOT NULL DEFAULT '')''')
          rep('app/src/main/java/fr/neamar/kiss/db/DB.java',
              '''                case 14:\n                    database.execSQL("ALTER TABLE notification_history ADD COLUMN shortcut_id TEXT NOT NULL DEFAULT ''");\n                    database.execSQL("ALTER TABLE notification_history ADD COLUMN user_serial INTEGER NOT NULL DEFAULT -1");\n                    break;''',
              '''                case 14:\n                    database.execSQL("ALTER TABLE notification_history ADD COLUMN shortcut_id TEXT NOT NULL DEFAULT ''");\n                    database.execSQL("ALTER TABLE notification_history ADD COLUMN user_serial INTEGER NOT NULL DEFAULT -1");\n                    // fall through\n                case 15:\n                    database.execSQL("ALTER TABLE notification_history ADD COLUMN route_uri TEXT NOT NULL DEFAULT ''");\n                    break;''')

          # SmartStateStore columns/signature/read and route backfill.
          s='app/src/main/java/fr/neamar/kiss/db/SmartStateStore.java'
          text=read(s)
          text=text.replace('n.post_time,n.is_permanent,n.shortcut_id,n.user_serial FROM notification_history',
                            'n.post_time,n.is_permanent,n.shortcut_id,n.user_serial,n.route_uri FROM notification_history')
          text=text.replace('boolean permanent, @Nullable String shortcutId, long userSerial) {',
                            'boolean permanent, @Nullable String shortcutId, long userSerial,\n                                        @Nullable String routeUri) {')
          text=text.replace('values.put("user_serial", userSerial);',
                            'values.put("user_serial", userSerial);\n        values.put("route_uri", routeUri == null ? "" : routeUri);')
          text=text.replace('"post_time", "is_permanent", "shortcut_id", "user_serial"},',
                            '"post_time", "is_permanent", "shortcut_id", "user_serial", "route_uri"},')
          text=text.replace('record.userSerial = cursor.getLong(9);\n        return record;',
                            'record.userSerial = cursor.getLong(9);\n        record.routeUri = cursor.getString(10);\n        return record;')
          marker='''    private static NotificationHistoryRecord readNotificationRecord(Cursor cursor) {'''
          if text.count(marker)!=1: raise SystemExit('SmartStateStore read marker mismatch')
          method='''    public static void updateNotificationRoute(@NonNull Context context, long dbId,\n                                               @Nullable String routeUri) {\n        if (dbId <= 0L || routeUri == null || routeUri.isEmpty()) return;\n        ContentValues values = new ContentValues(1);\n        values.put("route_uri", routeUri);\n        db(context).update("notification_history", values, "_id=?",\n                new String[]{Long.toString(dbId)});\n    }\n\n'''
          text=text.replace(marker, method+marker)
          write(s,text)

          # Timeline exact lookup by id and route column.
          s='app/src/main/java/fr/neamar/kiss/db/NotificationTimelineStore.java'
          text=read(s)
          text=text.replace('"post_time", "is_permanent", "shortcut_id", "user_serial"},',
                            '"post_time", "is_permanent", "shortcut_id", "user_serial", "route_uri"},')
          text=text.replace('record.userSerial = cursor.getLong(9);\n        return record;',
                            'record.userSerial = cursor.getLong(9);\n        record.routeUri = cursor.getString(10);\n        return record;')
          marker='''    /**\n     * Reads persisted notifications newer than the last launcher timeline scan.'''
          if text.count(marker)!=1: raise SystemExit('NotificationTimelineStore marker mismatch')
          method='''    @Nullable\n    public static NotificationHistoryRecord findByDbId(@NonNull Context context, long dbId) {\n        if (dbId <= 0L) return null;\n        try (Cursor cursor = db(context).query("notification_history",\n                new String[]{"_id", "notification_id", "package", "app_name", "title", "body",\n                        "post_time", "is_permanent", "shortcut_id", "user_serial", "route_uri"},\n                "_id=?", new String[]{Long.toString(dbId)}, null, null, null, "1")) {\n            return cursor.moveToFirst() ? read(cursor) : null;\n        }\n    }\n\n'''
          text=text.replace(marker, method+marker)
          write(s,text)

          # App/package state: distinguish missing packages from frozen packages.
          rep('app/src/main/java/fr/neamar/kiss/utils/AppLaunchUtils.java',
              '''    public static boolean isPackageEnabled(Context context, String packageName) {''',
              '''    public static boolean isPackageInstalled(Context context, String packageName) {\n        if (context == null || packageName == null || packageName.isEmpty()) return false;\n        try {\n            context.getPackageManager().getApplicationInfo(\n                    packageName, PackageManager.MATCH_DISABLED_COMPONENTS);\n            return true;\n        } catch (PackageManager.NameNotFoundException | RuntimeException e) {\n            return false;\n        }\n    }\n\n    public static boolean isPackageEnabled(Context context, String packageName) {''')
          rep('app/src/main/java/fr/neamar/kiss/utils/AppLaunchUtils.java',
              '''    public static boolean ensurePackageEnabled(Context context, String packageName) {\n        if (isPackageEnabled(context, packageName)) return true;''',
              '''    public static boolean ensurePackageEnabled(Context context, String packageName) {\n        if (!isPackageInstalled(context, packageName)) return false;\n        if (isPackageEnabled(context, packageName)) return true;''')

          # Durable notification destination resolver.
          s='app/src/main/java/fr/neamar/kiss/utils/SavedNotificationDestinationResolver.java'
          text=read(s)
          text=text.replace('import android.content.Context;\n', 'import android.content.Context;\nimport android.content.Intent;\n')
          text=text.replace('import android.content.pm.LauncherApps;\n', 'import android.content.pm.LauncherApps;\nimport android.content.pm.PackageManager;\nimport android.content.pm.ResolveInfo;\n')
          text=text.replace('import fr.neamar.kiss.db.NotificationHistoryRecord;\n', 'import fr.neamar.kiss.db.NotificationHistoryRecord;\nimport fr.neamar.kiss.db.SmartStateStore;\n')
          text=text.replace('''    private SavedNotificationDestinationResolver() {}\n''', '''    private SavedNotificationDestinationResolver() {}\n\n    public enum OpenResult {\n        OPENED,\n        ENABLE_RETRY_STARTED,\n        APP_NOT_INSTALLED,\n        APP_DISABLED_CANNOT_ENABLE,\n        NO_EXACT_TARGET;\n\n        public boolean accepted() {\n            return this == OPENED || this == ENABLE_RETRY_STARTED;\n        }\n    }\n''')
          text=text.replace('''        return Build.VERSION.SDK_INT >= Build.VERSION_CODES.O\n                && !TextUtils.isEmpty(record.shortcutId);''', '''        return !TextUtils.isEmpty(record.routeUri)\n                || (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O\n                && !TextUtils.isEmpty(record.shortcutId));''')
          old='''    public static boolean openExact(@NonNull Context context,\n                                    @Nullable NotificationHistoryRecord record) {\n        if (record == null) return false;\n\n        if (!TextUtils.isEmpty(record.packageName)) {\n            // Do not trust the short enabled-state cache here: the user may have frozen the app\n            // seconds after it was last observed as enabled. Force a current PackageManager read.\n            AppLaunchUtils.invalidatePackageState(record.packageName);\n            if (!AppLaunchUtils.isPackageEnabled(context, record.packageName)) {\n                if (!AppLaunchUtils.ensurePackageEnabled(context, record.packageName)) return false;\n                scheduleExactOpenAfterEnable(context.getApplicationContext(), record, 0,\n                        ENABLE_SETTLE_DELAY_MS);\n                return true;\n            }\n        }\n\n        return openExactNow(context, record);\n    }'''
          new='''    public static boolean openExact(@NonNull Context context,\n                                    @Nullable NotificationHistoryRecord record) {\n        return openExactResult(context, record).accepted();\n    }\n\n    @NonNull\n    public static OpenResult openExactResult(@NonNull Context context,\n                                             @Nullable NotificationHistoryRecord record) {\n        if (record == null) return OpenResult.NO_EXACT_TARGET;\n\n        if (!TextUtils.isEmpty(record.packageName)) {\n            if (!AppLaunchUtils.isPackageInstalled(context, record.packageName)) {\n                return OpenResult.APP_NOT_INSTALLED;\n            }\n            // Do not trust the short enabled-state cache here: the user may have frozen the app\n            // seconds after it was last observed as enabled. Force a current PackageManager read.\n            AppLaunchUtils.invalidatePackageState(record.packageName);\n            if (!AppLaunchUtils.isPackageEnabled(context, record.packageName)) {\n                if (!AppLaunchUtils.ensurePackageEnabled(context, record.packageName)) {\n                    return OpenResult.APP_DISABLED_CANNOT_ENABLE;\n                }\n                scheduleExactOpenAfterEnable(context.getApplicationContext(), record, 0,\n                        ENABLE_SETTLE_DELAY_MS);\n                return OpenResult.ENABLE_RETRY_STARTED;\n            }\n        }\n\n        return openExactNow(context, record)\n                ? OpenResult.OPENED : OpenResult.NO_EXACT_TARGET;\n    }'''
          if text.count(old)!=1: raise SystemExit('openExact source mismatch')
          text=text.replace(old,new)
          text=text.replace('''        if (openPublishedShortcut(context, record)) return true;\n\n        return !TextUtils.isEmpty(record.notificationId)''', '''        if (openPublishedShortcut(context, record)) return true;\n        if (openPersistedRoute(context, record)) return true;\n\n        return !TextUtils.isEmpty(record.notificationId)''')
          # Inject capture/persisted-route helpers before openPublishedShortcut docs.
          marker='''    /**\n     * Try only the durable app-published conversation shortcut represented by a saved notification.'''
          if text.count(marker)!=1: raise SystemExit('saved resolver shortcut marker mismatch')
          helpers='''    @Nullable\n    public static String capturePublishedShortcutRoute(@NonNull Context context,\n                                                       @NonNull String packageName,\n                                                       @Nullable String shortcutId,\n                                                       @Nullable android.os.UserHandle user) {\n        if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O || TextUtils.isEmpty(shortcutId)\n                || TextUtils.isEmpty(packageName) || user == null) return null;\n        ShortcutInfo shortcut = ShortcutUtil.getShortCut(\n                context, user, packageName, shortcutId);\n        return shortcut == null ? null : routeUriFromShortcut(context, shortcut, packageName);\n    }\n\n    private static boolean openPersistedRoute(@NonNull Context context,\n                                              @NonNull NotificationHistoryRecord record) {\n        if (TextUtils.isEmpty(record.routeUri) || TextUtils.isEmpty(record.packageName)) return false;\n        if (record.userSerial >= 0L) {\n            UserManager userManager = ContextCompat.getSystemService(context, UserManager.class);\n            if (userManager == null) return false;\n            long currentSerial = userManager.getSerialNumberForUser(android.os.Process.myUserHandle());\n            if (currentSerial != record.userSerial) return false;\n        }\n        try {\n            Intent intent = Intent.parseUri(record.routeUri, Intent.URI_INTENT_SCHEME);\n            if (!isRouteOwnedByPackage(context, intent, record.packageName)) return false;\n            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n            context.startActivity(intent);\n            return true;\n        } catch (java.net.URISyntaxException | RuntimeException e) {\n            Log.w(TAG, "Unable to open persisted exact notification route", e);\n            return false;\n        }\n    }\n\n    @RequiresApi(Build.VERSION_CODES.O)\n    @Nullable\n    private static String routeUriFromShortcut(@NonNull Context context,\n                                               @NonNull ShortcutInfo shortcut,\n                                               @NonNull String expectedPackage) {\n        Intent[] intents = shortcut.getIntents();\n        if (intents == null) return null;\n        for (int i = intents.length - 1; i >= 0; i--) {\n            Intent candidate = intents[i];\n            if (candidate == null || !isRouteOwnedByPackage(context, candidate, expectedPackage)) {\n                continue;\n            }\n            return candidate.toUri(Intent.URI_INTENT_SCHEME);\n        }\n        return null;\n    }\n\n    private static boolean isRouteOwnedByPackage(@NonNull Context context,\n                                                 @NonNull Intent intent,\n                                                 @NonNull String expectedPackage) {\n        if (intent.getComponent() != null) {\n            return TextUtils.equals(expectedPackage, intent.getComponent().getPackageName());\n        }\n        if (!TextUtils.isEmpty(intent.getPackage())) {\n            return TextUtils.equals(expectedPackage, intent.getPackage());\n        }\n        try {\n            ResolveInfo resolved = context.getPackageManager().resolveActivity(\n                    intent, PackageManager.MATCH_DEFAULT_ONLY);\n            return resolved != null && resolved.activityInfo != null\n                    && TextUtils.equals(expectedPackage, resolved.activityInfo.packageName);\n        } catch (RuntimeException e) {\n            return false;\n        }\n    }\n\n    @RequiresApi(Build.VERSION_CODES.O)\n    private static void persistRouteIfMissing(@NonNull Context context,\n                                              @NonNull NotificationHistoryRecord record,\n                                              @NonNull ShortcutInfo shortcut) {\n        if (!TextUtils.isEmpty(record.routeUri)) return;\n        String route = routeUriFromShortcut(context, shortcut, record.packageName);\n        if (TextUtils.isEmpty(route)) return;\n        record.routeUri = route;\n        SmartStateStore.updateNotificationRoute(context, record.dbId, route);\n    }\n\n'''
          text=text.replace(marker, helpers+marker)
          # Ensure shortcut launch path backfills route for old rows while the shortcut still exists.
          text=text.replace('''            if (preferred != null) return launch(launcherApps, preferred);''', '''            if (preferred != null) {\n                persistRouteIfMissing(context, record, preferred);\n                return launch(launcherApps, preferred);\n            }''')
          text=text.replace('''        return matches.size() == 1 && launch(launcherApps, matches.get(0));''', '''        if (matches.size() != 1) return false;\n        persistRouteIfMissing(context, record, matches.get(0));\n        return launch(launcherApps, matches.get(0));''')
          write(s,text)

          # Capture the durable app-exposed route when the notification is live.
          rep('app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java',
              '''        String shortcutId = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? n.getShortcutId() : null;\n        long userSerial = -1L;''',
              '''        String shortcutId = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? n.getShortcutId() : null;\n        String routeUri = SavedNotificationDestinationResolver.capturePublishedShortcutRoute(\n                this, sbn.getPackageName(), shortcutId, sbn.getUser());\n        long userSerial = -1L;''')
          rep('app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java',
              '''                isPermanentForHistory(sbn), shortcutId, userSerial);''',
              '''                isPermanentForHistory(sbn), shortcutId, userSerial, routeUri);''')

          # Resolver exposes rich result and direct DB-id lookup to search results.
          rep('app/src/main/java/fr/neamar/kiss/utils/NotificationHistoryResolver.java',
              '''    public static boolean openExactForPojo(Context context, NotificationPojo notification) {\n        if (context == null || notification == null) return false;''',
              '''    public static boolean openExactForPojo(Context context, NotificationPojo notification) {\n        return openExactResultForPojo(context, notification).accepted();\n    }\n\n    public static SavedNotificationDestinationResolver.OpenResult openExactResultForPojo(\n            Context context, NotificationPojo notification) {\n        if (context == null || notification == null) {\n            return SavedNotificationDestinationResolver.OpenResult.NO_EXACT_TARGET;\n        }''')
          rep('app/src/main/java/fr/neamar/kiss/utils/NotificationHistoryResolver.java',
              '''        if (packageName == null) return false;''',
              '''        if (packageName == null) {\n            return SavedNotificationDestinationResolver.OpenResult.NO_EXACT_TARGET;\n        }''',1)
          rep('app/src/main/java/fr/neamar/kiss/utils/NotificationHistoryResolver.java',
              '''        if (index < 0 || index >= records.size()) return false;\n        return SavedNotificationDestinationResolver.openExact(context, records.get(index));''',
              '''        if (index < 0 || index >= records.size()) {\n            return SavedNotificationDestinationResolver.OpenResult.NO_EXACT_TARGET;\n        }\n        return SavedNotificationDestinationResolver.openExactResult(context, records.get(index));''')

          # App-usage package state: persist the installer package structurally and a verified store page.
          s='app/src/main/java/fr/neamar/kiss/appusage/AppUsageStore.java'
          text=read(s)
          text=text.replace('private static final int DB_VERSION = 2;', 'private static final int DB_VERSION = 3;')
          text=text.replace('''                "last_update_ms INTEGER NOT NULL DEFAULT 0," +\n                "source TEXT," +''', '''                "last_update_ms INTEGER NOT NULL DEFAULT 0," +\n                "installer_package TEXT," +\n                "source TEXT," +''')
          text=text.replace('''        if (oldVersion < 2) createDailyPhoneStateTable(db);''', '''        if (oldVersion < 2) createDailyPhoneStateTable(db);\n        if (oldVersion < 3) {\n            db.execSQL("ALTER TABLE package_state ADD COLUMN installer_package TEXT");\n        }''')
