          set -euo pipefail
          mapfile -t files < <(git status --short | sed -E 's/^.. //' | sort)
          printf '%s\n' "${files[@]}"
          allowed='^(app/build.gradle|app/src/main/java/fr/neamar/kiss/(MainActivity.java|NotificationHistoryActivity.java|SearchLaunchReturnState.java|AppUsageActivity.java|appusage/AppUsageStore.java|appusage/AppUsageSync.java|db/DB.java|db/NotificationHistoryRecord.java|db/NotificationTimelineStore.java|db/SmartStateStore.java|forwarder/ForwarderManager.java|forwarder/SmartCardListForwarder.java|notification/NotificationListener.java|result/SettingsResult.java|ui/RichNotificationHistoryDialog.java|utils/AppLaunchUtils.java|utils/AppReinstallSupport.java|utils/NotificationHistoryResolver.java|utils/SavedNotificationDestinationResolver.java)|app/src/test/java/fr/neamar/kiss/SearchLaunchReturnStateTest.java)$'
          for f in "${files[@]}"; do [[ "$f" =~ $allowed ]] || { echo "Unexpected file: $f"; exit 1; }; done
          grep -Fq 'versionCode 493' app/build.gradle
          grep -Fq 'versionName "3.30.65"' app/build.gradle
          grep -Fq 'private final static int DB_VERSION = 16;' app/src/main/java/fr/neamar/kiss/db/DB.java
          grep -Fq 'private static final int DB_VERSION = 3;' app/src/main/java/fr/neamar/kiss/appusage/AppUsageStore.java
