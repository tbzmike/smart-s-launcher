name: Repair Settings keyboard wiring safely

on:
  push:
    branches:
      - build/3.30.33
    paths:
      - .github/workflows/repair-settings-keyboard-wiring.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/3.30.33
          fetch-depth: 0
      - name: Restore original SettingsFragment and apply minimal keyboard wiring
        shell: bash
        run: |
          set -euo pipefail
          git checkout d6186cac77c28414a9aba9be3ea00daa94ec3983 -- app/src/main/java/fr/neamar/kiss/SettingsFragment.java
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/fr/neamar/kiss/SettingsFragment.java')
          s = p.read_text()

          def one(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {s.count(old)}')
              s = s.replace(old, new, 1)

          one('import android.provider.Settings;\nimport android.widget.Toast;',
              'import android.provider.Settings;\nimport android.view.inputmethod.InputMethodManager;\nimport android.widget.Toast;',
              'InputMethodManager import')
          one('import fr.neamar.kiss.searcher.SemanticEmbeddingScorer;\nimport fr.neamar.kiss.utils.DrawableUtils;',
              'import fr.neamar.kiss.searcher.SemanticEmbeddingScorer;\nimport fr.neamar.kiss.ui.SearchEditText;\nimport fr.neamar.kiss.utils.DrawableUtils;',
              'SearchEditText import')
          one('    private static final String DIALOG_FRAGMENT_TAG = "androidx.preference.PreferenceFragment.DIALOG";\n',
              '    private static final String DIALOG_FRAGMENT_TAG = "androidx.preference.PreferenceFragment.DIALOG";\n    private static final String PREF_CHOOSE_SYSTEM_KEYBOARD = "choose-system-keyboard";\n',
              'chooser constant')
          one('        setPreferencesFromResource(R.xml.preferences, rootKey);\n        try {\n            addSemanticSearchPreferences(rootKey);',
              '        setPreferencesFromResource(R.xml.preferences, rootKey);\n        addSearchKeyboardPreferences();\n        try {\n            addSemanticSearchPreferences(rootKey);',
              'settings wiring call')

          marker = '    private void addSemanticSearchPreferences(@Nullable String rootKey) {\n'
          method = '''    private void addSearchKeyboardPreferences() {
                  PreferenceGroup keyboardOptions = findPreference("keyboard-options");
                  if (keyboardOptions == null) return;

                  ListPreference mode = new ListPreference(requireContext());
                  mode.setKey(SearchEditText.PREF_SEARCH_KEYBOARD_MODE);
                  mode.setTitle("Search keyboard");
                  mode.setEntries(new CharSequence[]{"Built-in Smart S keyboard", "System keyboard"});
                  mode.setEntryValues(new CharSequence[]{
                          SearchEditText.KEYBOARD_MODE_BUILT_IN,
                          SearchEditText.KEYBOARD_MODE_SYSTEM
                  });
                  mode.setDefaultValue(SearchEditText.KEYBOARD_MODE_BUILT_IN);
                  mode.setSummaryProvider(ListPreference.SimpleSummaryProvider.getInstance());
                  keyboardOptions.addPreference(mode);

                  Preference chooser = new Preference(requireContext());
                  chooser.setKey(PREF_CHOOSE_SYSTEM_KEYBOARD);
                  chooser.setTitle("Choose installed system keyboard");
                  chooser.setOnPreferenceClickListener(preference -> {
                      InputMethodManager imm = ContextCompat.getSystemService(requireContext(), InputMethodManager.class);
                      if (imm != null) imm.showInputMethodPicker();
                      else Toast.makeText(requireContext(), "Android keyboard picker is unavailable", Toast.LENGTH_SHORT).show();
                      return true;
                  });
                  keyboardOptions.addPreference(chooser);
                  refreshSearchKeyboardPicker();
              }

              private void refreshSearchKeyboardPicker() {
                  Preference chooser = findPreference(PREF_CHOOSE_SYSTEM_KEYBOARD);
                  if (chooser == null) return;
                  boolean useSystem = SearchEditText.KEYBOARD_MODE_SYSTEM.equals(
                          prefs.getString(SearchEditText.PREF_SEARCH_KEYBOARD_MODE,
                                  SearchEditText.KEYBOARD_MODE_BUILT_IN));
                  chooser.setEnabled(useSystem);
                  chooser.setSummary(useSystem
                          ? "Tap to switch between keyboards installed and enabled in Android."
                          : "Select System keyboard above to use an installed Android keyboard.");
              }

          '''
          one(marker, method + marker, 'keyboard methods insertion')
          one('    public void onResume() {\n        super.onResume();\n        prefs.registerOnSharedPreferenceChangeListener(this);\n    }',
              '    public void onResume() {\n        super.onResume();\n        prefs.registerOnSharedPreferenceChangeListener(this);\n        refreshSearchKeyboardPicker();\n    }',
              'onResume refresh')
          one('            KissApplication.getApplication(requireContext()).getIconsHandler().onPrefChanged(sharedPreferences, key);\n\n            if (PREF_LISTS_WITH_DEPENDENCY.contains(key)) {',
              '            KissApplication.getApplication(requireContext()).getIconsHandler().onPrefChanged(sharedPreferences, key);\n\n            if (SearchEditText.PREF_SEARCH_KEYBOARD_MODE.equals(key)) {\n                refreshSearchKeyboardPicker();\n            }\n\n            if (PREF_LISTS_WITH_DEPENDENCY.contains(key)) {',
              'preference change refresh')

          p.write_text(s)

          p = Path('app/src/main/res/xml/preferences.xml')
          x = p.read_text()
          old = '        <PreferenceCategory app:title="@string/keyboard_options">'
          new = '        <PreferenceCategory\n            app:key="keyboard-options"\n            app:title="@string/keyboard_options">'
          if x.count(old) != 1:
              raise SystemExit(f'keyboard category guard: expected 1, got {x.count(old)}')
          p.write_text(x.replace(old, new, 1))
          PY

          rm .github/workflows/repair-settings-keyboard-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/fr/neamar/kiss/SettingsFragment.java app/src/main/res/xml/preferences.xml .github/workflows/repair-settings-keyboard-wiring.yml
          git commit -m "Wire keyboard selection into Settings without unrelated changes"
          git push origin HEAD:build/3.30.33
