name: Verify Text Overflow 3.30.75

on:
  push:
    branches:
      - feature/3.30.75-text-overflow-modes

permissions:
  contents: write

concurrency:
  group: verify-text-overflow-3.30.75
  cancel-in-progress: false

jobs:
  verify-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/3.30.75-text-overflow-modes
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify exact 3.30.74 application baseline
        run: |
          set -euo pipefail
          BASE=b17a3caecb9d7b25b7c61de20f9d155675e331f3
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --quiet "$BASE" -- app
          git show "$BASE:app/build.gradle" | grep -F 'versionCode 502'
          git show "$BASE:app/build.gradle" | grep -F 'versionName "3.30.74"'
          git show "$BASE:app/src/main/java/fr/neamar/kiss/ui/AutoMarqueeTextView.java" | grep -F 'Single-line text that continuously scrolls'
          git show "$BASE:app/src/main/java/fr/neamar/kiss/ui/AutoScrollPreviewTextView.java" | grep -F 'private static final long STEP_DELAY_MS = 2400L;'

      - name: Apply exact two-mode text overflow implementation
        run: |
          set -euo pipefail
          python3 .github/scripts/run_text_overflow_33075.py
          git diff --check

      - name: Verify settings and both renderer paths
        run: |
          set -euo pipefail
          grep -F 'versionCode 503' app/build.gradle
          grep -F 'versionName "3.30.75"' app/build.gradle
          grep -F 'app:key="smart-text-overflow-mode"' app/src/main/res/xml/preferences.xml
          grep -F '<item>Auto-scroll text (compact tiles)</item>' app/src/main/res/values/arrays.xml
          grep -F '<item>Auto-expand tiles (show 100% of text)</item>' app/src/main/res/values/arrays.xml
          grep -F '"vertical".equals(layout) || "vertical_cards".equals(layout)' app/src/main/java/fr/neamar/kiss/ui/TextOverflowMode.java
          grep -F 'TextOverflowMode.isAutoExpandForHistory(view.getContext())' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -F 'configureExpandedText((TextView) candidate);' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -F 'TextOverflowMode.isAutoExpandForHistory(mainActivity)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -F 'if (isAutoExpand()) return;' app/src/main/java/fr/neamar/kiss/ui/AutoScrollPreviewTextView.java
          grep -F 'if (isAutoExpand()) requestLayout();' app/src/main/java/fr/neamar/kiss/ui/AutoMarqueeTextView.java
          grep -F '"smart-text-overflow-mode"' app/src/main/java/fr/neamar/kiss/SettingsActivity.java

          python3 - <<'PY'
          from pathlib import Path
          card = Path('app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java').read_text()
          assert card.count('textRowHeight(') == 6, card.count('textRowHeight(')
          assert 'private int textRowHeight(int scrollingHeight)' in card
          assert 'if (TextOverflowMode.isAutoExpandForHistory(mainActivity)) return false;' in card

          adapter = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java').read_text()
          body = adapter[adapter.index('private void configureVerticalHistoryBodyLines'):adapter.index('private void applyVerticalHistoryWidth')]
          assert body.index('TextOverflowMode.isAutoExpandForHistory') < body.index('TextUtils.TruncateAt.END')
          assert 'configureExpandedText' in body

          preview = Path('app/src/main/java/fr/neamar/kiss/ui/AutoScrollPreviewTextView.java').read_text()
          measure = preview[preview.index('protected void onMeasure'):preview.index('private void applyConfiguredBehavior')]
          assert 'if (isAutoExpand()) return;' in measure
          restart = preview[preview.index('private void restartAutoScroll'):preview.index('private void advancePreview')]
          assert 'attached && !isAutoExpand()' in restart
          print('Verified: expand mode removes text caps/timers and both vertical renderers are wired')
          PY

      - name: Focused text overflow policy tests
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --tests 'fr.neamar.kiss.ui.TextOverflowModeTest' --stacktrace

      - name: Full clean verification
        run: |
          set -euo pipefail
          ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify both APK manifests are the upgrade
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          APK_ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [ -n "$APK_ANALYZER" ]; then
            for apk in "$DEBUG_APK" "$RELEASE_APK"; do
              NAME="$($APK_ANALYZER manifest version-name "$apk")"
              CODE="$($APK_ANALYZER manifest version-code "$apk")"
              echo "$apk => versionName=$NAME versionCode=$CODE"
              test "$NAME" = "3.30.75"
              test "$CODE" = "503"
            done
          else
            AAPT="$(find "$ANDROID_HOME" -type f -name aapt 2>/dev/null | sort -V | tail -n 1 || true)"
            test -n "$AAPT"
            for apk in "$DEBUG_APK" "$RELEASE_APK"; do
              BADGING="$($AAPT dump badging "$apk" | head -n 1)"
              echo "$BADGING"
              echo "$BADGING" | grep -F "versionCode='503'"
              echo "$BADGING" | grep -F "versionName='3.30.75'"
            done
          fi

      - name: Upload verified Smart S Launcher 3.30.75 APK
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-3.30.75-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: Verify final changed-file surface and commit source only
        run: |
          set -euo pipefail
          BASE=b17a3caecb9d7b25b7c61de20f9d155675e331f3

          git rm .github/scripts/apply_text_overflow_33075.py
          git rm .github/scripts/run_text_overflow_33075.py
          git rm .github/workflows/verify-text-overflow-3.30.75.yml

          printf '%s\n' \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/SettingsActivity.java \
            app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java \
            app/src/main/java/fr/neamar/kiss/ui/AutoMarqueeTextView.java \
            app/src/main/java/fr/neamar/kiss/ui/AutoScrollPreviewTextView.java \
            app/src/main/java/fr/neamar/kiss/ui/TextOverflowMode.java \
            app/src/main/res/values/arrays.xml \
            app/src/main/res/xml/preferences.xml \
            app/src/test/java/fr/neamar/kiss/ui/TextOverflowModeTest.java | sort > /tmp/expected-final
          {
            git diff --name-only "$BASE"
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-final
          diff -u /tmp/expected-final /tmp/actual-final
          git diff --check

          grep -F 'versionCode 503' app/build.gradle
          grep -F 'versionName "3.30.75"' app/build.gradle
          grep -F 'app:key="smart-text-overflow-mode"' app/src/main/res/xml/preferences.xml
          test -f app/src/main/java/fr/neamar/kiss/ui/TextOverflowMode.java
          test -f app/src/test/java/fr/neamar/kiss/ui/TextOverflowModeTest.java

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add selectable text overflow modes in 3.30.75'
          git push origin HEAD:feature/3.30.75-text-overflow-modes
