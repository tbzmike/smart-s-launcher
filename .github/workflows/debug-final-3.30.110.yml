name: Final debug APK 3.30.110

on:
  push:
    branches:
      - feature/search-bottom-fix-3.30.110

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Apply and verify patch
        run: |
          python3 .github/scripts/fix_search_bottom_3_30_110.py
          grep -q 'versionName "3.30.110"' app/build.gradle
          grep -q 'moveExactLaunchTargetsToBottom(updatedResults, query)' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -q 'EXACT_REACHABILITY_RELEVANCE = 1_000_000' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Verify debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Finalize source
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix_search_bottom_3_30_110.py .github/workflows/fix-search-bottom-3.30.110.yml .github/workflows/fast-build-search-bottom-3.30.110.yml .github/workflows/debug-final-3.30.110.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java .github/scripts/fix_search_bottom_3_30_110.py .github/workflows/fix-search-bottom-3.30.110.yml .github/workflows/fast-build-search-bottom-3.30.110.yml .github/workflows/debug-final-3.30.110.yml
          git diff --cached --check
          git commit -m 'Fix exact launch targets staying at search bottom'
          git push origin HEAD:feature/search-bottom-fix-3.30.110
      - name: Verify final scope
        run: |
          git fetch origin feature/search-bottom-fix-3.30.110
          test "$(git diff --name-only e6ffc1dc7675f0997527b0652b2748d1c3408555..origin/feature/search-bottom-fix-3.30.110 | wc -l)" -eq 2
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartSLauncher-3.30.110-debug-final
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
