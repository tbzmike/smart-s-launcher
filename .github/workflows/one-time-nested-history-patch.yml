name: One-time nested history interaction patch

on:
  push:
    branches:
      - feature/3.30.44-in-app-updater

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ !contains(github.event.head_commit.message, 'Promote nested history interactions') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/3.30.44-in-app-updater
          fetch-depth: 0
      - name: Apply exact nested-interaction promotion changes
        shell: python
        run: |
          from pathlib import Path

          adapter = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java')
          text = adapter.read_text(encoding='utf-8')
          anchor = '''    private void promoteHistoryResult(Result<?> selected) {\n        if (SearchHandler.getInstance().getLastSearchType() != Searcher.Type.HISTORY\n                || selected == null || results.size() < 2) return;'''
          replacement = '''    public void promoteHistoryPojo(Pojo pojo) {\n        if (pojo == null) return;\n        String historyId = pojo.getHistoryId();\n        for (Result<?> candidate : results) {\n            if (candidate == null || candidate.getPojo() == null) continue;\n            Pojo candidatePojo = candidate.getPojo();\n            if (candidatePojo == pojo\n                    || (historyId != null && historyId.equals(candidatePojo.getHistoryId()))) {\n                promoteHistoryResult(candidate);\n                return;\n            }\n        }\n    }\n\n    private void promoteHistoryResult(Result<?> selected) {\n        if (SearchHandler.getInstance().getLastSearchType() != Searcher.Type.HISTORY\n                || selected == null || results.size() < 2) return;'''
          if text.count(anchor) != 1:
              raise SystemExit('RecordAdapter promotion anchor mismatch')
          adapter.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          communication = Path('app/src/main/java/fr/neamar/kiss/result/CommunicationResult.java')
          text = communication.read_text(encoding='utf-8')
          import_anchor = '''import fr.neamar.kiss.R;\nimport fr.neamar.kiss.icons.IconPack;'''
          import_replacement = '''import fr.neamar.kiss.MainActivity;\nimport fr.neamar.kiss.R;\nimport fr.neamar.kiss.icons.IconPack;'''
          if text.count(import_anchor) != 1:
              raise SystemExit('CommunicationResult import anchor mismatch')
          text = text.replace(import_anchor, import_replacement, 1)

          open_anchor = '''    private void openMessageAndRecord(Context context, View view) {\n        RecentLaunchTracker.remember(pojo);\n        recordLaunch(context, null);\n        openMessage(context, view, true);\n    }'''
          open_replacement = '''    private void openMessageAndRecord(Context context, View view) {\n        RecentLaunchTracker.remember(pojo);\n        promoteVisibleHistoryItem(context);\n        recordLaunch(context, null);\n        openMessage(context, view, true);\n    }'''
          if text.count(open_anchor) != 1:
              raise SystemExit('CommunicationResult open interaction anchor mismatch')
          text = text.replace(open_anchor, open_replacement, 1)

          mark_anchor = '''    private void markMessageRead(Context context) {\n        RecentLaunchTracker.remember(pojo);\n        recordLaunch(context, null);\n        String notificationId = effectiveNotificationId(context);'''
          mark_replacement = '''    private void markMessageRead(Context context) {\n        RecentLaunchTracker.remember(pojo);\n        promoteVisibleHistoryItem(context);\n        recordLaunch(context, null);\n        String notificationId = effectiveNotificationId(context);'''
          if text.count(mark_anchor) != 1:
              raise SystemExit('CommunicationResult mark-read interaction anchor mismatch')
          text = text.replace(mark_anchor, mark_replacement, 1)

          method_anchor = '''    private void configureVerifiedMarkRead(Button markRead, String notificationId) {'''
          method_replacement = '''    private void promoteVisibleHistoryItem(Context context) {\n        if (!(context instanceof MainActivity)) return;\n        MainActivity activity = (MainActivity) context;\n        if (activity.adapter != null) activity.adapter.promoteHistoryPojo(pojo);\n    }\n\n    private void configureVerifiedMarkRead(Button markRead, String notificationId) {'''
          if text.count(method_anchor) != 1:
              raise SystemExit('CommunicationResult helper anchor mismatch')
          text = text.replace(method_anchor, method_replacement, 1)
          communication.write_text(text, encoding='utf-8')
      - name: Verify exact scope and syntax whitespace
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = $'app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java\napp/src/main/java/fr/neamar/kiss/result/CommunicationResult.java'
          git diff --check
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/result/CommunicationResult.java
          git commit -m "Promote nested history interactions"
          git push origin HEAD:feature/3.30.44-in-app-updater
