name: Refine Smart S 3.30.78 Home Lifecycle + Notification Flash

on:
  push:
    branches:
      - fix/3.30.78-vertical-card-notification-flash
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refine-33078-notification-flash
  cancel-in-progress: true

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify exact current 3.30.78 baseline
        run: |
          set -euxo pipefail
          NOTIFY=app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardNotificationHistoryForwarder.java
          CARDS=app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'versionCode 506' app/build.gradle
          grep -q 'versionName "3.30.78"' app/build.gradle
          grep -q 'import android.graphics.drawable.AnimationDrawable;' "$NOTIFY"
          grep -q 'border.addFrame(createAttentionFrame(dp(4), Color.WHITE)' "$NOTIFY"
          grep -q 'private final Map<String, View> warmHistoryCards' "$CARDS"
          grep -q 'captureWarmHistoryCards()' "$CARDS"
          grep -q 'restoreWarmHistoryCards' "$CARDS"

      - name: Remove unsafe warm Home View retention
        run: |
          set -euxo pipefail
          python3 .github/scripts/fix_33078_remove_warm_card_views.py

      - name: Verify lifecycle safety, flashing, and feature preservation
        run: |
          set -euxo pipefail
          NOTIFY=app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardNotificationHistoryForwarder.java
          CARDS=app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          SEARCH=app/src/main/java/fr/neamar/kiss/searcher/SearchHandler.java
          ICONS=app/src/main/java/fr/neamar/kiss/utils/AppIconMemoryCache.java

          grep -q 'versionCode 506' app/build.gradle
          grep -q 'versionName "3.30.78"' app/build.gradle

          # Notification flashing remains restored and lightweight.
          grep -q 'import android.graphics.drawable.AnimationDrawable;' "$NOTIFY"
          grep -q 'private static final int ATTENTION_PULSE_MS = 550;' "$NOTIFY"
          grep -q 'border.addFrame(createAttentionFrame(dp(2), Color.argb(235, 255, 176, 32))' "$NOTIFY"
          grep -q 'border.addFrame(createAttentionFrame(dp(4), Color.WHITE)' "$NOTIFY"
          grep -q 'card.addOnLayoutChangeListener(layoutListener);' "$NOTIFY"
          grep -q 'binding.border.stop();' "$NOTIFY"
          ! grep -q 'attentionHandler' "$NOTIFY"
          ! grep -q 'attentionPulse' "$NOTIFY"

          # Complete Activity-owned Home View trees must never survive QUERY/external-app use.
          ! grep -q 'warmHistoryCards' "$CARDS"
          ! grep -q 'warmHistoryScrollY' "$CARDS"
          ! grep -q 'captureWarmHistoryCards' "$CARDS"
          ! grep -q 'restoreWarmHistoryCards' "$CARDS"
          grep -q 'column.removeAllViews();' "$CARDS"
          grep -q 'reconcileActiveQueryCards()' "$CARDS"

          # Keep the safe lightweight 3.30.77 caches and other performance work.
          grep -q 'homeResultSnapshot' "$SEARCH"
          grep -q 'canRetainWarmResult' "$SEARCH"
          grep -q 'BITMAP_CACHE_BYTES' "$ICONS"
          grep -q 'snapshotResults()' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java

          # Existing behavior remains wired.
          grep -q 'NotificationTimelineState.markRead' "$NOTIFY"
          grep -q 'applyNotificationTimelinePreview' "$NOTIFY"
          grep -q 'applyEasyIconTap' "$NOTIFY"
          grep -q 'applyBottomSwipeTouchRecursively' "$NOTIFY"
          git diff --check

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify APK manifest versions
        run: |
          set -euxo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          "$AAPT" dump badging "$DEBUG_APK" | tee /tmp/debug-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee /tmp/release-badging.txt
          grep -q "versionCode='506'" /tmp/debug-badging.txt
          grep -q "versionName='3.30.78'" /tmp/debug-badging.txt
          grep -q "versionCode='506'" /tmp/release-badging.txt
          grep -q "versionName='3.30.78'" /tmp/release-badging.txt

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Smart-S-Launcher-3.30.78-debug.apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verified release APK
        uses: actions/upload-artifact@v6
        with:
          name: Smart-S-Launcher-3.30.78-release-unsigned.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Commit verified source changes
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          git diff --cached --check
          git commit -m 'Stop retaining full Home card View trees across launches'
          git push origin HEAD:fix/3.30.78-vertical-card-notification-flash
