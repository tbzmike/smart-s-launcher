name: Verify Smart S 3.30.196 changes on Android 15 and 16

on:
  push:
    branches:
      - fix/3.30.196-locked-popup-auto-data

jobs:
  android:
    name: Locked popup, Advanced Auto Data, existing History and search API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify UI, persistence and previous features
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/verify_196_android.sh
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-data-history-api-${{ matrix.api }}
          path: verification-results
          archive: true
          if-no-files-found: ignore
