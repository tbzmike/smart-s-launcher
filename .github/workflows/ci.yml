          sudo udevadm trigger --name-match=kvm
      - name: Test real Android 35 history UI
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/verify_168_android.sh
      - name: Preserve Android verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: history-168-android-35-evidence
          path: verification-results
          archive: true
          if-no-files-found: ignore

