name: App testing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Lint code
        id: lint
        continue-on-error: true
        run: bash ./gradlew lint --stacktrace
      - name: Print lint report
        if: ${{ always() }}
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          fi
      - name: Unit tests
        if: ${{ always() }}
        run: bash ./gradlew testDebugUnitTest --stacktrace
      - name: Upload lint report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          archive: true
      - name: Enforce lint result
        if: ${{ always() && steps.lint.outcome == 'failure' }}
        run: exit 1
  apk:
    name: Generate APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Prepare independent history icon sliders
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/icon-size-controls-ui4' }}
        shell: bash
        run: |
          if [ -f .github/scripts/add_independent_history_icon_sliders.py ]; then
            python3 .github/scripts/add_independent_history_icon_sliders.py
          else
            echo 'Slider preparation script already removed; source is already prepared.'
          fi
      - name: Verify prepared source
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/icon-size-controls-ui4' }}
        shell: bash
        run: |
          set -e
          if [ -f .github/scripts/add_independent_history_icon_sliders.py ]; then
            grep -q 'Notification / profile picture size (%)' app/src/main/res/xml/preferences.xml
            grep -q 'Shortcut icon size (%)' app/src/main/res/xml/preferences.xml
            grep -q 'Settings / feature icon size (%)' app/src/main/res/xml/preferences.xml
            grep -q 'Contact / avatar picture size (%)' app/src/main/res/xml/preferences.xml
            grep -q 'smart-list-notification-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
            grep -q 'smart-list-shortcut-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
            grep -q 'smart-list-feature-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
            grep -q 'smart-list-contact-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
            grep -q '3.30.107' app/build.gradle
          else
            grep -q 'smart-list-notification-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
            grep -q 'smart-list-shortcut-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
            grep -q 'smart-list-feature-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
            grep -q 'smart-list-contact-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
            grep -q '3.30.107' app/build.gradle
          fi
      - name: Build APKs
        run: bash ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Unit tests on prepared source
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/icon-size-controls-ui4' }}
        run: bash ./gradlew test --stacktrace
      - name: Upload debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: SmartSLauncher-3.30.107-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
      - name: Upload release APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: SmartSLauncher-3.30.107-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: false
      - name: Commit prepared source and restore original CI
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/icon-size-controls-ui4' }}
        shell: bash
        run: |
          set -e
          if [ ! -f .github/scripts/add_independent_history_icon_sliders.py ]; then
            echo 'No temporary preparation script remains; source commit already exists.'
            exit 0
          fi
          git show 234f086dec7691a470e10c98a7770d5940a8e14b:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/scripts/add_independent_history_icon_sliders.py
          rm -f .github/workflows/add-manual-history-icon-sliders.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/xml/preferences.xml app/src/main/res/xml/preferences_smart_features.xml app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java app/build.gradle .github/scripts/add_independent_history_icon_sliders.py .github/workflows/add-manual-history-icon-sizing.yml .github/workflows/ci.yml
          git commit -m 'Expose independent history icon sliders'
          git push origin HEAD:${{ github.head_ref }}
