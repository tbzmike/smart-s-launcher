name: App testing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Lint code
        id: lint
        continue-on-error: true
        run: bash ./gradlew lint --stacktrace
      - name: Print lint report
        if: ${{ always() }}
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          fi
      - name: Unit tests
        if: ${{ always() }}
        run: bash ./gradlew testDebugUnitTest --stacktrace
      - name: Upload lint report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          archive: true
      - name: Enforce lint result
        if: ${{ always() && steps.lint.outcome == 'failure' }}
        run: exit 1
  apk:
    name: Generate APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Build APKs
        run: bash ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Upload debug APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
      - name: Upload release APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: false
