# Smart S Launcher CI: test, build, then expose only the newest fully-green debug APK to the updater
name: App testing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Lint code
        id: lint
        continue-on-error: true
        run: bash ./gradlew lint --stacktrace
      - name: Print lint report
        if: ${{ always() }}
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          fi
      - name: Unit tests
        if: ${{ always() }}
        run: bash ./gradlew testDebugUnitTest --stacktrace
      - name: Upload lint report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          archive: true
      - name: Enforce lint result
        if: ${{ always() && steps.lint.outcome == 'failure' }}
        run: exit 1

  apk:
    name: Generate APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Build APKs
        run: bash ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Upload debug APK ZIP
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: true
      - name: Upload release APK ZIP
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: true

  publish-green:
    name: Publish latest green updater APK
    needs: [test, apk]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: smart-s-latest-green-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Download verified debug APK
        uses: actions/download-artifact@v8
        with:
          name: Smart-S-Launcher-debug
          path: green-apk
      - name: Prepare latest-green manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find green-apk -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" app-debug.apk
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          gradle = Path("app/build.gradle").read_text(encoding="utf-8")
          version_match = re.search(r'^\s*versionName\s+["\']([^"\']+)["\']\s*$', gradle, re.MULTILINE)
          code_match = re.search(r'^\s*versionCode\s+(\d+)\s*$', gradle, re.MULTILINE)
          if not version_match or not code_match:
              raise SystemExit("Unable to read versionName/versionCode from app/build.gradle")

          data = {
              "version": version_match.group(1),
              "versionCode": int(code_match.group(1)),
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "sha": os.environ["GITHUB_SHA"],
              "variant": "debug",
              "apkName": "app-debug.apk",
              "apkUrl": "https://github.com/tbzmike/smart-s-launcher/releases/download/latest-green/app-debug.apk"
          }
          with open("latest-green.json", "w", encoding="utf-8") as f:
              json.dump(data, f, separators=(",", ":"))
              f.write("\n")
          PY
      - name: Publish only if this run is newer than the currently published green run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-green
          if gh release download latest-green --pattern latest-green.json --dir previous-green >/dev/null 2>&1; then
            PREVIOUS_RUN="$(python3 -c 'import json; print(json.load(open("previous-green/latest-green.json"))["runNumber"])')"
            if [ "$PREVIOUS_RUN" -gt "$GITHUB_RUN_NUMBER" ]; then
              echo "A newer green run #$PREVIOUS_RUN is already published; not replacing it with #$GITHUB_RUN_NUMBER."
              exit 0
            fi
          fi
          gh release delete latest-green --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create latest-green \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest green Smart S Launcher build" \
            --notes "Automatically published from successful App testing run #$GITHUB_RUN_NUMBER ($GITHUB_SHA)." \
            latest-green.json \
            app-debug.apk
