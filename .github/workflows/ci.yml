      - name: Preserve Android verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: history-167-android-35-evidence
          path: verification-results
          archive: true
          if-no-files-found: ignore

  android-168:
    name: Verify long text, timestamps and scrollbar on Android 35
    if: ${{ startsWith(github.ref, 'refs/heads/fix/3.30.168-history-overflow-fading') }}
    needs: [test, apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
