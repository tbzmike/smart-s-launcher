          head -n 1 verified-apk/package-badging.txt | grep -F "name='com.tbzmike.smartslauncher'" | grep -F "versionCode='596'" | grep -F "versionName='3.30.168'"
          sha256sum "$OUT" | tee verified-apk/Smart-S-Launcher-3.30.168.sha256
          git rev-parse HEAD > verified-apk/source-commit.txt
      - name: Publish signed APK build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-3.30.168-signed
          path: verified-apk
          archive: true
          if-no-files-found: error
          retention-days: 90

  publish-signed-168:
    name: Publish Android-verified and originally signed 3.30.168
    if: ${{ startsWith(github.ref, 'refs/heads/fix/3.30.168-history-overflow-fading') }}
    needs: [signed-168]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Smart-S-Launcher-3.30.168-signed
          path: signed
      - name: Prepare Android verified signed release
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp signed/Smart-S-Launcher-3.30.168.apk SmartSLauncher.apk
          test -s SmartSLauncher.apk
          grep -F "versionCode='596'" signed/package-badging.txt
          grep -F "versionName='3.30.168'" signed/package-badging.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path("SmartSLauncher.apk")
          manifest = {
              "version": "3.30.168", "versionCode": 596,
              "runId": int(os.environ["SOURCE_RUN_ID"]),
              "sha": os.environ["SOURCE_SHA"], "variant": "signed_release",
              "apkName": "SmartSLauncher.apk",
              "apkUrl": "https://github.com/tbzmike/smart-s-launcher/releases/download/v3.30.168/SmartSLauncher.apk",
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest()
          }
          Path("latest-green.json").write_text(json.dumps(manifest, separators=(',', ':')) + '\n')
          PY
      - name: Publish installable signed APK after tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v3.30.168"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber SmartSLauncher.apk latest-green.json
          else
            gh release create "$TAG" --latest --target "$GITHUB_SHA" \
              --title "Smart S Launcher v3.30.168" \
              --notes "Signed update built from 3.30.167. History Auto Scroll/Auto Expand, wrapping, width boundaries, and scrollbar fading verified with unit tests and Android 35 regression tests. Original production app signing certificate verified." \
              SmartSLauncher.apk latest-green.json
          fi
      - name: Update in-app updater to signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PUSH_DIR="$RUNNER_TEMP/smart-s-168-updater"
          mkdir -p "$PUSH_DIR"
          cp latest-green.json "$PUSH_DIR/"
          cd "$PUSH_DIR"
          git init -q
          git checkout -qb updater-channel
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-green.json
          git commit -qm "Publish signed Smart S Launcher 3.30.168"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:updater-channel
  android-169:
    name: Verify long text, timestamps and scrollbar on Android 35
    if: ${{ startsWith(github.ref, 'refs/heads/feature/3.30.169-pixel-history-shortcut-tags') }}
    needs: [test, apk]
