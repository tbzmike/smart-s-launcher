name: App testing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Lint code
        id: lint
        continue-on-error: true
        run: bash ./gradlew lint --stacktrace
      - name: Print lint report
        if: ${{ always() }}
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          fi
      - name: Unit tests
        if: ${{ always() }}
        run: bash ./gradlew testDebugUnitTest --stacktrace
      - name: Upload lint report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          archive: true
      - name: Enforce lint result
        if: ${{ always() && steps.lint.outcome == 'failure' }}
        run: exit 1
      - name: Upload unit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest
          archive: true
          if-no-files-found: ignore
  apk:
    name: Generate APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Build APKs
        run: bash ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Upload debug APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
      - name: Upload release APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: false
  android-166:
    name: Compare 153 and 166 on Android ${{ matrix.api }}
    if: ${{ startsWith(github.ref, 'refs/heads/feature/3.30.166-from-153') }}
    needs: [test, apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify additive baseline port
        run: python3 scripts/verify_153_feature_port.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify baseline, upgrade, and new features
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/verify_166_android.sh
      - name: Upload Android verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-verification-api-${{ matrix.api }}
          path: verification-results
          archive: true
          if-no-files-found: ignore
  signed-166:
    name: Sign verified 3.30.166 APK
    if: ${{ startsWith(github.ref, 'refs/heads/feature/3.30.166-from-153') }}
    needs: [test, apk, android-166]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify source guard
        run: python3 scripts/verify_153_feature_port.py
      - uses: actions/download-artifact@v8
        with:
          name: app-release-unsigned.apk
          path: unsigned-release
      - name: Sign and verify package identity
        shell: bash
        env:
          SMART_S_SIGNING_KEY_B64: ${{ secrets.SMART_S_SIGNING_KEY_B64 }}
          SMART_S_SIGNING_STORE_PASSWORD: ${{ secrets.SMART_S_SIGNING_STORE_PASSWORD }}
          SMART_S_SIGNING_KEY_ALIAS: ${{ secrets.SMART_S_SIGNING_KEY_ALIAS }}
          SMART_S_SIGNING_KEY_PASSWORD: ${{ secrets.SMART_S_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/smart-s-166-release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
          printf '%s' "$SMART_S_SIGNING_KEY_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          mkdir -p verified-apk
          OUT="verified-apk/Smart-S-Launcher-3.30.166.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-key-alias "$SMART_S_SIGNING_KEY_ALIAS" \
            --ks-pass env:SMART_S_SIGNING_STORE_PASSWORD \
            --key-pass env:SMART_S_SIGNING_KEY_PASSWORD \
            --out "$OUT" unsigned-release/app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" | tee verified-apk/apk-verification.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' verified-apk/apk-verification.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$CERT" = '9da351d1880aee204832325b32bbe99f39f2b2b3dc178ec0e5d99d26ac236b53'
          "$BUILD_TOOLS/aapt" dump badging "$OUT" > verified-apk/package-badging.txt
          head -n 1 verified-apk/package-badging.txt | grep -F "name='com.tbzmike.smartslauncher'" | grep -F "versionCode='594'" | grep -F "versionName='3.30.166'"
          sha256sum "$OUT" | tee verified-apk/Smart-S-Launcher-3.30.166.sha256
          git rev-parse HEAD > verified-apk/source-commit.txt
          cp "$BUILD_TOOLS/lib/apksigner.jar" verified-apk/apksigner.jar
      - name: Enable KVM for signed release verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and search with final signed release
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/verify_signed_166_android.sh
      - name: Upload signed release verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-android-verification
          path: verification-results
          archive: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-3.30.166-signed
          path: verified-apk
          archive: true
          if-no-files-found: error
          retention-days: 90

  signed-167:
    name: Sign installable Smart S Launcher 3.30.167
    if: ${{ startsWith(github.ref, 'refs/heads/fix/3.30.167-history-style-timestamps') }}
    needs: [test, apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: app-release-unsigned.apk
          path: unsigned-release
      - name: Sign and verify original app identity
        shell: bash
        env:
          SMART_S_SIGNING_KEY_B64: ${{ secrets.SMART_S_SIGNING_KEY_B64 }}
          SMART_S_SIGNING_STORE_PASSWORD: ${{ secrets.SMART_S_SIGNING_STORE_PASSWORD }}
          SMART_S_SIGNING_KEY_ALIAS: ${{ secrets.SMART_S_SIGNING_KEY_ALIAS }}
          SMART_S_SIGNING_KEY_PASSWORD: ${{ secrets.SMART_S_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/smart-s-167-release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
