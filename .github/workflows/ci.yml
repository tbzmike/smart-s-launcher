        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/verify_169_android.sh
      - name: Preserve Android verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: history-169-android-35-evidence
          path: verification-results
          archive: true
          if-no-files-found: ignore

