# Smart S Launcher CI: test and build every branch. The default branch workflow
# publish-latest-green.yml publishes only fully-green, version-bumped builds.
name: App testing

on:
  push:
    branches:
      - '**'
      - '!updater-channel'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Lint code
        id: lint
        continue-on-error: true
        run: bash ./gradlew lint --stacktrace
      - name: Print lint report
        if: ${{ always() }}
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          fi
      - name: Unit tests
        if: ${{ always() }}
        run: bash ./gradlew testDebugUnitTest --stacktrace
      - name: Upload lint report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          archive: true
      - name: Enforce lint result
        if: ${{ always() && steps.lint.outcome == 'failure' }}
        run: exit 1

  apk:
    name: Generate APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Build APKs
        run: bash ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Verify APK version metadata
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CODE="$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n1)"
          EXPECTED_NAME="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          test -n "$EXPECTED_CODE"
          test -n "$EXPECTED_NAME"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"

          for APK in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk; do
            PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n1)"
            ACTUAL_CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
            ACTUAL_NAME="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
            echo "$APK -> versionName=$ACTUAL_NAME versionCode=$ACTUAL_CODE"
            test "$ACTUAL_CODE" = "$EXPECTED_CODE"
            test "$ACTUAL_NAME" = "$EXPECTED_NAME"
          done
      - name: Upload debug APK ZIP
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: true
      - name: Upload release APK ZIP
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: true
