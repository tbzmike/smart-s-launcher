            --out "$OUT" unsigned-release/app-release-unsigned.apk
          "$SDK/apksigner" verify --verbose --print-certs "$OUT" | tee verified-apk/apk-verification.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' verified-apk/apk-verification.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$CERT" = '9da351d1880aee204832325b32bbe99f39f2b2b3dc178ec0e5d99d26ac236b53'
          "$SDK/aapt" dump badging "$OUT" > verified-apk/package-badging.txt
          head -n 1 verified-apk/package-badging.txt | grep -F "name='com.tbzmike.smartslauncher'" | grep -F "versionCode='595'" | grep -F "versionName='3.30.167'"
          sha256sum "$OUT" | tee verified-apk/Smart-S-Launcher-3.30.167.sha256
          git rev-parse HEAD > verified-apk/source-commit.txt
      - name: Publish signed APK build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-3.30.167-signed
          path: verified-apk
          archive: true
          if-no-files-found: error
          retention-days: 90

  android-167:
    name: Validate history sizing and timestamps on Android 35
    if: ${{ startsWith(github.ref, 'refs/heads/fix/3.30.167-history-style-timestamps') }}
    needs: [test, apk]
