# Triggered after valid workflow was established on build/3.30.22.
name: Finish vertical memory repair 3.30.22

on:
  push:
    branches:
      - build/3.30.22

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Apply verified source repair
        run: python3 .github/scripts/finish_33022_memory.py

      - name: Verify exact remaining source scope
        run: |
          set -euxo pipefail
          git diff --name-only | sort > /tmp/changed
          cat > /tmp/expected <<'EOF'
          app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          app/src/main/java/fr/neamar/kiss/result/Result.java
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/changed

          grep -q 'versionCode 450' app/build.gradle
          grep -q 'versionName "3.30.22"' app/build.gradle
          grep -q 'MAX_FIRST_SEEN_ENTRIES = 512' app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java
          grep -q 'STATS_REFRESH_MS = 30_000L' app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java
          grep -q 'helper.close()' app/src/main/java/fr/neamar/kiss/db/LaunchStatsProvider.java
          grep -q 'text.isSelected() != overflow' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -q 'MAX_ACCENT_ENTRIES = 512' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
          grep -q 'UniversalHistoryTimestamp.invalidateStats()' app/src/main/java/fr/neamar/kiss/result/Result.java

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Commit verified remaining repair
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java \
            app/src/main/java/fr/neamar/kiss/result/Result.java
          git commit -m 'Finish 3.30.22 vertical memory and stutter repair'
          git push origin HEAD:build/3.30.22
