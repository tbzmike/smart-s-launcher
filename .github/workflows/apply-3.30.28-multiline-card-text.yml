name: Apply Smart S Launcher 3.30.28 Multiline Card Text

on:
  push:
    branches:
      - build/3.30.28
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.28

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Apply guarded source repair
        run: python3 .github/scripts/apply_33028_multiline_card_text.py

      - name: Verify exact changed scope and invariants
        shell: bash
        run: |
          git diff --check
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java \
            app/src/main/java/fr/neamar/kiss/ui/VerticalCardTextView.java | sort)
          test "$CHANGED" = "$EXPECTED" || { echo 'Unexpected changed files:'; git diff --name-only; exit 1; }
          grep -q 'versionCode 456' app/build.gradle
          grep -q 'versionName "3.30.28"' app/build.gradle
          grep -q 'cardTextLineBudget' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'heightPercent >= 145' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'configureCollapsedMessage(activeText, textLineBudget)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'setMaxLines(lineBudget)' app/src/main/java/fr/neamar/kiss/ui/VerticalCardTextView.java
          ! grep -q 'TruncateAt.MARQUEE' app/src/main/java/fr/neamar/kiss/ui/VerticalCardTextView.java

      - name: Full clean verification
        run: |
          chmod +x gradlew
          ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java app/src/main/java/fr/neamar/kiss/ui/VerticalCardTextView.java
          git commit -m 'Use 2 to 4 lines in Vertical Cards in 3.30.28'
          git push origin HEAD:build/3.30.28
