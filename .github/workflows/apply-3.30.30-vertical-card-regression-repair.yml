name: One-time 3.30.30 Vertical Cards regression repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.30
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply guarded regression repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {n}')
              p.write_text(s.replace(old, new, 1))

          # 1) Height must resize the card only. It must never silently scale font/icon/spacing.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java',
              '''    private void applyHeightGroup(int heightPercent) {\n        int clamped = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, heightPercent));\n        int iconPercent = Math.max(60, Math.min(180, clamped));\n        int namePercent = Math.max(70, Math.min(170, clamped));\n        int spacing = Math.max(4, Math.min(36, Math.round(12f * clamped / 100f)));\n\n        prefs.edit()\n                .putInt(PREF_HEIGHT, clamped)\n                .putInt(PREF_ICON, iconPercent)\n                .putInt(PREF_NAME, namePercent)\n                .putInt(PREF_SPACING, spacing)\n                .apply();\n        rebuildCards();\n        applyWidthSoon();\n    }''',
              '''    private void applyHeightGroup(int heightPercent) {\n        int clamped = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, heightPercent));\n\n        // Height is an independent geometry control. Do not mutate icon size, text size or\n        // spacing here: doing so made the Height slider enlarge fonts instead of exposing more\n        // wrapped lines. Those appearance preferences remain exactly as the user configured them.\n        prefs.edit()\n                .putInt(PREF_HEIGHT, clamped)\n                .apply();\n        rebuildCards();\n        applyWidthSoon();\n    }''')

          # Reset must likewise reset only the controls shown in this dialog (width + height).
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java',
              '''                    prefs.edit()\n                            .putInt(PREF_WIDTH, 100)\n                            .putInt(PREF_HEIGHT, 100)\n                            .putInt(PREF_ICON, 100)\n                            .putInt(PREF_NAME, 100)\n                            .putInt(PREF_SPACING, 12)\n                            .apply();''',
              '''                    prefs.edit()\n                            .putInt(PREF_WIDTH, 100)\n                            .putInt(PREF_HEIGHT, 100)\n                            .apply();''')

          # 2) Make the line budget genuinely progress 1 -> 4 with Height.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              '''    private int cardTextLineBudget(int heightPercent) {\n        if (heightPercent >= 145) return 4;\n        if (heightPercent >= 115) return 3;\n        return 2;\n    }''',
              '''    private int cardTextLineBudget(int heightPercent) {\n        if (heightPercent >= 140) return 4;\n        if (heightPercent >= 120) return 3;\n        if (heightPercent >= 100) return 2;\n        return 1;\n    }''')

          # The text area's minimum height must not be multiplied by the separate name/font-size
          # preference. Height determines line capacity; font size remains independent.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              '''    private int scaledTextHeight(int baseDp, int heightPercent, int textPercent) {\n        int cardScale = Math.max(70, heightPercent);\n        int textScale = Math.max(90, textPercent);\n        return dp(baseDp) * cardScale * textScale / 10000;\n    }''',
              '''    private int scaledTextHeight(int baseDp, int heightPercent, int textPercent) {\n        int cardScale = Math.max(70, heightPercent);\n        return dp(baseDp) * cardScale / 100;\n    }''')

          # 3) The notification/timestamp decorator must follow what is actually on screen, not a
          # stale SearchHandler type. Empty query == Vertical Cards history presentation. This keeps
          # the expensive decorators out of active typing while ensuring rebuilds restore timestamps.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java',
              '''            if (isHistorySearch()) {\n                verticalMapsCardForwarder.onDataSetChanged();\n                verticalCardGroupResizeController.onDataSetChanged();\n                verticalCardNotificationHistoryForwarder.onDataSetChanged();\n                verticalCardUsageForwarder.onDataSetChanged();\n            }''',
              '''            if (isVerticalCardHistoryPresentation()) {\n                verticalMapsCardForwarder.onDataSetChanged();\n                verticalCardGroupResizeController.onDataSetChanged();\n                verticalCardNotificationHistoryForwarder.onDataSetChanged();\n                verticalCardUsageForwarder.onDataSetChanged();\n            }''')

          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java',
              '''    private boolean isHistorySearch() {\n        return SearchHandler.getInstance().getLastSearchType() == Searcher.Type.HISTORY;\n    }''',
              '''    private boolean isHistorySearch() {\n        return SearchHandler.getInstance().getLastSearchType() == Searcher.Type.HISTORY;\n    }\n\n    private boolean isVerticalCardHistoryPresentation() {\n        return mainActivity.searchEditText == null\n                || TextUtils.isEmpty(mainActivity.searchEditText.getText());\n    }''')

          # Version bump.
          replace_once('app/build.gradle', 'versionCode 457', 'versionCode 458')
          replace_once('app/build.gradle', 'versionName "3.30.29"', 'versionName "3.30.30"')
          PY

      - name: Verify exact source scope and invariants
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java \
            app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java | sort)"
          test "$changed" = "$expected"
          grep -q 'versionCode 458' app/build.gradle
          grep -q 'versionName "3.30.30"' app/build.gradle
          grep -q 'if (heightPercent >= 140) return 4;' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'if (heightPercent >= 100) return 2;' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'return 1;' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'isVerticalCardHistoryPresentation()' app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java
          ! grep -A16 'private void applyHeightGroup' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java | grep -q 'PREF_NAME'
          ! grep -A16 'private void applyHeightGroup' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java | grep -q 'PREF_ICON'

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease

      - name: Commit verified app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java \
            app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java
          git commit -m 'Repair Vertical Cards regressions in 3.30.30'
          git push origin HEAD:build/3.30.30
