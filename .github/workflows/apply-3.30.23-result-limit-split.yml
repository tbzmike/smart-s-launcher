name: Apply Smart S Launcher 3.30.23 result-limit split

on:
  push:
    branches:
      - build/3.30.23

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.23

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Apply guarded 3.30.23 split
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/src/main/res/xml/preferences.xml',
              '''        <EditTextPreference\n            android:inputType="number"\n            app:defaultValue="20"\n            app:key="number-of-display-elements"\n            app:title="@string/number_of_display_items"\n            app:useSimpleSummaryProvider="true" />''',
              '''        <EditTextPreference\n            android:inputType="number"\n            app:defaultValue="20"\n            app:key="number-of-history-results"\n            app:title="Max number of history results"\n            app:useSimpleSummaryProvider="true" />''')

          replace_once(
              'app/src/main/res/xml/preferences.xml',
              '''        <PreferenceCategory\n            app:key="results-section"\n            app:title="@string/search_results_options">\n            <ListPreference''',
              '''        <PreferenceCategory\n            app:key="results-section"\n            app:title="@string/search_results_options">\n            <EditTextPreference\n                android:inputType="number"\n                app:defaultValue="20"\n                app:key="number-of-search-results"\n                app:title="Max number of search results"\n                app:useSimpleSummaryProvider="true" />\n            <ListPreference''')

          replace_once(
              'app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java',
              '''                MAX_RESULT_COUNT = Double.valueOf(prefs.getString("number-of-display-elements",\n                        String.valueOf(DEFAULT_MAX_RESULTS))).intValue();''',
              '''                String legacyValue = prefs.getString("number-of-display-elements",\n                        String.valueOf(DEFAULT_MAX_RESULTS));\n                MAX_RESULT_COUNT = Double.valueOf(prefs.getString("number-of-search-results",\n                        legacyValue)).intValue();''')

          replace_once(
              'app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java',
              '''            return Double.valueOf(prefs.getString("number-of-display-elements",\n                    String.valueOf(DEFAULT_MAX_RESULTS))).intValue();\n        } catch (NumberFormatException e) {''',
              '''            String legacyValue = prefs.getString("number-of-display-elements",\n                    String.valueOf(DEFAULT_MAX_RESULTS));\n            return Double.valueOf(prefs.getString("number-of-history-results",\n                    legacyValue)).intValue();\n        } catch (NumberFormatException | ClassCastException e) {''')

          replace_once(
              'app/src/main/java/fr/neamar/kiss/SettingsFragment.java',
              '''            } else if (key.equalsIgnoreCase("number-of-display-elements")) {\n                QuerySearcher.clearMaxResultCountCache();''',
              '''            } else if (key.equalsIgnoreCase("number-of-search-results")\n                    || key.equalsIgnoreCase("number-of-display-elements")) {\n                QuerySearcher.clearMaxResultCountCache();''')

          replace_once(
              'app/src/main/java/fr/neamar/kiss/MainActivity.java',
              '''        PreferenceManager.setDefaultValues(this, R.xml.preferences, false);\n        prefs = PreferenceManager.getDefaultSharedPreferences(this);''',
              '''        SharedPreferences existingPrefs = PreferenceManager.getDefaultSharedPreferences(this);\n        if (existingPrefs.contains("number-of-display-elements")) {\n            String legacyDisplayLimit;\n            try {\n                legacyDisplayLimit = existingPrefs.getString("number-of-display-elements", "20");\n            } catch (ClassCastException e) {\n                legacyDisplayLimit = "20";\n            }\n            SharedPreferences.Editor migration = existingPrefs.edit();\n            boolean changed = false;\n            if (!existingPrefs.contains("number-of-search-results")) {\n                migration.putString("number-of-search-results", legacyDisplayLimit);\n                changed = true;\n            }\n            if (!existingPrefs.contains("number-of-history-results")) {\n                migration.putString("number-of-history-results", legacyDisplayLimit);\n                changed = true;\n            }\n            if (changed) migration.apply();\n        }\n        PreferenceManager.setDefaultValues(this, R.xml.preferences, false);\n        prefs = PreferenceManager.getDefaultSharedPreferences(this);''')

          replace_once(
              'app/build.gradle',
              '''        // Smart S Launcher 3.30.22 - vertical-tile performance repair\n        versionCode 450\n        versionName "3.30.22"''',
              '''        // Smart S Launcher 3.30.23 - independent search/history result limits\n        versionCode 451\n        versionName "3.30.23"''')

          p = Path('.github/workflows/build.yml')
          text = p.read_text()
          if text.count('3.30.22') != 5 or text.count('450') != 2:
              raise SystemExit('build.yml: unexpected 3.30.22/450 occurrence count; refusing broad version replacement')
          text = text.replace('3.30.22', '3.30.23').replace('450', '451')
          p.write_text(text)

          xml = Path('app/src/main/res/xml/preferences.xml').read_text()
          if 'app:key="number-of-display-elements"' in xml:
              raise SystemExit('legacy combined preference is still exposed in Settings XML')
          if xml.count('app:key="number-of-search-results"') != 1:
              raise SystemExit('search result preference not exposed exactly once')
          if xml.count('app:key="number-of-history-results"') != 1:
              raise SystemExit('history result preference not exposed exactly once')

          q = Path('app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java').read_text()
          h = Path('app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java').read_text()
          if 'prefs.getString("number-of-search-results"' not in q:
              raise SystemExit('QuerySearcher is not wired to search-specific limit')
          if 'prefs.getString("number-of-history-results"' not in h:
              raise SystemExit('HistorySearcher is not wired to history-specific limit')
          if 'versionCode 451' not in Path('app/build.gradle').read_text() or 'versionName "3.30.23"' not in Path('app/build.gradle').read_text():
              raise SystemExit('3.30.23 version bump missing')
          PY

      - name: Verify only intended files changed
        run: |
          git diff --check
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' \
            .github/workflows/build.yml \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/MainActivity.java \
            app/src/main/java/fr/neamar/kiss/SettingsFragment.java \
            app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java \
            app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java \
            app/src/main/res/xml/preferences.xml | sort)
          test "$CHANGED" = "$EXPECTED" || { echo 'Unexpected changed files:'; git diff --name-only; exit 1; }

      - name: Test and build patched source
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Commit verified 3.30.23 app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/fr/neamar/kiss/MainActivity.java \
            app/src/main/java/fr/neamar/kiss/SettingsFragment.java \
            app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java \
            app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java \
            app/src/main/res/xml/preferences.xml
          git commit -m 'Split search and history result limits in 3.30.23'
          git push origin HEAD:build/3.30.23
