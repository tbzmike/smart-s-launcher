name: Deliver verified frozen-app source 3.30.08

on:
  push:
    branches:
      - build/3.30.08

permissions:
  contents: write

jobs:
  deliver-verified-source:
    if: github.event.head_commit.message == 'Deliver already verified frozen-app source'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.08
          fetch-depth: 0
      - name: Apply exact previously verified source patch
        run: |
          python3 -c 'from pathlib import Path; p=Path(".github/fix_frozen_state_33008.py"); s=p.read_text(); a=s.index("build = Path(\047.github/workflows/build.yml\047)"); marker="build.write_text(s)"; b=s.index(marker,a)+len(marker); p.write_text(s[:a]+s[b:])'
          python3 .github/fix_frozen_state_33008.py
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/fr/neamar/kiss/DataHandler.java"); s=p.read_text(); old="        if (\"smart-detect-frozen-apps\".equals(key)) {\n            reloadApps();\n        }\n"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,"",1))'
      - name: Verify exact production invariants
        run: |
          grep -q 'versionCode 436' app/build.gradle
          grep -q 'versionName "3.30.08"' app/build.gradle
          grep -q 'smart-detect-frozen-apps' app/src/main/java/fr/neamar/kiss/loader/LoadAppPojos.java
          grep -q 'getFrozenReconcileDelayMs' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q 'smart-keep-frozen-searchable' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q 'smart-grey-frozen-apps' app/src/main/java/fr/neamar/kiss/result/AppResult.java
          grep -q 'smart-auto-enable-frozen-apps' app/src/main/java/fr/neamar/kiss/result/AppResult.java
          grep -q 'smart-keep-frozen-history' app/src/main/java/fr/neamar/kiss/DataHandler.java
          ! grep -q 'FROZEN_RECONCILE_MS = 60000L' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          ! grep -A4 'void onSharedPreferenceChanged' app/src/main/java/fr/neamar/kiss/DataHandler.java | grep -q 'smart-detect-frozen-apps'
          git diff --check
      - name: Push production source only
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/loader/LoadAppPojos.java app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java app/src/main/java/fr/neamar/kiss/result/AppResult.java app/src/main/java/fr/neamar/kiss/DataHandler.java
          git diff --cached --check
          git commit -m 'Fix frozen app state wiring and optimize performance'
          git push origin HEAD:build/3.30.08
