name: Verify frozen-app state 3.30.08

on:
  push:
    branches:
      - build/3.30.08

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'Run frozen-app state verifier'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.08
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle
      - name: Apply audited frozen-app wiring fixes
        run: python3 .github/fix_frozen_state_33008.py
      - name: Verify intended source state
        run: |
          grep -q 'versionCode 436' app/build.gradle
          grep -q 'versionName "3.30.08"' app/build.gradle
          grep -q 'smart-detect-frozen-apps' app/src/main/java/fr/neamar/kiss/loader/LoadAppPojos.java
          grep -q 'getFrozenReconcileDelayMs' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q 'smart-keep-frozen-searchable' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q 'smart-grey-frozen-apps' app/src/main/java/fr/neamar/kiss/result/AppResult.java
          grep -q 'smart-auto-enable-frozen-apps' app/src/main/java/fr/neamar/kiss/result/AppResult.java
          grep -q 'smart-keep-frozen-history' app/src/main/java/fr/neamar/kiss/DataHandler.java
          ! grep -q 'FROZEN_RECONCILE_MS = 60000L' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          git diff --check
      - name: Full verification
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify APK metadata
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='436'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.08'" /tmp/apk-badging.txt
      - name: Commit only after verification
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/build.gradle .github/workflows/build.yml app/src/main/java/fr/neamar/kiss/loader/LoadAppPojos.java app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java app/src/main/java/fr/neamar/kiss/result/AppResult.java app/src/main/java/fr/neamar/kiss/DataHandler.java
          git rm .github/fix_frozen_state_33008.py .github/workflows/verify-frozen-state-3.30.08.yml
          git diff --cached --check
          git commit -m 'Fix frozen app state wiring and optimize performance'
          git push origin HEAD:build/3.30.08
