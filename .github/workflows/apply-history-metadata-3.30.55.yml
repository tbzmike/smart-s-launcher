name: Apply history metadata restoration 3.30.56 once

on:
  push:
    paths:
      - '.github/workflows/apply-history-metadata-3.30.55.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.ref == 'refs/heads/feature/3.30.44-in-app-updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/3.30.44-in-app-updater
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply exact requested history metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/src/main/java/fr/neamar/kiss/result/Result.java',
              'import fr.neamar.kiss.pojo.DisabledAppPojo;\nimport fr.neamar.kiss.pojo.PhonePojo;',
              'import fr.neamar.kiss.pojo.DisabledAppPojo;\nimport fr.neamar.kiss.pojo.NotificationPojo;\nimport fr.neamar.kiss.pojo.PhonePojo;')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/result/Result.java',
              'import fr.neamar.kiss.ui.ListPopup;\nimport fr.neamar.kiss.ui.UniversalHistoryTimestamp;',
              'import fr.neamar.kiss.ui.ListPopup;\nimport fr.neamar.kiss.ui.TileLaunchCounter;\nimport fr.neamar.kiss.ui.UniversalHistoryTimestamp;')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/result/Result.java',
              '    protected final void recordLaunch(Context context, @Nullable QueryInterface queryInterface) {\n        // Save in history\n        if (canAddToHistory()) {\n            KissApplication.getApplication(context).getDataHandler().addToHistory(pojo.getHistoryId());\n            UniversalHistoryTimestamp.invalidateStats();\n        }',
              '    protected final void recordLaunch(Context context, @Nullable QueryInterface queryInterface) {\n        // Save ordinary app/shortcut launches in history. Notification arrivals are already inserted\n        // by NotificationListener, so notification click counts are tracked separately below.\n        boolean storedInHistory = canAddToHistory();\n        if (storedInHistory) {\n            KissApplication.getApplication(context).getDataHandler().addToHistory(pojo.getHistoryId());\n        }\n        if (storedInHistory || pojo instanceof NotificationPojo) {\n            TileLaunchCounter.record(context, pojo);\n            UniversalHistoryTimestamp.invalidateStats();\n        }')

          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              'import fr.neamar.kiss.ui.AutoMarqueeTextView;\nimport fr.neamar.kiss.ui.SmartAnimationEngine;',
              'import fr.neamar.kiss.ui.AutoMarqueeTextView;\nimport fr.neamar.kiss.ui.SmartAnimationEngine;\nimport fr.neamar.kiss.ui.UniversalHistoryTimestamp;')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              '        prepareSourceForDetails(source);',
              '        // Bind timestamp, usage and launch metadata inside every Vertical Card.\n        // This updates only this TextView; it never rebuilds, refreshes or reorders the card list.\n        UniversalHistoryTimestamp.bind(center, result, mainActivity);\n\n        prepareSourceForDetails(source);')

          replace_once(
              'app/build.gradle',
              '        // Smart S Launcher 3.30.55 - remove duplicate Vertical Cards captions\n        versionCode 483\n        versionName "3.30.55"',
              '        // Smart S Launcher 3.30.56 - restore verified tile timestamps, usage and launch counts\n        versionCode 484\n        versionName "3.30.56"')

          encoded = {
              'app/src/main/java/fr/neamar/kiss/ui/TileLaunchCounter.java': '',
              'app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java': '',
              'app/src/test/java/fr/neamar/kiss/ui/UniversalHistoryTimestampTest.java': ''
          }
          for path, payload in encoded.items():
              Path(path).write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY

      - name: Verify scope wiring stability and version
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          expected="$(printf '%s\n' \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java \
            app/src/main/java/fr/neamar/kiss/result/Result.java \
            app/src/main/java/fr/neamar/kiss/ui/TileLaunchCounter.java \
            app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java \
            app/src/test/java/fr/neamar/kiss/ui/UniversalHistoryTimestampTest.java | sort)"
          actual="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort)"
          test "$actual" = "$expected"
          grep -F 'versionName "3.30.56"' app/build.gradle
          grep -F 'versionCode 484' app/build.gradle
          grep -F 'UniversalHistoryTimestamp.bind(center, result, mainActivity);' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -F 'TileLaunchCounter.record(context, pojo);' app/src/main/java/fr/neamar/kiss/result/Result.java
          grep -F 'return historyId + "|post:" + postTime;' app/src/main/java/fr/neamar/kiss/ui/TileLaunchCounter.java
          grep -F 'Received ' app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java
          grep -F 'Posted ' app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java
          grep -F 'Used today ' app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java
          grep -F 'Launched twice' app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java
          grep -F 'pendingDataSetRefresh = true;' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -F 'post(SmartCardListForwarder.this::refreshAfterUserTouch);' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          ! grep -F 'notifyDataSetChanged' app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java
          ! grep -F 'postDelayed' app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java

      - name: Run full verification build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Commit verified 3.30.56 timestamp restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java \
            app/src/main/java/fr/neamar/kiss/result/Result.java \
            app/src/main/java/fr/neamar/kiss/ui/TileLaunchCounter.java \
            app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java \
            app/src/test/java/fr/neamar/kiss/ui/UniversalHistoryTimestampTest.java
          git commit -m "Restore verified tile timestamps for 3.30.56"
          git push origin HEAD:feature/3.30.44-in-app-updater
