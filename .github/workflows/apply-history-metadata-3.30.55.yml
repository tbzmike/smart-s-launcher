name: Apply verified history metadata and notification media 3.30.56 once

on:
  push:
    paths:
      - '.github/workflows/apply-history-metadata-3.30.55.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.ref == 'refs/heads/feature/3.30.44-in-app-updater'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/3.30.44-in-app-updater
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply only verified requested changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one guarded match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Native List/3D adapter rows: restore the same verified history metadata.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java',
              'import fr.neamar.kiss.ui.TileVisualStyle;\n',
              'import fr.neamar.kiss.ui.TileVisualStyle;\nimport fr.neamar.kiss.ui.UniversalHistoryTimestamp;\n')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java',
              '            TileVisualStyle.apply(view, result, context);\n',
              '            TileVisualStyle.apply(view, result, context);\n'
              '            UniversalHistoryTimestamp.bind(view, result, context);\n')

          # Capture sent/attached notification images while Android still grants URI access.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java',
              '            if (seedTimeline) NotificationAvatarSupport.captureAsync(this, getTimelineId(sbn), sbn);\n',
              '            if (seedTimeline) {\n'
              '                String timelineId = getTimelineId(sbn);\n'
              '                NotificationAvatarSupport.captureAsync(this, timelineId, sbn);\n'
              '                NotificationMediaSupport.captureAsync(this, timelineId, sbn);\n'
              '            }\n')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java',
              '        NotificationAvatarSupport.captureAsync(this, id, sbn);\n'
              '        persistHistory(sbn, id);\n',
              '        NotificationAvatarSupport.captureAsync(this, id, sbn);\n'
              '        NotificationMediaSupport.captureAsync(this, id, sbn);\n'
              '        persistHistory(sbn, id);\n')

          # Vertical Cards: preserve deferred-refresh stability, add metadata inside the card,
          # and show the actual sent image inline when the notification exposes image media.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              'import java.util.LinkedHashMap;\nimport java.util.Map;\n',
              'import java.util.LinkedHashMap;\nimport java.util.List;\nimport java.util.Map;\n')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              'import fr.neamar.kiss.db.SmartStateStore;\nimport fr.neamar.kiss.pojo.CommunicationPojo;\n',
              'import fr.neamar.kiss.db.SmartStateStore;\n'
              'import fr.neamar.kiss.notification.NotificationListener;\n'
              'import fr.neamar.kiss.notification.NotificationMediaSupport;\n'
              'import fr.neamar.kiss.pojo.AppPojo;\n'
              'import fr.neamar.kiss.pojo.CommunicationPojo;\n'
              'import fr.neamar.kiss.pojo.NotificationPojo;\n')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              'import fr.neamar.kiss.ui.SmartAnimationEngine;\n',
              'import fr.neamar.kiss.ui.SmartAnimationEngine;\n'
              'import fr.neamar.kiss.ui.UniversalHistoryTimestamp;\n')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              '        prepareSourceForDetails(source);\n',
              '        // Restore real per-tile history time, usage-today duration and launch count.\n'
              '        // This binds a TextView only; it does not rebuild or reorder Vertical Cards.\n'
              '        UniversalHistoryTimestamp.bind(center, result, mainActivity);\n\n'
              '        String mediaNotificationId = resolveNotificationMediaId(result, latestNotifications);\n'
              '        if (!TextUtils.isEmpty(mediaNotificationId)) {\n'
              '            ImageView mediaPreview = new ImageView(mainActivity);\n'
              '            mediaPreview.setScaleType(ImageView.ScaleType.CENTER_CROP);\n'
              '            mediaPreview.setVisibility(View.GONE);\n'
              '            mediaPreview.setContentDescription("Attached notification image");\n'
              '            GradientDrawable mediaClip = new GradientDrawable();\n'
              '            mediaClip.setColor(Color.TRANSPARENT);\n'
              '            mediaClip.setCornerRadius(dp(14));\n'
              '            mediaPreview.setBackground(mediaClip);\n'
              '            mediaPreview.setClipToOutline(true);\n'
              '            LinearLayout.LayoutParams mediaLp = new LinearLayout.LayoutParams(\n'
              '                    ViewGroup.LayoutParams.MATCH_PARENT, dp(190));\n'
              '            mediaLp.topMargin = dp(8);\n'
              '            card.addView(mediaPreview, mediaLp);\n'
              '            NotificationMediaSupport.loadInto(mediaPreview, mediaNotificationId);\n'
              '        }\n\n'
              '        prepareSourceForDetails(source);\n')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
              '    private String latestKnownNotificationMessage(\n',
              '    private String resolveNotificationMediaId(\n'
              '            Result<?> result,\n'
              '            Map<String, NotificationHistoryRecord> latestNotifications) {\n'
              '        if (result.getPojo() instanceof NotificationPojo) {\n'
              '            return result.getPojo().id;\n'
              '        }\n'
              '        if (result.getPojo() instanceof AppPojo) {\n'
              '            AppPojo app = (AppPojo) result.getPojo();\n'
              '            List<NotificationListener.NotificationSnapshot> active =\n'
              '                    NotificationListener.getGroupNotifications(mainActivity, app.getPackageKey());\n'
              '            if (!active.isEmpty()) return active.get(0).id;\n'
              '        }\n'
              '        if (result instanceof AppResult) {\n'
              '            String packageName = ((AppResult) result).getClassName().getPackageName();\n'
              '            NotificationHistoryRecord latest = latestNotifications.get(packageName);\n'
              '            if (latest != null && !TextUtils.isEmpty(latest.notificationId)) {\n'
              '                return latest.notificationId;\n'
              '            }\n'
              '        }\n'
              '        return null;\n'
              '    }\n\n'
              '    private String latestKnownNotificationMessage(\n')

          Path('app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java').write_bytes(
              base64.b64decode(' '))
          Path('app/src/main/java/fr/neamar/kiss/notification/NotificationMediaSupport.java').write_bytes(
              base64.b64decode('  oYml0bWFwLCB0YXJnZXRXaWR0aCwgdGFyZ2V0SGVpZ2h0LCB0cnVlKTsKICAgICAgICB9IGNhdGNoIChSdW50aW1lRXhjZXB0aW9uIGUpIHsKICAgICAgICAgICAgTG9nLncoVEFH '))

          test_dir = Path('app/src/test/java/fr/neamar/kiss/ui')
          test_dir.mkdir(parents=True, exist_ok=True)
          (test_dir / 'UniversalHistoryTimestampTest.java').write_bytes(
              base64.b64decode(''))
          media_test_dir = Path('app/src/test/java/fr/neamar/kiss/notification')
          media_test_dir.mkdir(parents=True, exist_ok=True)
          (media_test_dir / 'NotificationMediaSupportTest.java').write_bytes(
              base64.b64decode(''))

          replace_once(
              'app/build.gradle',
              '        // Smart S Launcher 3.30.55 - remove duplicate Vertical Cards captions\n'
              '        versionCode 483\n'
              '        versionName "3.30.55"\n',
              '        // Smart S Launcher 3.30.56 - restore tile metadata and inline notification images\n'
              '        versionCode 484\n'
              '        versionName "3.30.56"\n')
          PY

      - name: Verify exact source scope and wiring
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java \
            app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java \
            app/src/main/java/fr/neamar/kiss/notification/NotificationMediaSupport.java \
            app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java \
            app/src/test/java/fr/neamar/kiss/notification/NotificationMediaSupportTest.java \
            app/src/test/java/fr/neamar/kiss/ui/UniversalHistoryTimestampTest.java | sort)"
          grep -q 'versionCode 484' app/build.gradle
          grep -q 'versionName "3.30.56"' app/build.gradle
          grep -q 'UniversalHistoryTimestamp.bind(center, result, mainActivity)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'NotificationMediaSupport.loadInto(mediaPreview, mediaNotificationId)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'NotificationMediaSupport.captureAsync(this, id, sbn)' app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java
          grep -q 'Launched twice' app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java

      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Commit only after all verification passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tbzmike"
          git config user.email "40115947+tbzmike@users.noreply.github.com"
          git add app/build.gradle \
            app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java \
            app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java \
            app/src/main/java/fr/neamar/kiss/notification/NotificationMediaSupport.java \
            app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java \
            app/src/test/java/fr/neamar/kiss/notification/NotificationMediaSupportTest.java \
            app/src/test/java/fr/neamar/kiss/ui/UniversalHistoryTimestampTest.java
          git commit -m "Restore tile metadata and inline notification images 3.30.56"
          git push origin HEAD:feature/3.30.44-in-app-updater
