name: Fix search bottom ordering 3.30.110

on:
  push:
    branches:
      - feature/search-bottom-fix-3.30.110

permissions:
  contents: write

jobs:
  verify-build-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact-launch-target bottom fix
        run: python3 .github/scripts/fix_search_bottom_3_30_110.py

      - name: Verify intended source scope and preserved 3.30.108 ranking
        run: |
          set -euo pipefail
          grep -q 'versionCode 538' app/build.gradle
          grep -q 'versionName "3.30.110"' app/build.gradle
          grep -q 'EXACT_REACHABILITY_RELEVANCE = 1_000_000' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'isExactReachabilityMatch(pojo)' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'First stage: search the already-rendered history rows in memory' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'publishHistoryPreview' app/src/main/java/fr/neamar/kiss/searcher/SearchHandler.java
          grep -q 'smart-list-notification-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java || grep -q 'smart-list-shortcut-icon-size-percent' app/src/main/java/fr/neamar/kiss/ui/TileVisualStyle.java
          grep -q 'moveExactLaunchTargetsToBottom(updatedResults, query)' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -q 'class PixelLauncherScreenOffReceiver' app/src/main/java/fr/neamar/kiss/PixelLauncherScreenOffReceiver.java

          changed=$(git diff --name-only e6ffc1dc7675f0997527b0652b2748d1c3408555 --)
          echo "$changed"
          test "$(echo "$changed" | wc -l)" -eq 4
          echo "$changed" | grep -qx '.github/scripts/fix_search_bottom_3_30_110.py'$'\n''app/build.gradle'$'\n''.github/workflows/fix-search-bottom-3.30.110.yml'$'\n''app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java'

      - name: Build, lint and test
        run: |
          chmod +x gradlew
          ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --no-daemon

      - name: Verify APK metadata
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -p app/build/outputs/apk/debug/app-debug.apk META-INF/com/android/build/gradle/app-metadata.properties | grep -q 'versionName=3.30.110'

      - name: Remove temporary patch tooling and commit final source
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix_search_bottom_3_30_110.py .github/workflows/fix-search-bottom-3.30.110.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java .github/scripts/fix_search_bottom_3_30_110.py .github/workflows/fix-search-bottom-3.30.110.yml
          git diff --cached --check
          git commit -m 'Fix exact launch targets staying at search bottom'
          git push origin HEAD:feature/search-bottom-fix-3.30.110

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartSLauncher-3.30.110
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
