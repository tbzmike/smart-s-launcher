name: Apply Smart S Launcher 3.30.24 visible result limits

on:
  push:
    branches:
      - build/3.30.23

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.23

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Apply guarded UI correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          xml_path = 'app/src/main/res/xml/preferences.xml'

          # Keep History and Search limits visibly adjacent while preserving independent keys.
          replace_once(
              xml_path,
              '''        <EditTextPreference\n            android:inputType="number"\n            app:defaultValue="20"\n            app:key="number-of-history-results"\n            app:title="Max number of history results"\n            app:useSimpleSummaryProvider="true" />\n        <ListPreference''',
              '''        <EditTextPreference\n            android:inputType="number"\n            app:defaultValue="20"\n            app:key="number-of-history-results"\n            app:title="Max number of history results"\n            app:useSimpleSummaryProvider="true" />\n        <EditTextPreference\n            android:inputType="number"\n            app:defaultValue="20"\n            app:key="number-of-search-results"\n            app:title="Max number of search results"\n            app:useSimpleSummaryProvider="true" />\n        <ListPreference''')

          # Remove the duplicate/hidden placement from User Interface -> Search results options.
          replace_once(
              xml_path,
              '''            <EditTextPreference\n                android:inputType="number"\n                app:defaultValue="20"\n                app:key="number-of-search-results"\n                app:title="Max number of search results"\n                app:useSimpleSummaryProvider="true" />\n            <ListPreference''',
              '''            <ListPreference''')

          replace_once(
              'app/build.gradle',
              '''        // Smart S Launcher 3.30.23 - independent search/history result limits\n        versionCode 451\n        versionName "3.30.23"''',
              '''        // Smart S Launcher 3.30.24 - visible independent search/history result limits\n        versionCode 452\n        versionName "3.30.24"''')

          xml = Path(xml_path).read_text()
          if xml.count('app:key="number-of-history-results"') != 1:
              raise SystemExit('history result limit must exist exactly once')
          if xml.count('app:key="number-of-search-results"') != 1:
              raise SystemExit('search result limit must exist exactly once')
          history_pos = xml.index('app:key="number-of-history-results"')
          search_pos = xml.index('app:key="number-of-search-results"')
          mode_pos = xml.index('app:key="history-mode"')
          if not history_pos < search_pos < mode_pos:
              raise SystemExit('search result limit is not visibly adjacent in History settings')

          q = Path('app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java').read_text()
          h = Path('app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java').read_text()
          if 'prefs.getString("number-of-search-results"' not in q:
              raise SystemExit('QuerySearcher lost search-specific wiring')
          if 'prefs.getString("number-of-history-results"' not in h:
              raise SystemExit('HistorySearcher lost history-specific wiring')
          if 'versionCode 452' not in Path('app/build.gradle').read_text() or 'versionName "3.30.24"' not in Path('app/build.gradle').read_text():
              raise SystemExit('3.30.24 version bump missing')
          PY

      - name: Verify exact changed scope
        run: |
          git diff --check
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' app/build.gradle app/src/main/res/xml/preferences.xml | sort)
          test "$CHANGED" = "$EXPECTED" || { echo 'Unexpected changed files:'; git diff --name-only; exit 1; }

      - name: Test and build corrected source
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Commit verified 3.30.24 app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/res/xml/preferences.xml
          git commit -m 'Show separate search and history limits together in 3.30.24'
          git push origin HEAD:build/3.30.23
