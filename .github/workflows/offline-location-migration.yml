name: One-time offline location-card migration

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/offline-location-migration.yml'

permissions:
  contents: write

jobs:
  make-location-card-offline:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Remove network dependency from live location card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          java = Path('app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java')
          text = java.read_text(encoding='utf-8')

          replacements = {
              'PREF_ONLINE_MAP_PREVIEWS': 'PREF_LIVE_LOCATION_DETAILS',
              'smart-online-map-previews': 'smart-live-location-details',
              'onlineMapPreviewsEnabled': 'liveLocationDetailsEnabled',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected token: {old}')
              text = text.replace(old, new)

          # Remove imports only used by remote map tiles / reverse geocoding.
          for imp in [
              'import android.graphics.Bitmap;\n',
              'import android.graphics.BitmapFactory;\n',
              'import android.graphics.Canvas;\n',
              'import android.graphics.Color;\n',
              'import android.graphics.Paint;\n',
              'import android.graphics.drawable.BitmapDrawable;\n',
              'import android.location.Address;\n',
              'import android.location.Geocoder;\n',
              'import android.text.TextUtils;\n',
              'import java.io.File;\n',
              'import java.io.FileInputStream;\n',
              'import java.io.FileOutputStream;\n',
              'import java.io.InputStream;\n',
              'import java.net.HttpURLConnection;\n',
              'import java.net.URL;\n',
          ]:
              text = text.replace(imp, '')

          text = text.replace('    private static final int ZOOM = 16;\n', '')
          text = text.replace('    private static volatile String lastStreet = "";\n', '')
          text = text.replace('        if (moved) lastStreet = "";\n', '')

          start = text.index('    static LiveTileDataProvider.LiveTileData latest(Context context) {')
          end = text.index('    private static boolean acceptLocation(Location location) {', start)
          latest = '''    static LiveTileDataProvider.LiveTileData latest(Context context) {\n        if (!liveLocationDetailsEnabled(context)) return null;\n        if (!hasLocationPermission(context)) return null;\n        Location location = lastLocation != null ? new Location(lastLocation) : bestLastKnown(context);\n        if (!isFresh(location, MAX_LAST_KNOWN_AGE_MS)) return null;\n        if (lastLocation == null) acceptLocation(location);\n\n        String accuracy = location.hasAccuracy() ? " ±" + Math.round(location.getAccuracy()) + " m" : "";\n        String text = String.format(Locale.US, "%.5f, %.5f%s",\n                location.getLatitude(), location.getLongitude(), accuracy);\n        return new LiveTileDataProvider.LiveTileData(\n                null, "Current location", text, "Live · on-device location", 0, 0, false);\n    }\n\n'''
          text = text[:start] + latest + text[end:]

          # Remove reverse-geocoding and remote-map helper block, leaving bestLastKnown and class close.
          start = text.index('    private static String reverseGeocode(Context context, Location location) {')
          end = text.rindex('\n}')
          text = text[:start] + text[end:]

          forbidden = [
              'tile.openstreetmap.org', 'HttpURLConnection', 'new URL(',
              'Geocoder', 'getFromLocation(', 'downloadTile(', 'loadMapPreview('
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'network token remains: {token}')

          java.write_text(text, encoding='utf-8')

          prefs = Path('app/src/main/res/xml/preferences_smart_features.xml')
          p = prefs.read_text(encoding='utf-8')
          old = '''        <SwitchPreference\n            app:defaultValue="false"\n            app:key="smart-online-map-previews"\n            app:title="Online map previews"\n            app:summary="When enabled, Google Maps history cards may send an approximate location tile request to OpenStreetMap. Off keeps this network preview disabled." />'''
          new = '''        <SwitchPreference\n            app:defaultValue="false"\n            app:key="smart-live-location-details"\n            app:title="Live location details"\n            app:summary="When enabled, Google Maps history cards may show locally obtained coordinates and accuracy. Smart S does not download map tiles or reverse-geocode this location." />'''
          if old not in p:
              raise SystemExit('expected online map preference block not found')
          p = p.replace(old, new, 1)
          prefs.write_text(p, encoding='utf-8')
          PY

      - name: Verify offline behavior and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'app:key="smart-live-location-details"' app/src/main/res/xml/preferences_smart_features.xml
          grep -F 'app:defaultValue="false"' app/src/main/res/xml/preferences_smart_features.xml
          grep -F 'if (!liveLocationDetailsEnabled(activity)) return;' app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java
          grep -F 'if (!liveLocationDetailsEnabled(context)) return null;' app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java
          ! grep -F 'tile.openstreetmap.org' app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java
          ! grep -F 'HttpURLConnection' app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java
          ! grep -F 'Geocoder' app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java app/src/main/res/xml/preferences_smart_features.xml
          git commit -m 'Keep live location cards fully on-device'
          git push origin HEAD:master
