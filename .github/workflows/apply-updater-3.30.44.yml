name: Apply guarded 3.30.44 in-app updater

on:
  push:
    branches:
      - feature/3.30.44-in-app-updater
    paths:
      - .github/workflows/apply-updater-3.30.44.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.30.44-in-app-updater
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: python3 .github/scripts/apply-updater-3.30.44.py

      - name: Verify intended diff
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'versionName "3.30.44"' app/build.gradle
          grep -F 'AppUpdater.maybeAutoUpdate(this);' app/src/main/java/fr/neamar/kiss/KissApplication.java
          grep -F 'addUpdatePreferences();' app/src/main/java/fr/neamar/kiss/SmartCategorySettingsFragment.java
          grep -F 'releases/latest' app/src/main/java/fr/neamar/kiss/update/AppUpdater.java
          grep -F 'name.contains("unsigned")' app/src/main/java/fr/neamar/kiss/update/AppUpdater.java

      - name: Lint, unit test and build
        run: bash ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - name: Commit verified 3.30.44
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic and manual in-app updates 3.30.44"
          git push
