name: Apply guarded 3.30.44 in-app updater

on:
  push:
    branches:
      - feature/3.30.44-in-app-updater
    paths:
      - .github/workflows/apply-updater-3.30.44.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.30.44-in-app-updater
          fetch-depth: 0

      - name: Apply exact guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-updater-3.30.44.py')
          text = p.read_text()
          old = '    private static final Handler MAIN = new Handler(Looper.getMainLooper());'
          new = '''    private static Handler mainHandler() {
              return new Handler(Looper.getMainLooper());
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one static Handler initializer, found {text.count(old)}')
          text = text.replace(old, new, 1)
          for old_call, new_call in [
              ('MAIN.post(() -> showUpdateDialog', 'mainHandler().post(() -> showUpdateDialog'),
              ('MAIN.post(() -> Toast.makeText', 'mainHandler().post(() -> Toast.makeText'),
          ]:
              if text.count(old_call) != 1:
                  raise SystemExit(f'Expected one {old_call!r}, found {text.count(old_call)}')
              text = text.replace(old_call, new_call, 1)
          p.write_text(text)
          PY
          python3 .github/scripts/apply-updater-3.30.44.py

      - name: Verify intended diff
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'versionName "3.30.44"' app/build.gradle
          grep -F 'AppUpdater.maybeAutoUpdate(this);' app/src/main/java/fr/neamar/kiss/KissApplication.java
          grep -F 'addUpdatePreferences();' app/src/main/java/fr/neamar/kiss/SmartCategorySettingsFragment.java
          grep -F 'releases/latest' app/src/main/java/fr/neamar/kiss/update/AppUpdater.java
          grep -F 'name.contains("unsigned")' app/src/main/java/fr/neamar/kiss/update/AppUpdater.java
          grep -F 'private static Handler mainHandler()' app/src/main/java/fr/neamar/kiss/update/AppUpdater.java
          test ! -e .github/workflows/apply-updater-3.30.44.yml
          test ! -e .github/scripts/apply-updater-3.30.44.py

      - name: Lint, unit test and build
        run: bash ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - name: Commit verified 3.30.44
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic and manual in-app updates 3.30.44"
          git push
