name: Apply full Vertical Cards timestamps 3.30.57 once

on:
  push:
    branches:
      - fix/3.30.57-full-vertical-card-timestamps
    paths:
      - '.github/workflows/apply-full-vertical-card-timestamps-3.30.57.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.57-full-vertical-card-timestamps
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply only verified timestamp changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          tile_counter = Path('app/src/main/java/fr/neamar/kiss/ui/TileLaunchCounter.java')
          if tile_counter.exists():
              raise SystemExit(f'{tile_counter}: refusing to overwrite an existing source file')
          tile_counter.write_text(r'''package fr.neamar.kiss.ui;

import android.content.Context;
import android.content.SharedPreferences;
import android.text.TextUtils;

import androidx.annotation.NonNull;

import fr.neamar.kiss.pojo.NotificationPojo;
import fr.neamar.kiss.pojo.Pojo;

/** Persistent count of explicit launcher tile launches/clicks for one exact history item. */
public final class TileLaunchCounter {
    private static final String PREFS = "smart-s-tile-launch-counts";
    private static final String KEY_PREFIX = "count:";
    private static final Object LOCK = new Object();

    private TileLaunchCounter() {}

    public static void record(@NonNull Context context, @NonNull Pojo pojo) {
        String key = storageKey(pojo);
        if (TextUtils.isEmpty(key)) return;
        synchronized (LOCK) {
            SharedPreferences prefs = context.getApplicationContext()
                    .getSharedPreferences(PREFS, Context.MODE_PRIVATE);
            String storageKey = KEY_PREFIX + key;
            long current = Math.max(0L, prefs.getLong(storageKey, 0L));
            long next = current == Long.MAX_VALUE ? Long.MAX_VALUE : current + 1L;
            prefs.edit().putLong(storageKey, next).apply();
        }
    }

    public static long getTotal(@NonNull Context context, @NonNull Pojo pojo) {
        String key = storageKey(pojo);
        if (TextUtils.isEmpty(key)) return 0L;
        synchronized (LOCK) {
            return Math.max(0L, context.getApplicationContext()
                    .getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                    .getLong(KEY_PREFIX + key, 0L));
        }
    }

    @NonNull
    static String storageKey(@NonNull Pojo pojo) {
        if (pojo instanceof NotificationPojo) {
            NotificationPojo notification = (NotificationPojo) pojo;
            return notification.id + "|post:" + Math.max(0L, notification.postTime);
        }
        String historyId = pojo.getHistoryId();
        return historyId == null ? "" : historyId;
    }
}
''', encoding='utf-8')

