import android.content.Context;
import android.os.SystemClock;
import android.text.TextUtils;
import android.text.format.DateFormat;
import android.text.format.DateUtils;
import android.view.Gravity;
import android.view.View;
import android.view.ViewGroup;
import android.widget.LinearLayout;
import android.widget.TextView;

import androidx.annotation.NonNull;
import androidx.annotation.Nullable;

import java.lang.ref.WeakReference;
import java.util.ArrayList;
import java.util.Collections;
import java.util.Date;
import java.util.List;
import java.util.Map;
import java.util.WeakHashMap;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

import fr.neamar.kiss.MainActivity;
import fr.neamar.kiss.db.AppUsageTodayStore;
import fr.neamar.kiss.db.LaunchStatsProvider;
import fr.neamar.kiss.pojo.AppPojo;
import fr.neamar.kiss.pojo.CommunicationPojo;
import fr.neamar.kiss.pojo.DisabledAppPojo;
import fr.neamar.kiss.pojo.NotificationPojo;
import fr.neamar.kiss.pojo.Pojo;
import fr.neamar.kiss.pojo.SettingPojo;
import fr.neamar.kiss.pojo.ShortcutPojo;
import fr.neamar.kiss.result.Result;
import fr.neamar.kiss.result.ShortcutsResult;

/**
 * Renders complete history metadata as a sibling below each Vertical Card.
 * Database and UsageStats reads are grouped off the UI thread and shared by all visible cards.
 */
public final class VerticalCardTimestampBinder {
    private static final String VIEW_TAG = "smart_s_vertical_card_timestamp_metadata";
    private static final long METADATA_REFRESH_MS = 30_000L;
    private static final ExecutorService EXECUTOR = Executors.newSingleThreadExecutor();
    private static final Object LOAD_LOCK = new Object();
    private static final Object PENDING_LOCK = new Object();
    private static final WeakHashMap<View, PendingBinding> PENDING = new WeakHashMap<>();

    private static volatile Map<String, LaunchStatsProvider.LaunchStats> launchStats;
    private static volatile AppUsageTodayStore.Snapshot usageSnapshot;
    private static volatile long loadedAtElapsed;
    private static volatile boolean loadedOnce;
    private static volatile boolean loadInFlight;

    private VerticalCardTimestampBinder() {}

    public static void bind(@NonNull LinearLayout wrapper,
                            @NonNull Result<?> result,
                            @NonNull Context context) {
        if (!isHistorySurface(context)) {
            TextView existing = findDirectMetadataView(wrapper);
            if (existing != null) existing.setVisibility(View.GONE);
            return;
        }

        Pojo pojo = result.getPojo();
        if (pojo == null) return;

        TextView metadata = ensureDirectMetadataView(wrapper, context);
        metadata.setVisibility(View.VISIBLE);

        LaunchStatsProvider.LaunchStats stats = resolveStats(pojo);
        String packageName = resolveUsagePackage(result, pojo, context);
        metadata.setText(formatMetadata(context, pojo, stats, packageName));
        metadata.setContentDescription(metadata.getText());
        SmartTextAppearance.applyHistoryMetadata(metadata);

        if (!isFresh()) {
            queueBinding(wrapper, result, context);
            ensureLoaded(context);
        }
    }

    public static void invalidate() {
        loadedAtElapsed = 0L;
    }

    private static boolean isHistorySurface(Context context) {
        if (!(context instanceof MainActivity)) return false;
        MainActivity activity = (MainActivity) context;
        return activity.searchEditText == null || activity.searchEditText.length() == 0;
    }

    private static boolean isFresh() {
        return loadedOnce
                && loadedAtElapsed > 0L
                && SystemClock.elapsedRealtime() - loadedAtElapsed < METADATA_REFRESH_MS;
    }

    @Nullable
    private static LaunchStatsProvider.LaunchStats resolveStats(@NonNull Pojo pojo) {
        Map<String, LaunchStatsProvider.LaunchStats> snapshot = launchStats;
        if (snapshot == null) return null;
        String historyId = pojo.getHistoryId();
        if (TextUtils.isEmpty(historyId)) return null;
        return snapshot.get(historyId);
    }

    @Nullable
    private static String resolveUsagePackage(@NonNull Result<?> result,
                                              @NonNull Pojo pojo,
                                              @NonNull Context context) {
        if (pojo instanceof NotificationPojo) {
            String packageName = ((NotificationPojo) pojo).packageName;
            return TextUtils.isEmpty(packageName) ? null : packageName;
        }
        if (pojo instanceof AppPojo) {
            String packageName = ((AppPojo) pojo).packageName;
            return TextUtils.isEmpty(packageName) ? null : packageName;
        }
        if (pojo instanceof DisabledAppPojo) {
            String packageName = ((DisabledAppPojo) pojo).targetPackage;
            return TextUtils.isEmpty(packageName) ? null : packageName;
        }
        if (pojo instanceof ShortcutPojo) {
            if (result instanceof ShortcutsResult) {
                String resolved = ((ShortcutsResult) result).resolveTargetPackageName(context);
                if (!TextUtils.isEmpty(resolved)) return resolved;
            }
            return null;
        }
        if (pojo instanceof SettingPojo) {
            String packageName = ((SettingPojo) pojo).packageName;
            return TextUtils.isEmpty(packageName) ? null : packageName;
        }
        return null;
    }

    @NonNull
    private static CharSequence formatMetadata(@NonNull Context context,
                                               @NonNull Pojo pojo,
                                               @Nullable LaunchStatsProvider.LaunchStats stats,
                                               @Nullable String packageName) {
        List<String> parts = new ArrayList<>(3);
        parts.add(formatPostedTime(context, pojo, stats));
        parts.add(formatUsage(packageName));
        parts.add(formatLaunchCount(resolveLaunchCount(context, pojo, stats)));
        return TextUtils.join("  •  ", parts);
    }

    @NonNull
    private static String formatPostedTime(@NonNull Context context,
                                           @NonNull Pojo pojo,
                                           @Nullable LaunchStatsProvider.LaunchStats stats) {
        long timestamp = resolveTimestamp(pojo, stats);
        String label = pojo instanceof NotificationPojo ? "Received" : "Posted";
        if (timestamp <= 0L) return label + ": unavailable";

        long now = System.currentTimeMillis();
        String relative;
        long difference = timestamp - now;
        if (Math.abs(difference) < DateUtils.MINUTE_IN_MILLIS) {
            relative = difference <= 0L ? "just now" : "in <1m";
        } else {
            relative = DateUtils.getRelativeTimeSpanString(
                    timestamp,
                    now,
                    DateUtils.MINUTE_IN_MILLIS,
                    DateUtils.FORMAT_ABBREV_RELATIVE).toString();
        }

        Date date = new Date(timestamp);
        String exactTime = DateFormat.getTimeFormat(context).format(date);
        if (!DateUtils.isToday(timestamp)) {
            exactTime = DateFormat.getMediumDateFormat(context).format(date) + " " + exactTime;
        }
        return label + " " + relative + " · " + exactTime;
    }

    private static long resolveTimestamp(@NonNull Pojo pojo,
                                         @Nullable LaunchStatsProvider.LaunchStats stats) {
        if (pojo instanceof NotificationPojo) {
            long posted = ((NotificationPojo) pojo).postTime;
            if (posted > 0L) return posted;
        }
        if (pojo instanceof CommunicationPojo) {
            long eventTime = ((CommunicationPojo) pojo).timestamp;
            if (eventTime > 0L) return eventTime;
        }
        return stats == null ? 0L : Math.max(0L, stats.lastLaunchTime);
    }

    @NonNull
    private static String formatUsage(@Nullable String packageName) {
        if (TextUtils.isEmpty(packageName)) return "Used today: n/a";
        if (!loadedOnce) return "Used today: loading";

        AppUsageTodayStore.Snapshot snapshot = usageSnapshot;
        if (snapshot == null || !snapshot.available) return "Used today: unavailable";
        long duration = Math.max(0L,
                snapshot.foregroundMsByPackage.getOrDefault(packageName, 0L));
        return "Used today: " + formatDuration(duration);
    }

    static String formatDuration(long durationMs) {
        long safe = Math.max(0L, durationMs);
        if (safe == 0L) return "0m";
        long minutes = safe / DateUtils.MINUTE_IN_MILLIS;
        if (minutes == 0L) return "<1m";
        long hours = minutes / 60L;
        long remainder = minutes % 60L;
        if (hours == 0L) return minutes + "m";
        if (remainder == 0L) return hours + "h";
        return hours + "h " + remainder + "m";
    }

    private static long resolveLaunchCount(@NonNull Context context,
                                           @NonNull Pojo pojo,
                                           @Nullable LaunchStatsProvider.LaunchStats stats) {
        long tracked = TileLaunchCounter.getTotal(context, pojo);
        if (pojo instanceof NotificationPojo) return tracked;
        long existingHistory = stats == null ? 0L : Math.max(0, stats.totalLaunches);
        return Math.max(tracked, existingHistory);
    }

    static String formatLaunchCount(long count) {
        long safe = Math.max(0L, count);
        if (safe == 1L) return "Launched once";
        if (safe == 2L) return "Launched twice";
        return "Launched " + safe + " times";
    }

    private static TextView ensureDirectMetadataView(@NonNull LinearLayout wrapper,
                                                     @NonNull Context context) {
        TextView existing = findDirectMetadataView(wrapper);
        if (existing != null) return existing;

        TextView metadata = new TextView(context);
        metadata.setTag(VIEW_TAG);
        metadata.setGravity(Gravity.CENTER);
        metadata.setTextDirection(View.TEXT_DIRECTION_LOCALE);
        metadata.setImportantForAccessibility(View.IMPORTANT_FOR_ACCESSIBILITY_YES);
        metadata.setSingleLine(false);
        metadata.setMaxLines(3);
        metadata.setEllipsize(null);
        metadata.setClickable(false);
        metadata.setFocusable(false);
        metadata.setPadding(dp(context, 6), 0, dp(context, 6), 0);

        LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.WRAP_CONTENT);
        params.leftMargin = dp(context, 8);
        params.rightMargin = dp(context, 8);
        params.topMargin = dp(context, 4);
        wrapper.addView(metadata, params);
        return metadata;
    }

    @Nullable
    private static TextView findDirectMetadataView(@NonNull LinearLayout wrapper) {
        for (int i = 0; i < wrapper.getChildCount(); i++) {
            View child = wrapper.getChildAt(i);
            if (child instanceof TextView && VIEW_TAG.equals(child.getTag())) {
                return (TextView) child;
            }
        }
        return null;
    }

    private static void queueBinding(@NonNull LinearLayout wrapper,
                                     @NonNull Result<?> result,
                                     @NonNull Context context) {
        synchronized (PENDING_LOCK) {
            PENDING.put(wrapper, new PendingBinding(wrapper, result, context));
        }
    }

    private static void ensureLoaded(@NonNull Context context) {
        if (isFresh()) return;
        synchronized (LOAD_LOCK) {
            if (isFresh() || loadInFlight) return;
            loadInFlight = true;
        }

        Context appContext = context.getApplicationContext();
        EXECUTOR.execute(() -> {
            Map<String, LaunchStatsProvider.LaunchStats> loadedStats;
            AppUsageTodayStore.Snapshot loadedUsage = null;
            try {
                loadedStats = LaunchStatsProvider.loadAll(appContext);
            } catch (RuntimeException ignored) {
                loadedStats = Collections.emptyMap();
            }
            try {
                loadedUsage = AppUsageTodayStore.getToday(appContext);
            } catch (RuntimeException ignored) {
                // A failed UsageStats read is rendered as unavailable; no synthetic duration is used.
            }

            launchStats = loadedStats;
            usageSnapshot = loadedUsage;
            loadedAtElapsed = SystemClock.elapsedRealtime();
            loadedOnce = true;
            synchronized (LOAD_LOCK) {
                loadInFlight = false;
            }
            flushPendingBindings();
        });
    }

    private static void flushPendingBindings() {
        List<PendingBinding> pending;
        synchronized (PENDING_LOCK) {
            pending = new ArrayList<>(PENDING.values());
            PENDING.clear();
        }
        for (PendingBinding binding : pending) {
            LinearLayout wrapper = binding.wrapper.get();
            Result<?> result = binding.result.get();
            Context context = binding.context.get();
            if (wrapper == null || result == null || context == null) continue;
            wrapper.post(() -> {
                if (wrapper.isAttachedToWindow()) bind(wrapper, result, context);
            });
        }
    }

    private static int dp(Context context, int value) {
        return Math.round(value * context.getResources().getDisplayMetrics().density);
    }

    private static final class PendingBinding {
        final WeakReference<LinearLayout> wrapper;
        final WeakReference<Result<?>> result;
        final WeakReference<Context> context;

        PendingBinding(LinearLayout wrapper, Result<?> result, Context context) {
            this.wrapper = new WeakReference<>(wrapper);
            this.result = new WeakReference<>(result);
            this.context = new WeakReference<>(context);
        }
    }
}
