import static org.junit.Assert.assertEquals;

import org.junit.Test;

public class VerticalCardTimestampBinderTest {
    @Test
    public void formatsUsageDurationWithoutInventingMinutes() {
        assertEquals("0m", VerticalCardTimestampBinder.formatDuration(0L));
        assertEquals("<1m", VerticalCardTimestampBinder.formatDuration(30_000L));
        assertEquals("49m", VerticalCardTimestampBinder.formatDuration(49L * 60_000L));
        assertEquals("1h", VerticalCardTimestampBinder.formatDuration(60L * 60_000L));
        assertEquals("2h 5m", VerticalCardTimestampBinder.formatDuration(125L * 60_000L));
    }

    @Test
    public void formatsLaunchCountsAsRequested() {
        assertEquals("Launched 0 times", VerticalCardTimestampBinder.formatLaunchCount(0L));
        assertEquals("Launched once", VerticalCardTimestampBinder.formatLaunchCount(1L));
        assertEquals("Launched twice", VerticalCardTimestampBinder.formatLaunchCount(2L));
        assertEquals("Launched 7 times", VerticalCardTimestampBinder.formatLaunchCount(7L));
    }
}
