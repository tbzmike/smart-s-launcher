name: Verify 3.30.198 history restart and download protection

on:
  push:
    branches:
      - fix/3.30.198-history-restart-download-protection

jobs:
  android:
    name: Real process restart, Settings and Auto Data / API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Seed History, force-stop launcher process, prove the same items render on cold start
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/verify_198_history_download.sh
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-restart-download-api-${{ matrix.api }}
          path: result-*.log
          archive: true
          if-no-files-found: ignore
