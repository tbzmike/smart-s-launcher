name: Verify 3.30.198 history restart and download protection

on:
  push:
    branches:
      - fix/3.30.198-history-restart-download-protection

jobs:
  android:
    name: Real process restart, Settings and Auto Data / API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Seed History, force-stop launcher process, prove the same items render on cold start
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            sed -i 's/minifyEnabled true/minifyEnabled false/g; s/shrinkResources = true/shrinkResources = false/g' app/build.gradle
            bash ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            for test in fr.neamar.kiss.androidTest.HistoryRestart198SeedTest fr.neamar.kiss.androidTest.HistoryRestart198VerifyTest fr.neamar.kiss.androidTest.LockedHistoryPopup196IntegrationTest fr.neamar.kiss.androidTest.AutoDataWiring196IntegrationTest fr.neamar.kiss.db.SearchRecallDatabase195RegressionTest; do
              echo "RUN $test"
              adb shell am force-stop com.tbzmike.smartslauncher.debug
              adb shell am instrument -w -r -e class "$test" com.tbzmike.smartslauncher.debug.test/androidx.test.runner.AndroidJUnitRunner | tee "result-$(echo "$test" | tr '.' '_').log"
              grep -E 'OK \([0-9]+ tests?\)' "result-$(echo "$test" | tr '.' '_').log"
              grep -F 'INSTRUMENTATION_CODE: -1' "result-$(echo "$test" | tr '.' '_').log"
            done
            echo 'PASS: Cold process restart / protected History / Auto Data / locked popup'
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-restart-download-api-${{ matrix.api }}
          path: result-*.log
          archive: true
          if-no-files-found: ignore
