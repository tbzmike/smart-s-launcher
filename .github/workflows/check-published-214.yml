name: Verify published 3.30.214 packages
on:
  push:
    branches: [verify/3.30.214-published-assets]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v3.30.214
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "37c2d2b5f3ddc2223afbd6b125b9a015ff09ccc7"
          gh release download v3.30.214 -p SmartSLauncher.apk -p SmartSLauncher-debug.apk
          SDK=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs SmartSLauncher.apk | grep -F '9da351d1880aee204832325b32bbe99f39f2b2b3dc178ec0e5d99d26ac236b53'
          for apk in SmartSLauncher.apk SmartSLauncher-debug.apk; do
            pkg=com.tbzmike.smartslauncher
            if [[ $apk == *-debug.apk ]]; then pkg=$pkg.debug; fi
            "$SDK/apksigner" verify "$apk"
            "$SDK/aapt" dump badging "$apk" > package.txt
            head -1 package.txt | grep -F "name='$pkg'" | grep -F "versionCode='643'" | grep -F "versionName='3.30.214'"
          done
          git archive --format=zip --output=source.zip HEAD
          gh release upload v3.30.214 source.zip
