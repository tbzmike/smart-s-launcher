name: Validate 3.30.197 Settings XML on Android 15 and 16

on:
  push:
    branches:
      - fix/3.30.197-settings-crash

jobs:
  settings-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Test locked Settings startup and Auto Data XML dependency
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            sed -i 's/minifyEnabled true/minifyEnabled false/g; s/shrinkResources = true/shrinkResources = false/g' app/build.gradle
            bash ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class fr.neamar.kiss.androidTest.SettingsXml197IntegrationTest,fr.neamar.kiss.androidTest.AutoDataWiring196IntegrationTest com.tbzmike.smartslauncher.debug.test/androidx.test.runner.AndroidJUnitRunner | tee settings-regression.log
            grep -F 'OK (2 tests)' settings-regression.log
            grep -F 'INSTRUMENTATION_CODE: -1' settings-regression.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settings-regression-api-${{ matrix.api }}
          path: settings-regression.log
          archive: true
          if-no-files-found: ignore
