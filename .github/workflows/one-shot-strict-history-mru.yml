name: One-shot strict History MRU fix

on: [push]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.ref == 'refs/heads/build/3.30.06' && github.event.head_commit.message == 'Run one-shot strict History MRU fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.06
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Patch authoritative History ordering and version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java')
          text = path.read_text()

          old = '        List<Pojo> pojos = dataHandler.getHistory(activity, getMaxResultCount(), excludedPojoById);\n'
          new = '        List<Pojo> pojos = getStrictRecencyHistory(activity, dataHandler, excludedPojoById);\n'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one configured History retrieval')
          text = text.replace(old, new, 1)

          marker = '''        this.addResults(pojos);\n        return null;\n    }\n\n    /**\n     * DataHandler intentionally skips history ids'''
          replacement = '''        this.addResults(pojos);\n        return null;\n    }\n\n    /** Resolve the visible History list from the database's strict newest-first RECENCY chain. */\n    private List<Pojo> getStrictRecencyHistory(MainActivity activity, DataHandler dataHandler,\n                                               Set<String> excludedPojoById) {\n        int max = getMaxResultCount();\n        if (max <= 0) return new ArrayList<>();\n\n        int extendedLimit = max + excludedPojoById.size();\n        List<ValuedHistoryRecord> records = DBHelper.getHistory(\n                activity, extendedLimit, HistoryRecencyOrder.MODE);\n        List<Pojo> history = new ArrayList<>(Math.min(max, records.size()));\n        int recordCount = records.size();\n\n        for (int i = 0; i < recordCount && history.size() < max; i++) {\n            String historyId = records.get(i).record;\n            if (historyId == null || excludedPojoById.contains(historyId)) continue;\n\n            Pojo pojo = dataHandler.getItemById(historyId);\n            if (pojo == null || excludedPojoById.contains(pojo.id)) continue;\n\n            pojo.relevance = HistoryRecencyOrder.relevanceForNewestFirstIndex(recordCount, i);\n            history.add(pojo);\n        }\n        return history;\n    }\n\n    /**\n     * DataHandler intentionally skips history ids'''
          if text.count(marker) != 1:
              raise SystemExit('Expected exact HistorySearcher insertion marker')
          text = text.replace(marker, replacement, 1)

          old_mode = '        HistoryMode historyMode = dataHandler.getHistoryMode();\n'
          new_mode = '        HistoryMode historyMode = HistoryRecencyOrder.MODE;\n'
          if text.count(old_mode) != 1:
              raise SystemExit('Expected exactly one missing-entry configured mode')
          text = text.replace(old_mode, new_mode, 1)
          path.write_text(text)

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          replacements = {
              '// Smart S Launcher 3.30.05': '// Smart S Launcher 3.30.06',
              'versionCode 433': 'versionCode 434',
              'versionName "3.30.05"': 'versionName "3.30.06"',
          }
          for oldv, newv in replacements.items():
              if g.count(oldv) != 1:
                  raise SystemExit(f'Expected exactly one version token: {oldv}')
              g = g.replace(oldv, newv, 1)
          gradle.write_text(g)
          PY
      - name: Verify intended source state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path('app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java').read_text()
          assert 'getStrictRecencyHistory(activity, dataHandler, excludedPojoById)' in h
          assert 'DBHelper.getHistory(\n                activity, extendedLimit, HistoryRecencyOrder.MODE)' in h
          assert 'HistoryMode historyMode = HistoryRecencyOrder.MODE;' in h
          assert 'dataHandler.getHistory(activity, getMaxResultCount(), excludedPojoById)' not in h
          g = Path('app/build.gradle').read_text()
          assert 'versionCode 434' in g
          assert 'versionName "3.30.06"' in g
          PY
          git diff --check
          git diff -- app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java app/build.gradle
      - name: Run exact History MRU regressions
        run: |
          ./gradlew testDebugUnitTest \
            --tests fr.neamar.kiss.searcher.HistoryRecencyOrderTest \
            --tests fr.neamar.kiss.adapter.HistoryRecencyPolicyTest \
            --tests fr.neamar.kiss.forwarder.HistoryRefreshPolicyTest \
            --stacktrace
      - name: Full verification
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify APK metadata
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='434'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.06'" /tmp/apk-badging.txt
      - name: Commit verified source fix
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java app/build.gradle
          git diff --cached --check
          git commit -m 'Make History a strict MRU chain and bump to 3.30.06'
          git push origin HEAD:build/3.30.06
