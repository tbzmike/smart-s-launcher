name: Apply verified 3.30.61 Vertical Cards viewport repair

on:
  push:
    branches:
      - fix/3.30.61-vertical-cards-passive-anchor

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact green 3.30.60 application baseline
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git merge-base 48f8886252f4910067774bea2d2483d2953b1148 HEAD)" = "48f8886252f4910067774bea2d2483d2953b1148"
          git diff --exit-code 48f8886252f4910067774bea2d2483d2953b1148 -- app
          grep -q 'versionCode 488' app/build.gradle
          grep -q 'versionName "3.30.60"' app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Apply guarded source repair
        run: python3 .github/scripts/apply_33061_vertical_passive_anchor.py

      - name: Verify exact application scope and invariants
        shell: bash
        run: |
          set -euxo pipefail
          git diff --name-only 48f8886252f4910067774bea2d2483d2953b1148 -- app | sort > /tmp/app_changed
          cat > /tmp/app_expected <<'EOF'
          app/build.gradle
          app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java
          app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardRefreshIdlePolicy.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportController.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicy.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalMapsCardForwarder.java
          app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardRefreshIdlePolicyTest.java
          app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicyTest.java
          EOF
          sort -o /tmp/app_expected /tmp/app_expected
          diff -u /tmp/app_expected /tmp/app_changed

          grep -q 'versionCode 489' app/build.gradle
          grep -q 'versionName "3.30.61"' app/build.gradle
          grep -q 'consumeDeferredKeepBottom' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'forceBottomForNextRebuild' app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java
          grep -q 'requestBottomOnNextRebuild' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicy.java
          grep -q 'scheduledRestoreGeneration' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportController.java
          grep -q 'hasCurrentScheduledRestore' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportController.java
          grep -q 'postApplySnapshot(true, false)' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          grep -q 'mutatePreservingViewport' app/src/main/java/fr/neamar/kiss/forwarder/VerticalMapsCardForwarder.java
          grep -q 'viewportController.captureForContentMutation' app/src/main/java/fr/neamar/kiss/forwarder/VerticalMapsCardForwarder.java
          grep -q 'viewportController.restoreAfterContentMutation' app/src/main/java/fr/neamar/kiss/forwarder/VerticalMapsCardForwarder.java

          # The flashing notification overlay must remain visual-only; do not introduce scroll writes there.
          if grep -qE '\.(scrollTo|scrollBy|smoothScrollTo|smoothScrollBy|fullScroll)\(' \
              app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardNotificationHistoryForwarder.java; then
            echo 'Notification forwarder unexpectedly writes the Vertical Cards scroll position' >&2
            exit 1
          fi

          # The custom Vertical Cards ScrollView remains single-owner: only its viewport controller
          # may directly write its Y position.
          writers="$(git grep -lE '\.(scrollTo|scrollBy|smoothScrollTo|smoothScrollBy|fullScroll)\(' -- \
              'app/src/main/java/fr/neamar/kiss/forwarder/Vertical*.java' \
              'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java' || true)"
          test "$writers" = 'app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportController.java'

      - name: Run focused viewport tests
        run: ./gradlew testDebugUnitTest --tests 'fr.neamar.kiss.forwarder.VerticalCardRefreshIdlePolicyTest' --tests 'fr.neamar.kiss.forwarder.VerticalCardViewportPolicyTest' --tests 'fr.neamar.kiss.forwarder.StableViewportAnchorTest' --stacktrace

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Remove temporary audit and repair helpers
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/audit-33061-vertical-scroll.yml
          git rm .github/workflows/apply-33061-vertical-passive-anchor.yml
          git rm .github/scripts/apply_33061_vertical_passive_anchor.py

      - name: Verify final source-only tree
        shell: bash
        run: |
          set -euxo pipefail
          git diff --name-only 48f8886252f4910067774bea2d2483d2953b1148 | sort > /tmp/final_changed
          cat > /tmp/final_expected <<'EOF'
          app/build.gradle
          app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java
          app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardRefreshIdlePolicy.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportController.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicy.java
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalMapsCardForwarder.java
          app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardRefreshIdlePolicyTest.java
          app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicyTest.java
          EOF
          sort -o /tmp/final_expected /tmp/final_expected
          diff -u /tmp/final_expected /tmp/final_changed
          test ! -e .github/workflows/audit-33061-vertical-scroll.yml
          test ! -e .github/workflows/apply-33061-vertical-passive-anchor.yml
          test ! -e .github/scripts/apply_33061_vertical_passive_anchor.py
          grep -q 'versionCode 489' app/build.gradle
          grep -q 'versionName "3.30.61"' app/build.gradle

      - name: Commit verified 3.30.61 repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Preserve Vertical Cards viewport through delayed geometry in 3.30.61'
          git push origin HEAD:fix/3.30.61-vertical-cards-passive-anchor
