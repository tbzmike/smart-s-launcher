name: One-time history recency source patch

on:
  push:
    branches:
      - feature/3.30.44-in-app-updater

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ !contains(github.event.head_commit.message, 'Apply universal history interaction recency') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/3.30.44-in-app-updater
          fetch-depth: 0
      - name: Apply exact verified source replacements
        shell: python
        run: |
          from pathlib import Path

          adapter = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java')
          text = adapter.read_text(encoding='utf-8')
          replacements = [
              (
                  '''            RecentLaunchTracker.remember(result.getPojo());\n            promoteHistoryResult(result);\n            result.launch(v.getContext(), v, parent);''',
                  '''            RecentLaunchTracker.remember(result.getPojo());\n            recordExplicitSelection(v.getContext(), result.getPojo());\n            promoteHistoryResult(result);\n            result.launch(v.getContext(), v, parent);'''
              ),
              (
                  '''            if (UiEditLock.isLocked(v.getContext())) {\n                return NotificationHistoryResolver.showForPojo(v.getContext(), result.getPojo());\n            }''',
                  '''            if (UiEditLock.isLocked(v.getContext())) {\n                recordExplicitSelection(v.getContext(), result.getPojo());\n                promoteHistoryResult(result);\n                return NotificationHistoryResolver.showForPojo(v.getContext(), result.getPojo());\n            }'''
              ),
              (
                  '''        Result<?> result = getItem(pos);\n        Context context = v.getContext();\n        if (UiEditLock.isLocked(context)) {''',
                  '''        Result<?> result = getItem(pos);\n        Context context = v.getContext();\n        recordExplicitSelection(context, result.getPojo());\n        promoteHistoryResult(result);\n        if (UiEditLock.isLocked(context)) {'''
              ),
              (
                  '''            final Result<?> result = getItem(position);\n            RecentLaunchTracker.remember(result.getPojo());\n            promoteHistoryResult(result);''',
                  '''            final Result<?> result = getItem(position);\n            RecentLaunchTracker.remember(result.getPojo());\n            recordExplicitSelection(v.getContext(), result.getPojo());\n            promoteHistoryResult(result);'''
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'RecordAdapter exact replacement expected once, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          adapter.write_text(text, encoding='utf-8')

          communication = Path('app/src/main/java/fr/neamar/kiss/result/CommunicationResult.java')
          text = communication.read_text(encoding='utf-8')
          old = '''    private void openMessageAndRecord(Context context, View view) {\n        if (!openMessage(context, view, true)) return;\n        RecentLaunchTracker.remember(pojo);\n        recordLaunch(context, null);\n    }'''
          new = '''    private void openMessageAndRecord(Context context, View view) {\n        RecentLaunchTracker.remember(pojo);\n        recordLaunch(context, null);\n        openMessage(context, view, true);\n    }'''
          if text.count(old) != 1:
              raise SystemExit('CommunicationResult openMessageAndRecord exact replacement mismatch')
          text = text.replace(old, new, 1)
          old = '''    private void markMessageRead(Context context) {\n        String notificationId = effectiveNotificationId(context);'''
          new = '''    private void markMessageRead(Context context) {\n        RecentLaunchTracker.remember(pojo);\n        recordLaunch(context, null);\n        String notificationId = effectiveNotificationId(context);'''
          if text.count(old) != 1:
              raise SystemExit('CommunicationResult markMessageRead exact replacement mismatch')
          text = text.replace(old, new, 1)
          communication.write_text(text, encoding='utf-8')
      - name: Verify only intended source files changed
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java\napp/src/main/java/fr/neamar/kiss/result/CommunicationResult.java'
          git diff --check
      - name: Commit exact source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/result/CommunicationResult.java
          git commit -m "Apply universal history interaction recency"
          git push origin HEAD:feature/3.30.44-in-app-updater
