name: One-time Smart S source rebrand migration

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/source-rebrand-migration.yml'

permissions:
  contents: write

jobs:
  migrate-branding:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Rebrand translated source strings
        run: python3 fdroid/rebrand_strings.py app/src/main/res

      - name: Verify and commit source migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'app/src/main/res/values*/strings.xml'; then
            echo 'No source branding changes were required.'
            exit 0
          fi
          if grep -RinE '>[^<]*\b[Kk][Ii][Ss][Ss]\b[^<]*<' app/src/main/res/values*/strings.xml; then
            echo 'Visible inherited KISS branding remains after migration.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'app/src/main/res/values*/strings.xml'
          git commit -m 'Rebrand localized strings for Smart S'
          git push origin HEAD:master
