name: Apply 3.30.32 IME session repair
on:
  push:
    branches: [build/3.30.32]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Retry guarded 3.30.32 IME session repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.32
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply guarded typing-session repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected exactly one anchor, found {n}')
              p.write_text(s.replace(old,new,1))

          p=Path('app/src/main/java/fr/neamar/kiss/MainActivity.java')
          s=p.read_text()
          if 'import androidx.core.view.ViewCompat;' not in s:
              s=s.replace('import androidx.core.content.ContextCompat;\n', 'import androidx.core.content.ContextCompat;\nimport androidx.core.view.ViewCompat;\n', 1)

          old='''                forwarderManager.onDataSetChanged();\n                applyGlobalTextScale(findViewById(android.R.id.content));'''
          new='''                // Preserve the exact active editor/IME session around every renderer refresh.\n                SearchInputSession inputSession = captureSearchInputSession();\n                forwarderManager.onDataSetChanged();\n                applyGlobalTextScale(findViewById(android.R.id.content), inputSession != null);\n                restoreSearchInputSession(inputSession);'''
          if s.count(old) != 1: raise SystemExit(f'MainActivity observer anchor count {s.count(old)}')
          s=s.replace(old,new,1)

          start=s.find('    private void applyGlobalTextScale(View view) {')
          end=s.find('    @Override\n    public boolean onCreateOptionsMenu(Menu menu) {', start)
          if start < 0 or end < 0: raise SystemExit('MainActivity global text block markers missing')
          replacement='''    private void applyGlobalTextScale(View view) {\n        applyGlobalTextScale(view, false);\n    }\n\n    private void applyGlobalTextScale(View view, boolean protectActiveEditor) {\n        int percent = Math.max(70, Math.min(160, prefs.getInt(PREF_GLOBAL_TEXT_SIZE_PERCENT, 100)));\n        applyGlobalTextScale(view, percent / 100f, protectActiveEditor);\n    }\n\n    private void applyGlobalTextScale(View view, float scale, boolean protectActiveEditor) {\n        if (view instanceof TextView) {\n            TextView text = (TextView) view;\n            if (!(protectActiveEditor && text == searchEditText)) {\n                Object baseline = text.getTag(TAG_GLOBAL_TEXT_BASELINE);\n                float basePx;\n                if (baseline instanceof Float) {\n                    basePx = (Float) baseline;\n                } else {\n                    basePx = text.getTextSize();\n                    text.setTag(TAG_GLOBAL_TEXT_BASELINE, basePx);\n                }\n                float targetPx = basePx * scale;\n                if (Math.abs(text.getTextSize() - targetPx) > 0.5f) {\n                    text.setTextSize(TypedValue.COMPLEX_UNIT_PX, targetPx);\n                }\n            }\n        }\n        if (view instanceof ViewGroup) {\n            ViewGroup group = (ViewGroup) view;\n            for (int i = 0; i < group.getChildCount(); i++) {\n                applyGlobalTextScale(group.getChildAt(i), scale, protectActiveEditor);\n            }\n        }\n    }\n\n    private SearchInputSession captureSearchInputSession() {\n        if (searchEditText == null || !searchEditText.isAttachedToWindow()\n                || !searchEditText.isShown() || !searchEditText.hasFocus()) {\n            return null;\n        }\n        WindowInsetsCompat insets = ViewCompat.getRootWindowInsets(searchEditText);\n        boolean imeVisible = insets != null && insets.isVisible(WindowInsetsCompat.Type.ime());\n        return new SearchInputSession(searchEditText.getSelectionStart(),\n                searchEditText.getSelectionEnd(), imeVisible);\n    }\n\n    private void restoreSearchInputSession(@Nullable SearchInputSession session) {\n        if (session == null || searchEditText == null || isFinishing()) return;\n\n        restoreSearchEditorFocusAndSelection(session);\n        if (!session.imeWasVisible) return;\n\n        searchEditText.postOnAnimation(() -> {\n            if (isFinishing()\n                    || (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN_MR1 && isDestroyed())\n                    || !searchEditText.isAttachedToWindow() || !searchEditText.isShown()) {\n                return;\n            }\n            restoreSearchEditorFocusAndSelection(session);\n            WindowInsetsCompat insets = ViewCompat.getRootWindowInsets(searchEditText);\n            boolean imeVisible = insets != null && insets.isVisible(WindowInsetsCompat.Type.ime());\n            if (!imeVisible && searchEditText.hasWindowFocus()) {\n                WindowCompat.getInsetsController(getWindow(), searchEditText)\n                        .show(WindowInsetsCompat.Type.ime());\n            }\n        });\n    }\n\n    private void restoreSearchEditorFocusAndSelection(SearchInputSession session) {\n        if (!searchEditText.hasFocus()) searchEditText.requestFocus();\n        if (!searchEditText.hasFocus()) return;\n        searchEditText.setCursorVisible(true);\n        int length = searchEditText.length();\n        int start = Math.max(0, Math.min(session.selectionStart, length));\n        int end = Math.max(0, Math.min(session.selectionEnd, length));\n        if (searchEditText.getSelectionStart() != start || searchEditText.getSelectionEnd() != end) {\n            searchEditText.setSelection(start, end);\n        }\n    }\n\n    private static final class SearchInputSession {\n        final int selectionStart;\n        final int selectionEnd;\n        final boolean imeWasVisible;\n\n        SearchInputSession(int selectionStart, int selectionEnd, boolean imeWasVisible) {\n            this.selectionStart = selectionStart;\n            this.selectionEnd = selectionEnd;\n            this.imeWasVisible = imeWasVisible;\n        }\n    }\n\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p='app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java'
          once(p, '''        if (preserveSearchFocus && !mainActivity.searchEditText.hasFocus()) {\n            // Restore only a focus state that existed before this rebuild. This is not an\n            // unconditional IME reopen: it simply prevents card-tree replacement from ending\n            // an active typing session.\n            mainActivity.showKeyboard();\n        }''', '''        if (preserveSearchFocus && !mainActivity.searchEditText.hasFocus()) {\n            // MainActivity owns IME recovery after all layout work. Avoid a synchronous insets\n            // show here, which can race the current IME/layout transaction.\n            mainActivity.searchEditText.requestFocus();\n            mainActivity.searchEditText.setCursorVisible(true);\n        }''')

          p='app/build.gradle'
          once(p, 'versionCode 459', 'versionCode 460')
          once(p, 'versionName "3.30.31"', 'versionName "3.30.32"')
          once(p, '// Smart S Launcher 3.30.31 - add independent global launcher text-size adjustment', '// Smart S Launcher 3.30.32 - preserve active search IME sessions across every result layout')
          PY

      - name: Verify exact source scope and keyboard invariants
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' app/build.gradle app/src/main/java/fr/neamar/kiss/MainActivity.java app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java | sort)"
          grep -q 'versionCode 460' app/build.gradle
          grep -q 'versionName "3.30.32"' app/build.gradle
          grep -q 'captureSearchInputSession' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -q 'restoreSearchInputSession' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -q 'protectActiveEditor && text == searchEditText' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -q 'ViewCompat.getRootWindowInsets(searchEditText)' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -q 'if (!imeVisible && searchEditText.hasWindowFocus())' app/src/main/java/fr/neamar/kiss/MainActivity.java
          ! grep -A8 'if (preserveSearchFocus && !mainActivity.searchEditText.hasFocus())' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java | grep -q 'showKeyboard()'
          grep -q 'cardTextLineBudget' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'configureCollapsedMessage' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'applySearchFocusIsolation' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'Global text size' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -q 'NotificationAvatarSupport.loadHistoryAvatarsAsync' app/src/main/java/fr/neamar/kiss/MainActivity.java

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Commit verified app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/MainActivity.java app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          git commit -m 'Preserve search IME sessions across all layouts in 3.30.32'
          git push origin HEAD:build/3.30.32
