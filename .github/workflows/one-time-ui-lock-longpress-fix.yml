name: One-time UI lock long-press fix

on:
  push:
    branches:
      - fix/3.30.40-ui-lock-long-press

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add guarded UI-lock long-press patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.40-ui-lock-long-press
          fetch-depth: 0
      - name: Apply exact guarded changes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java',
              '''        View.OnLongClickListener openRichNotification = v ->\n                NotificationHistoryResolver.showForPojo(v.getContext(), result.getPojo());\n''',
              '''        View.OnLongClickListener openRichNotification = v -> {\n            int position = results.indexOf(result);\n            if (UiEditLock.isLocked(v.getContext())) {\n                return NotificationHistoryResolver.showForPojo(v.getContext(), result.getPojo());\n            }\n            if (position >= 0) {\n                onLongClick(position, v);\n                return true;\n            }\n            return false;\n        };\n''')

          replace_exact(
              'app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java',
              '''        Context context = v.getContext();\n        if (showNotificationHistoryIfAvailable(pos, v)) return;\n        if (UiEditLock.isLocked(context)) return;\n        ListPopup menu = result.getPopupMenu(context, this, v);\n''',
              '''        Context context = v.getContext();\n        if (UiEditLock.isLocked(context)) {\n            showNotificationHistoryIfAvailable(pos, v);\n            return;\n        }\n        ListPopup menu = result.getPopupMenu(context, this, v);\n''')

          replace_exact(
              'app/src/main/java/fr/neamar/kiss/forwarder/UNotificationHistoryLongPressForwarder.java',
              '''import fr.neamar.kiss.MainActivity;\nimport fr.neamar.kiss.utils.NotificationHistoryResolver;\n''',
              '''import fr.neamar.kiss.MainActivity;\nimport fr.neamar.kiss.preference.UiEditLock;\nimport fr.neamar.kiss.utils.NotificationHistoryResolver;\n''')

          replace_exact(
              'app/src/main/java/fr/neamar/kiss/forwarder/UNotificationHistoryLongPressForwarder.java',
              '''    private void refresh() {\n        if (!isUStyle()) {\n            detach();\n            historyPositions.clear();\n            return;\n        }\n''',
              '''    private void refresh() {\n        if (!isUStyle() || !UiEditLock.isLocked(mainActivity)) {\n            detach();\n            historyPositions.clear();\n            return;\n        }\n''')

          replace_exact(
              'app/src/main/java/fr/neamar/kiss/forwarder/UNotificationHistoryLongPressForwarder.java',
              '''    private void applyHistoryLongPress() {\n        if (!isUStyle() || squareTrack == null || mainActivity.adapter == null) return;\n''',
              '''    private void applyHistoryLongPress() {\n        if (!isUStyle() || !UiEditLock.isLocked(mainActivity)\n                || squareTrack == null || mainActivity.adapter == null) return;\n''')

          replace_exact(
              'app/build.gradle',
              '''        // Smart S Launcher 3.30.39 - restore History after HOME from search\n        versionCode 467\n        versionName "3.30.39"\n''',
              '''        // Smart S Launcher 3.30.40 - UI-lock-aware long-press routing\n        versionCode 468\n        versionName "3.30.40"\n''')
      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/forwarder/UNotificationHistoryLongPressForwarder.java
          git diff --cached --check
          git commit -m "Fix unlocked long-press routing in 3.30.40"
          git push origin HEAD:fix/3.30.40-ui-lock-long-press
