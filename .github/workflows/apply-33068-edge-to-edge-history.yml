# Trigger corrected guarded 3.30.68 verification
name: Guarded 3.30.68 edge-to-edge history
on:
  push:
    branches: [fix/3.30.68-edge-to-edge-history]
    paths: ['.github/workflows/apply-33068-edge-to-edge-history.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact green 3.30.67 application baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 6c5578953f61dc7cc0e572a971d3cb4ec153813e HEAD -- app)"
          grep -Fq 'versionCode 495' app/build.gradle
          grep -Fq 'versionName "3.30.67"' app/build.gradle
          grep -Fq 'android:layout_marginStart="@dimen/list_margin_horizontal"' app/src/main/res/layout/main.xml
          grep -Fq 'int targetWidth = Math.round(available * widthPercent / 100f);' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java
      - name: Apply guarded 3.30.68 source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_33068_edge_to_edge_history.py
          python3 .github/scripts/fix_33068_test_api.py
      - name: Verify exact source scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --short | sed -E 's/^.. //' | grep '^app/' | sort)
          printf '%s\n' "${files[@]}"
          allowed='^(app/build.gradle|app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java|app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicy.java|app/src/main/res/layout/main.xml|app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicyTest.java)$'
          for f in "${files[@]}"; do [[ "$f" =~ $allowed ]] || { echo "Unexpected app file: $f"; exit 1; }; done
          test ${#files[@]} -eq 5
          grep -Fq 'versionCode 496' app/build.gradle
          grep -Fq 'versionName "3.30.68"' app/build.gradle
          ! grep -Fq '@dimen/list_margin_horizontal' app/src/main/res/layout/main.xml
          grep -Fq 'android:id="@+id/resultLayout"' app/src/main/res/layout/main.xml
          grep -Fq 'android:layout_width="match_parent"' app/src/main/res/layout/main.xml
          grep -Fq 'VerticalCardWidthPolicy.insetForPercent(dp(8), widthPercent)' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java
          grep -Fq 'widthPercent >= 100' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java
          ! grep -Fq 'int targetWidth = Math.round(available * widthPercent / 100f);' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java
          grep -Fq 'if (percent >= NORMAL_PERCENT) return availablePx;' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicy.java
          grep -Fq 'if (percent <= NORMAL_PERCENT) return baseInsetPx;' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicy.java
          grep -Fq 'org.junit.jupiter.api.Test' app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicyTest.java
          grep -Fq 'org.hamcrest.MatcherAssert.assertThat' app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicyTest.java
          ! grep -Fq 'org.junit.Assert' app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicyTest.java
      - name: Focused regression tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests 'fr.neamar.kiss.forwarder.VerticalCardWidthPolicyTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardViewportPolicyTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardUserScrollGesturePolicyTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardRefreshIdlePolicyTest'
          --tests 'fr.neamar.kiss.ui.NotificationBellPolicyTest'
          --tests 'fr.neamar.kiss.SearchLaunchReturnStateTest'
          --tests 'fr.neamar.kiss.LauncherHomeLifecycleStateTest'
          --stacktrace
      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Remove temporary helpers and verify final app-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-33068-edge-to-edge-history.yml
          rm .github/scripts/apply_33068_edge_to_edge_history.py
          rm .github/scripts/fix_33068_test_api.py
          mapfile -t final_files < <({ git diff --name-only 6c5578953f61dc7cc0e572a971d3cb4ec153813e -- app; git ls-files --others --exclude-standard app; } | sort -u)
          printf '%s\n' "${final_files[@]}"
          test ${#final_files[@]} -eq 5
          grep -Fq 'versionName "3.30.68"' app/build.gradle
          ! grep -Fq '@dimen/list_margin_horizontal' app/src/main/res/layout/main.xml
          test ! -e .github/workflows/apply-33068-edge-to-edge-history.yml
          test ! -e .github/scripts/apply_33068_edge_to_edge_history.py
          test ! -e .github/scripts/fix_33068_test_api.py
      - name: Commit verified 3.30.68 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use full history viewport and bound Vertical Card width in 3.30.68'
          git push origin HEAD:fix/3.30.68-edge-to-edge-history
