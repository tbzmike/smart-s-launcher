name: Verify deep links 3.30.10

on:
  push:
    branches:
      - build/3.30.10

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message != 'Fix exact deep-link result launching'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.10
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Apply guarded source patch
        run: python3 .github/deep_link_33010.py
      - name: Verify intended source state
        run: |
          grep -q 'versionCode 438' app/build.gradle
          grep -q 'versionName "3.30.10"' app/build.gradle
          grep -q 'openLatestNotification' app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java
          grep -q 'Unable to open this exact shortcut' app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java
          grep -q 'launchNotificationTarget' app/src/main/java/fr/neamar/kiss/result/SettingsResult.java
          grep -q 'pojo.getContactData() != null' app/src/main/java/fr/neamar/kiss/result/ContactsResult.java
          grep -q 'View.OnClickListener openExactTarget' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          ! grep -q 'launchShortcutFallbackApp' app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java
          ! grep -q 'opened = AppLaunchUtils.launchPackage' app/src/main/java/fr/neamar/kiss/ui/NotificationPopupDialog.java
          grep -q 'smart-detect-frozen-apps' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q 'smart-keep-frozen-searchable' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q 'publishCurrentResults' app/src/main/java/fr/neamar/kiss/searcher/Searcher.java
          git diff --check
      - name: Full Android verification
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify APK version
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='438'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.10'" /tmp/apk-badging.txt
      - name: Commit verified production source
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java \
            app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java \
            app/src/main/java/fr/neamar/kiss/result/AppResult.java \
            app/src/main/java/fr/neamar/kiss/result/ContactsResult.java \
            app/src/main/java/fr/neamar/kiss/result/SettingsResult.java \
            app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java \
            app/src/main/java/fr/neamar/kiss/ui/NotificationPopupDialog.java
          git diff --cached --check
          git commit -m 'Fix exact deep-link result launching'
          git push origin HEAD:build/3.30.10
