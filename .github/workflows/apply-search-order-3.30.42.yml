name: Apply guarded 3.30.42 search ordering

on:
  push:
    branches:
      - fix/3.30.42-search-result-order
    paths:
      - .github/workflows/apply-search-order-3.30.42.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified search ordering patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          searcher = Path('app/src/main/java/fr/neamar/kiss/searcher/Searcher.java')
          preview = Path('app/src/main/java/fr/neamar/kiss/searcher/HistoryPreviewMatcher.java')
          comparator = Path('app/src/main/java/fr/neamar/kiss/searcher/QueryResultComparator.java')
          gradle = Path('app/build.gradle')
          workflow = Path('.github/workflows/apply-search-order-3.30.42.yml')

          s = searcher.read_text()
          old = '''    PriorityQueue<Pojo> getPojoProcessor(Context context) {\n        return new PriorityQueue<>(DEFAULT_MAX_RESULTS, new RelevanceComparator());\n    }'''
          new = '''    PriorityQueue<Pojo> getPojoProcessor(Context context) {\n        // Query results have an explicit presentation contract: generic matches are above apps,\n        // frozen apps are above active apps, and relevance increases toward the bottom. Keep this\n        // comparator query-only so History, Tags, Applications and NULL modes retain their existing\n        // ordering semantics.\n        java.util.Comparator<Pojo> comparator = this instanceof QuerySearcher\n                ? new QueryResultComparator()\n                : new RelevanceComparator();\n        return new PriorityQueue<>(DEFAULT_MAX_RESULTS, comparator);\n    }'''
          if s.count(old) != 1:
              raise SystemExit('Searcher guard failed: expected original getPojoProcessor exactly once')
          searcher.write_text(s.replace(old, new, 1))

          p = preview.read_text()
          old_return = '''        return matches;\n    }\n\n    private static String candidateText(Pojo pojo) {'''
          new_return = '''        // Keep the instant history-first preview in the exact same bottom-anchored order as the\n        // completed QuerySearcher. Java's List.sort is stable, so equal matches preserve the seed's\n        // oldest-to-newest order and therefore keep the more recent equal match nearer the bottom.\n        matches.sort((left, right) -> {\n            int group = Integer.compare(QueryResultComparator.priorityGroup(left),\n                    QueryResultComparator.priorityGroup(right));\n            if (group != 0) return group;\n\n            int quality = Integer.compare(matchQuality(left, normalizedQuery),\n                    matchQuality(right, normalizedQuery));\n            if (quality != 0) return quality;\n            return 0;\n        });\n        return matches;\n    }\n\n    private static int matchQuality(Pojo pojo, String normalizedQuery) {\n        if (pojo == null || normalizedQuery.isEmpty()) return 0;\n        String name = normalize(pojo.getName());\n        String candidate = candidateText(pojo);\n        if (name.equals(normalizedQuery)) return 5;\n        if (name.startsWith(normalizedQuery)) return 4;\n        if (containsTokenPrefix(name, normalizedQuery)) return 3;\n        if (name.contains(normalizedQuery)) return 2;\n        if (candidate.contains(normalizedQuery)) return 1;\n        return 0;\n    }\n\n    private static String candidateText(Pojo pojo) {'''
          if p.count(old_return) != 1:
              raise SystemExit('HistoryPreviewMatcher guard failed: insertion point not unique')
          preview.write_text(p.replace(old_return, new_return, 1))

          if comparator.exists():
              raise SystemExit('Comparator guard failed: file already exists')
          comparator.write_text('''package fr.neamar.kiss.searcher;\n\nimport java.util.Comparator;\n\nimport fr.neamar.kiss.pojo.AppPojo;\nimport fr.neamar.kiss.pojo.Pojo;\nimport fr.neamar.kiss.pojo.RelevanceComparator;\n\n/**\n * Query-only ordering for Smart S Launcher search results.\n *\n * The adapter is bottom-anchored: ascending comparator order is rendered from weaker/top to\n * stronger/bottom. Therefore generic matches use group 0, frozen apps group 1 and active apps\n * group 2. Relevance remains the secondary key inside each group.\n */\nfinal class QueryResultComparator implements Comparator<Pojo> {\n    private final RelevanceComparator relevanceComparator = new RelevanceComparator();\n\n    static int priorityGroup(Pojo pojo) {\n        if (!(pojo instanceof AppPojo)) return 0;\n        return pojo.isDisabled() ? 1 : 2;\n    }\n\n    @Override\n    public int compare(Pojo lhs, Pojo rhs) {\n        int group = Integer.compare(priorityGroup(lhs), priorityGroup(rhs));\n        if (group != 0) return group;\n        return relevanceComparator.compare(lhs, rhs);\n    }\n}\n''')

          g = gradle.read_text()
          old_version = '''        // Smart S Launcher 3.30.41 - marquee universal history interaction metadata\n        versionCode 469\n        versionName "3.30.41"'''
          new_version = '''        // Smart S Launcher 3.30.42 - bottom-anchored app-first search relevance ordering\n        versionCode 470\n        versionName "3.30.42"'''
          if g.count(old_version) != 1:
              raise SystemExit('Version guard failed: expected exact 3.30.41 metadata')
          gradle.write_text(g.replace(old_version, new_version, 1))

          workflow.unlink()
          PY

          git diff --check
          git status --short
          git diff -- app/src/main/java/fr/neamar/kiss/searcher/Searcher.java \
            app/src/main/java/fr/neamar/kiss/searcher/HistoryPreviewMatcher.java \
            app/src/main/java/fr/neamar/kiss/searcher/QueryResultComparator.java app/build.gradle

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prioritize active apps at bottom of search results"
          git push
