name: Verify and release Smart S Launcher 3.30.221

on:
  push:
    branches:
      - feature/3.30.221-floating-window-surface

permissions:
  contents: write
  actions: read

concurrency:
  group: release-221-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, unit test, and compile production APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Confirm exact update version, unchanged minification and compile results
        run: |
          grep -q 'versionCode 650' app/build.gradle
          grep -q 'versionName "3.30.221"' app/build.gradle
          test "$(grep -c 'minifyEnabled true' app/build.gradle)" = 2
          gradle_ok=0
          for attempt in 1 2 3; do
            if bash ./gradlew --no-configuration-cache lint testDebugUnitTest assembleDebug assembleRelease --stacktrace; then gradle_ok=1; break; fi
            echo "Gradle dependency resolution/build failed; bounded retry $attempt/3" >&2
            sleep 6
          done
          test "$gradle_ok" = 1
      - name: Collect APKs with exact expected input names
        run: |
          mkdir -p release-input
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-input/
          cp app/build/outputs/apk/debug/app-debug.apk release-input/
          test -s release-input/app-release-unsigned.apk
          test -s release-input/app-debug.apk
      - name: Compile shared runtime verification APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-input shortcut-fixture/src/main/res/raw
          cp release-input/app-debug.apk runtime-input/minified-debug.apk
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null; fi
          ffmpeg -nostdin -loglevel error -y -f lavfi -i testsrc2=size=64x48:rate=12 -f lavfi -i sine=frequency=440 -t 18 -c:v libx264 -pix_fmt yuv420p -c:a aac shortcut-fixture/src/main/res/raw/bubble_playback.mp4
          build_runtime() {
            for attempt in 1 2 3; do
              if bash ./gradlew --no-configuration-cache "$@" --stacktrace; then return 0; fi
              sleep 6
            done
            return 1
          }
          build_runtime -PshortcutFixtures :shortcut-fixture:assembleTargetDebug :shortcut-fixture:assembleIceboxDebug
          cp shortcut-fixture/build/outputs/apk/target/debug/shortcut-fixture-target-debug.apk runtime-input/target.apk
          cp shortcut-fixture/build/outputs/apk/icebox/debug/shortcut-fixture-icebox-debug.apk runtime-input/icebox.apk
          trap 'git restore app/build.gradle' EXIT
          sed -i 's/minifyEnabled true/minifyEnabled false/g; s/shrinkResources = true/shrinkResources = false/g' app/build.gradle
          build_runtime :app:assembleDebug :app:assembleDebugAndroidTest
          cp app/build/outputs/apk/debug/app-debug.apk runtime-input/instrumented-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk runtime-input/instrumentation.apk
          git rev-parse HEAD > runtime-input/source-commit.txt
          (cd runtime-input && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-input-221
          path: runtime-input
          archive: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-input-221
          path: release-input
          archive: true
          if-no-files-found: error

  android:
    name: Real overlay gestures, fullscreen geometry and retained regressions on Android ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: runtime-input-221
          path: runtime-input
      - name: Verify shared APK identity and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat runtime-input/source-commit.txt)" = "$GITHUB_SHA"
          (cd runtime-input && sha256sum -c SHA256SUMS)
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify native task geometry, actual app pixels and live overlay gestures
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: export SMART_S_RUNTIME_INPUT="$GITHUB_WORKSPACE/runtime-input"; bash scripts/verify_201_battery_stability.sh && bash scripts/verify_207_freeform_geometry.sh
      - name: Save Android verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verified-221-android-${{ matrix.api }}
          path: verification-results
          archive: true
          if-no-files-found: ignore

  release:
    name: Sign and publish Smart S Launcher 3.30.221
    needs: [build, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-input-221
          path: release-input
      - name: Sign and verify the original app identity
        shell: bash
        env:
          SMART_S_SIGNING_KEY_B64: ${{ secrets.SMART_S_SIGNING_KEY_B64 }}
          SMART_S_SIGNING_STORE_PASSWORD: ${{ secrets.SMART_S_SIGNING_STORE_PASSWORD }}
          SMART_S_SIGNING_KEY_ALIAS: ${{ secrets.SMART_S_SIGNING_KEY_ALIAS }}
          SMART_S_SIGNING_KEY_PASSWORD: ${{ secrets.SMART_S_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/smart-s-200-release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          SDK="$ANDROID_HOME/build-tools/34.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
          test -n "$SMART_S_SIGNING_KEY_B64"
          printf '%s' "$SMART_S_SIGNING_KEY_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          mkdir -p verified-apk
          "$SDK/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-key-alias "$SMART_S_SIGNING_KEY_ALIAS" \
            --ks-pass env:SMART_S_SIGNING_STORE_PASSWORD \
            --key-pass env:SMART_S_SIGNING_KEY_PASSWORD \
            --out verified-apk/SmartSLauncher.apk release-input/app-release-unsigned.apk
          "$SDK/apksigner" verify --verbose --print-certs verified-apk/SmartSLauncher.apk | tee verified-apk/apk-verification.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' verified-apk/apk-verification.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$CERT" = '9da351d1880aee204832325b32bbe99f39f2b2b3dc178ec0e5d99d26ac236b53'
          "$SDK/aapt" dump badging verified-apk/SmartSLauncher.apk > verified-apk/package-badging.txt
          head -n 1 verified-apk/package-badging.txt | grep -F "name='com.tbzmike.smartslauncher'" | grep -F "versionCode='650'" | grep -F "versionName='3.30.221'"
          sha256sum verified-apk/SmartSLauncher.apk > verified-apk/SmartSLauncher.sha256
          git rev-parse HEAD > verified-apk/source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-3.30.221-signed
          path: verified-apk
          archive: true
          if-no-files-found: error
          retention-days: 90
      - name: Prepare release and updater assets
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp verified-apk/SmartSLauncher.apk SmartSLauncher.apk
          cp SmartSLauncher.apk smart-s-launcher-3.30.221.apk
          cp release-input/app-debug.apk SmartSLauncher-debug.apk
          cp SmartSLauncher-debug.apk app-debug.apk
          python3 scripts/prepare_updater_221.py
          git archive --format=zip --output=source.zip HEAD
          test -s source.zip
      - name: Publish verified APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v3.30.221
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha | grep -Fx "$GITHUB_SHA"
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq source.zip; then
              gh release upload "$TAG" source.zip
            fi
          else
            gh release create "$TAG" --latest --target "$GITHUB_SHA" \
              --title "Smart S Launcher v3.30.221" \
              --notes "Optional live miniature floating-window presentation, selectable in the launcher menu, alongside existing icon bubbles. Integrated live rendering, touch controls and stable display identity across minimize/restore. Android 15 and 16 pixel and playback verification required. Update with your existing signing edition." \
              SmartSLauncher.apk SmartSLauncher-debug.apk smart-s-launcher-3.30.221.apk app-debug.apk latest-green.json source.zip
          fi
          gh release edit "$TAG" --latest --target "$GITHUB_SHA"
      - name: Refresh updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=updater-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
            gh release upload "$TAG" --clobber SmartSLauncher.apk SmartSLauncher-debug.apk latest-green.json
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "Smart S Launcher — updater latest" \
              SmartSLauncher.apk SmartSLauncher-debug.apk latest-green.json
          fi
          PUSH_DIR="$RUNNER_TEMP/smart-s-200-updater"
          mkdir -p "$PUSH_DIR"
          cp latest-green.json "$PUSH_DIR/"
          cd "$PUSH_DIR"
          git init -q
          git checkout -qb updater-channel
          git config user.name "github-actions[bot]"
          git config user.email "41928282+github-actions[bot]@users.noreply.github.com"
          git add latest-green.json
          git commit -qm "Publish signed Smart S Launcher 3.30.221"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:updater-channel
