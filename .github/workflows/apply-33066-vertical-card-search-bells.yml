name: Guarded 3.30.66 Vertical Cards search and notification bells
on:
  push:
    branches: [fix/3.30.66-vertical-card-search-bells]
    paths: ['.github/workflows/apply-33066-vertical-card-search-bells.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact green 3.30.65 application baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only fb5b2fe7731e99551de5682e824cd6fda5bfb146 HEAD -- app)"
          grep -Fq 'versionName "3.30.65"' app/build.gradle
          grep -Fq 'private static final long ACTIVE_QUERY_REBUILD_DEBOUNCE_MS = 64L;' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'void onHomeIntent' app/src/main/java/fr/neamar/kiss/LauncherHomeLifecycleState.java
      - name: Apply original guarded source transform
        run: python3 .github/scripts/apply_33066_vertical_card_search_bells.py
      - name: Apply verified screenshot and lint corrections
        run: python3 .github/scripts/apply_33066_v2.py
      - name: Verify exact corrected source scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --short | sed -E 's/^.. //' | grep '^app/' | sort)
          printf '%s\n' "${files[@]}"
          allowed='^(app/build.gradle|app/src/main/java/fr/neamar/kiss/(MainActivity.java|SearchLaunchReturnState.java|adapter/RecordAdapter.java|forwarder/HistoryDisplayForwarder.java|forwarder/SmartCardListForwarder.java|ui/NotificationBellStyle.java)|app/src/main/res/drawable/ic_notification_bell.xml|app/src/test/java/fr/neamar/kiss/SearchLaunchReturnStateTest.java)$'
          for f in "${files[@]}"; do [[ "$f" =~ $allowed ]] || { echo "Unexpected app file: $f"; exit 1; }; done
          test ${#files[@]} -eq 9
          grep -Fq 'versionCode 494' app/build.gradle
          grep -Fq 'versionName "3.30.66"' app/build.gradle
          grep -Fq 'ACTIVE_QUERY_REBUILD_DEBOUNCE_MS = 120L' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'reconcileActiveQueryCards()' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          ! grep -Fq 'suppressLayout(' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'for (View stale : existingById.values())' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq '|| hasActiveNotification || hasMessage' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'NotificationBellStyle.applyToResult(view, result)' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -Fq 'SmartStateStore.latestNotificationForPackage' app/src/main/java/fr/neamar/kiss/ui/NotificationBellStyle.java
          grep -Fq 'CommunicationPojo.Kind.TRUECALLER_NOTIFICATION' app/src/main/java/fr/neamar/kiss/ui/NotificationBellStyle.java
          grep -Fq 'NotificationBellStyle.isNotificationItem(mainActivity, result, source)' app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java
          grep -Fq 'searchLaunchReturnState.onHomeIntent(searchResultsActive)' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -Fq 'showHistory();' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -Fq 'void onHomeIntent(boolean searchResultsActive)' app/src/main/java/fr/neamar/kiss/SearchLaunchReturnState.java
          test "$(grep -Fc 'NotificationBellStyle' app/src/main/java/fr/neamar/kiss/result/SettingsResult.java || true)" -eq 0
      - name: Focused regression tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests 'fr.neamar.kiss.SearchLaunchReturnStateTest'
          --tests 'fr.neamar.kiss.LauncherHomeLifecycleStateTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardViewportPolicyTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardUserScrollGesturePolicyTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardRefreshIdlePolicyTest'
          --stacktrace
      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Remove temporary guard helpers and verify final source-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-33066-vertical-card-search-bells.yml
          rm .github/scripts/apply_33066_vertical_card_search_bells.py
          rm .github/scripts/apply_33066_v2.py
          mapfile -t final_files < <({ git diff --name-only fb5b2fe7731e99551de5682e824cd6fda5bfb146 -- app; git ls-files --others --exclude-standard app; } | sort -u)
          printf '%s\n' "${final_files[@]}"
          test ${#final_files[@]} -eq 9
          grep -Fq 'versionName "3.30.66"' app/build.gradle
          ! grep -Fq 'suppressLayout(' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          test ! -e .github/workflows/apply-33066-vertical-card-search-bells.yml
          test ! -e .github/scripts/apply_33066_vertical_card_search_bells.py
          test ! -e .github/scripts/apply_33066_v2.py
      - name: Commit verified 3.30.66 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Vertical Cards search, HOME reset and notification bells in 3.30.66'
          git push origin HEAD:fix/3.30.66-vertical-card-search-bells
