name: Guarded 3.30.66 Vertical Cards search and notification bells
on:
  push:
    branches: [fix/3.30.66-vertical-card-search-bells]
    paths: ['.github/workflows/apply-33066-vertical-card-search-bells.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact green 3.30.65 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fb5b2fe7731e99551de5682e824cd6fda5bfb146"
          test -z "$(git diff --name-only fb5b2fe7731e99551de5682e824cd6fda5bfb146 HEAD -- app)"
          grep -Fq 'versionName "3.30.65"' app/build.gradle
          grep -Fq 'private static final long ACTIVE_QUERY_REBUILD_DEBOUNCE_MS = 64L;' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
      - name: Apply guarded 3.30.66 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count}, found {found}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          patch('app/build.gradle',
                '''        // Smart S Launcher 3.30.65 - reliable search return, durable notification routes and reinstall source\n        versionCode 493\n        versionName "3.30.65"''',
                '''        // Smart S Launcher 3.30.66 - recycled Vertical Cards search and notification identity bells\n        versionCode 494\n        versionName "3.30.66"''')

          s = 'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java'
          patch(s,
                '''import java.util.Collections;\nimport java.util.LinkedHashMap;\nimport java.util.Map;''',
                '''import java.util.Collections;\nimport java.util.HashMap;\nimport java.util.LinkedHashMap;\nimport java.util.Map;''')
          patch(s,
                '''import fr.neamar.kiss.pojo.CommunicationPojo;\nimport fr.neamar.kiss.result.AppResult;''',
                '''import fr.neamar.kiss.pojo.CommunicationPojo;\nimport fr.neamar.kiss.pojo.NotificationHistorySearchPojo;\nimport fr.neamar.kiss.pojo.NotificationPojo;\nimport fr.neamar.kiss.result.AppResult;''')
          patch(s,
                '''import fr.neamar.kiss.ui.AutoMarqueeTextView;\nimport fr.neamar.kiss.ui.SmartAnimationEngine;''',
                '''import fr.neamar.kiss.ui.AutoMarqueeTextView;\nimport fr.neamar.kiss.ui.NotificationBellStyle;\nimport fr.neamar.kiss.ui.SmartAnimationEngine;''')
          patch(s,
                'private static final long ACTIVE_QUERY_REBUILD_DEBOUNCE_MS = 64L;',
                'private static final long ACTIVE_QUERY_REBUILD_DEBOUNCE_MS = 120L;')
          patch(s,
                '''    private final Map<Long, Integer> accentCache =\n            new LinkedHashMap<Long, Integer>(MAX_ACCENT_CACHE_SIZE, 0.75f, true) {''',
                '''    private final Map<String, String> activeQueryCardSignatures = new HashMap<>();\n    private final Map<Long, Integer> accentCache =\n            new LinkedHashMap<Long, Integer>(MAX_ACCENT_CACHE_SIZE, 0.75f, true) {''')
          patch(s,
                '''    private final Runnable activeQueryRebuildRunnable = () -> {\n        if (isEnabled() && isActiveQuery()) rebuild();\n    };''',
                '''    private final Runnable activeQueryRebuildRunnable = () -> {\n        if (isEnabled() && isActiveQuery()) rebuild(true);\n    };''')
          patch(s,
                '''        userScrollStartedCallback = null;\n        accentCache.clear();''',
                '''        userScrollStartedCallback = null;\n        activeQueryCardSignatures.clear();\n        accentCache.clear();''')

          old_rebuild = '''    private void rebuild() {\n        if (column == null || mainActivity.adapter == null) return;\n        cancelPendingActiveQueryRebuild();\n        cancelDeferredRefreshIdleProbe();\n        deferredRefreshIdlePolicy.clear();\n        pendingDataSetRefresh = false;\n        boolean activeQuery = isActiveQuery();\n        if (!activeQuery) forceNextHistoryRebuild = false;\n        boolean animateHistoryItems = !activeQuery && !suppressNextHistoryAnimation;\n        suppressNextHistoryAnimation = false;\n        renderedActiveQuery = activeQuery;\n        boolean preserveSearchFocus = activeQuery\n                && mainActivity.searchEditText != null\n                && mainActivity.searchEditText.hasFocus();\n        applySearchFocusIsolation(activeQuery);\n        Map<String, NotificationHistoryRecord> latestNotifications =\n                !activeQuery && prefs.getBoolean("enable-notification-history", false)\n                        ? SmartStateStore.queryLatestNotificationsByPackage(mainActivity)\n                        : Collections.emptyMap();\n        column.removeAllViews();\n\n        int count = mainActivity.adapter.getCount();\n        for (int position = 0; position < count; position++) {\n            Result<?> result = mainActivity.adapter.getItem(position);\n            View source = mainActivity.adapter.getView(position, null, column);\n            View item = createCardItem(source, result, position, latestNotifications);\n            column.addView(item);\n        }\n\n        if (preserveSearchFocus && !mainActivity.searchEditText.hasFocus()) {\n            // Restore only a focus state that existed before this rebuild. This is not an\n            // unconditional IME reopen: it simply prevents card-tree replacement from ending\n            // an active typing session.\n            mainActivity.showKeyboard();\n        }\n\n        if (animateHistoryItems) {\n            scroller.post(() -> {\n                int childCount = column.getChildCount();\n                int first = Math.max(0, childCount - 16);\n                int visualIndex = 0;\n                for (int i = first; i < childCount; i++) {\n                    View child = column.getChildAt(i);\n                    animateIn(child, visualIndex++);\n                }\n            });\n        }\n    }\n'''
          new_rebuild = '''    private void rebuild() {\n        rebuild(false);\n    }\n\n    private void rebuild(boolean allowActiveQueryReuse) {\n        if (column == null || mainActivity.adapter == null) return;\n        cancelPendingActiveQueryRebuild();\n        cancelDeferredRefreshIdleProbe();\n        deferredRefreshIdlePolicy.clear();\n        pendingDataSetRefresh = false;\n        boolean activeQuery = isActiveQuery();\n        boolean previouslyRenderedActiveQuery = renderedActiveQuery;\n        if (!activeQuery) forceNextHistoryRebuild = false;\n        boolean animateHistoryItems = !activeQuery && !suppressNextHistoryAnimation;\n        suppressNextHistoryAnimation = false;\n        renderedActiveQuery = activeQuery;\n        boolean preserveSearchFocus = activeQuery\n                && mainActivity.searchEditText != null\n                && mainActivity.searchEditText.hasFocus();\n        applySearchFocusIsolation(activeQuery);\n\n        if (activeQuery && allowActiveQueryReuse && previouslyRenderedActiveQuery) {\n            reconcileActiveQueryCards();\n        } else {\n            Map<String, NotificationHistoryRecord> latestNotifications =\n                    !activeQuery && prefs.getBoolean("enable-notification-history", false)\n                            ? SmartStateStore.queryLatestNotificationsByPackage(mainActivity)\n                            : Collections.emptyMap();\n            activeQueryCardSignatures.clear();\n            column.removeAllViews();\n\n            int count = mainActivity.adapter.getCount();\n            for (int position = 0; position < count; position++) {\n                Result<?> result = mainActivity.adapter.getItem(position);\n                View source = mainActivity.adapter.getView(position, null, column);\n                View item = createCardItem(source, result, position, latestNotifications);\n                column.addView(item);\n                if (activeQuery) {\n                    activeQueryCardSignatures.put(\n                            result.getPojoId(), activeQueryCardSignature(result));\n                }\n            }\n        }\n\n        if (preserveSearchFocus && !mainActivity.searchEditText.hasFocus()) {\n            // Restore only a focus state that existed before this rebuild. This is not an\n            // unconditional IME reopen: it simply prevents card-tree replacement from ending\n            // an active typing session.\n            mainActivity.showKeyboard();\n        }\n\n        if (animateHistoryItems) {\n            scroller.post(() -> {\n                int childCount = column.getChildCount();\n                int first = Math.max(0, childCount - 16);\n                int visualIndex = 0;\n                for (int i = first; i < childCount; i++) {\n                    View child = column.getChildAt(i);\n                    animateIn(child, visualIndex++);\n                }\n            });\n        }\n    }\n\n    /**\n     * Active search used to destroy and recreate the complete Vertical Cards hierarchy after every\n     * debounce. Reconcile by stable POJO identity instead: unchanged cards keep their Views, click\n     * listeners and drawables; only inserted/changed results are materialized from the adapter.\n     */\n    private void reconcileActiveQueryCards() {\n        if (column == null || mainActivity.adapter == null) return;\n\n        Map<String, View> existingById = new HashMap<>();\n        for (int i = 0; i < column.getChildCount(); i++) {\n            View child = column.getChildAt(i);\n            Object tag = child.getTag();\n            if (tag instanceof String && !existingById.containsKey((String) tag)) {\n                existingById.put((String) tag, child);\n            }\n        }\n\n        Map<String, String> nextSignatures = new HashMap<>();\n        int targetCount = mainActivity.adapter.getCount();\n        column.suppressLayout(true);\n        try {\n            for (int position = 0; position < targetCount; position++) {\n                Result<?> result = mainActivity.adapter.getItem(position);\n                String id = result.getPojoId();\n                String signature = activeQueryCardSignature(result);\n                nextSignatures.put(id, signature);\n\n                View desired = existingById.remove(id);\n                if (desired == null\n                        || !TextUtils.equals(activeQueryCardSignatures.get(id), signature)) {\n                    View source = mainActivity.adapter.getView(position, null, column);\n                    desired = createCardItem(\n                            source, result, position, Collections.emptyMap());\n                }\n                placeActiveQueryChild(desired, position);\n            }\n\n            while (column.getChildCount() > targetCount) {\n                column.removeViewAt(column.getChildCount() - 1);\n            }\n        } finally {\n            column.suppressLayout(false);\n        }\n        activeQueryCardSignatures.clear();\n        activeQueryCardSignatures.putAll(nextSignatures);\n        column.requestLayout();\n        column.invalidate();\n    }\n\n    private void placeActiveQueryChild(View child, int targetPosition) {\n        if (child.getParent() == column) {\n            int currentPosition = column.indexOfChild(child);\n            if (currentPosition == targetPosition) return;\n            if (currentPosition >= 0) column.removeViewAt(currentPosition);\n        } else if (child.getParent() instanceof ViewGroup) {\n            ((ViewGroup) child.getParent()).removeView(child);\n        }\n        column.addView(child, Math.min(targetPosition, column.getChildCount()));\n    }\n\n    private String activeQueryCardSignature(Result<?> result) {\n        return result.getClass().getName() + "|" + result.getPojoId() + "|" + result.toString();\n    }\n'''
          patch(s, old_rebuild, new_rebuild)

          patch(s,
                '''        cardTitle.setGravity(Gravity.START | Gravity.CENTER_VERTICAL);\n        cardTitle.setShadowLayer(dp(2), 0f, dp(1), Color.argb(180, 0, 0, 0));\n        center.addView(cardTitle,''',
                '''        cardTitle.setGravity(Gravity.START | Gravity.CENTER_VERTICAL);\n        cardTitle.setShadowLayer(dp(2), 0f, dp(1), Color.argb(180, 0, 0, 0));\n        NotificationBellStyle.apply(cardTitle, isNotificationResult(result));\n        center.addView(cardTitle,''')
          marker = '''    private CharSequence callSummary(CommunicationPojo call) {'''
          insert = '''    private boolean isNotificationResult(Result<?> result) {\n        Object pojo = result == null ? null : result.getPojo();\n        return pojo instanceof NotificationPojo || pojo instanceof NotificationHistorySearchPojo;\n    }\n\n'''
          patch(s, marker, insert + marker)

          s = 'app/src/main/java/fr/neamar/kiss/result/SettingsResult.java'
          patch(s,
                '''import fr.neamar.kiss.ui.CompactNotificationFrame;\nimport fr.neamar.kiss.ui.SmartAnimationEngine;''',
                '''import fr.neamar.kiss.ui.CompactNotificationFrame;\nimport fr.neamar.kiss.ui.NotificationBellStyle;\nimport fr.neamar.kiss.ui.SmartAnimationEngine;''')
          patch(s,
                '''        TextView settingName = view.findViewById(R.id.item_setting_name);\n        displayHighlighted(pojo.normalizedName, pojo.getName(), fuzzyScore, settingName, context);''',
                '''        TextView settingName = view.findViewById(R.id.item_setting_name);\n        displayHighlighted(pojo.normalizedName, pojo.getName(), fuzzyScore, settingName, context);\n        // Explicitly clear on ordinary recycled setting rows so a previous notification marker\n        // can never leak to another result. Persisted notification-search rows keep the bell.\n        NotificationBellStyle.apply(settingName, pojo instanceof NotificationHistorySearchPojo);''')
          patch(s,
                '''        appName.setText(notification.appName);\n        title.setText(notification.getSummary());''',
                '''        appName.setText(notification.appName);\n        NotificationBellStyle.apply(appName, true);\n        title.setText(notification.getSummary());''')

          Path('app/src/main/java/fr/neamar/kiss/ui/NotificationBellStyle.java').write_text('''package fr.neamar.kiss.ui;\n\nimport android.graphics.drawable.Drawable;\nimport android.widget.TextView;\n\nimport androidx.annotation.NonNull;\nimport androidx.core.content.ContextCompat;\nimport androidx.core.graphics.drawable.DrawableCompat;\n\nimport fr.neamar.kiss.R;\n\n/** Lightweight notification identity marker shared by every launcher result renderer. */\npublic final class NotificationBellStyle {\n    private NotificationBellStyle() {}\n\n    public static void apply(@NonNull TextView textView, boolean visible) {\n        if (!visible) {\n            textView.setCompoundDrawablesRelative(null, null, null, null);\n            textView.setCompoundDrawablePadding(0);\n            return;\n        }\n        Drawable source = ContextCompat.getDrawable(textView.getContext(), R.drawable.ic_notification_bell);\n        if (source == null) return;\n        Drawable bell = DrawableCompat.wrap(source.mutate());\n        DrawableCompat.setTint(bell, textView.getCurrentTextColor());\n        float density = textView.getResources().getDisplayMetrics().density;\n        int size = Math.max(1, Math.round(17f * density));\n        bell.setBounds(0, 0, size, size);\n        textView.setCompoundDrawablePadding(Math.round(5f * density));\n        textView.setCompoundDrawablesRelative(null, null, bell, null);\n    }\n}\n''')

          Path('app/src/main/res/drawable/ic_notification_bell.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="24dp"\n    android:height="24dp"\n    android:viewportWidth="24"\n    android:viewportHeight="24">\n    <path\n        android:fillColor="#FFFFFFFF"\n        android:pathData="M12,22a2.5,2.5 0,0 0,2.45 -2h-4.9A2.5,2.5 0,0 0,12 22zM19,17h-1v-6a6,6 0,0 0,-5 -5.91V4a1,1 0,0 0,-2 0v1.09A6,6 0,0 0,6 11v6H5a1,1 0,0 0,0 2h14a1,1 0,0 0,0 -2zM8,17v-6a4,4 0,0 1,8 0v6z" />\n</vector>\n''')
          PY
      - name: Verify exact 3.30.66 source scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --short | sed -E 's/^.. //' | grep '^app/' | sort)
          printf '%s\n' "${files[@]}"
          allowed='^(app/build.gradle|app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java|app/src/main/java/fr/neamar/kiss/result/SettingsResult.java|app/src/main/java/fr/neamar/kiss/ui/NotificationBellStyle.java|app/src/main/res/drawable/ic_notification_bell.xml)$'
          for f in "${files[@]}"; do [[ "$f" =~ $allowed ]] || { echo "Unexpected app file: $f"; exit 1; }; done
          test ${#files[@]} -eq 5
          grep -Fq 'versionCode 494' app/build.gradle
          grep -Fq 'versionName "3.30.66"' app/build.gradle
          grep -Fq 'ACTIVE_QUERY_REBUILD_DEBOUNCE_MS = 120L' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'reconcileActiveQueryCards()' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'column.suppressLayout(true)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'activeQueryCardSignatures.get(id)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'NotificationBellStyle.apply(cardTitle, isNotificationResult(result))' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'pojo instanceof NotificationHistorySearchPojo' app/src/main/java/fr/neamar/kiss/result/SettingsResult.java
          grep -Fq 'NotificationBellStyle.apply(appName, true)' app/src/main/java/fr/neamar/kiss/result/SettingsResult.java
      - name: Focused regression tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests 'fr.neamar.kiss.SearchLaunchReturnStateTest'
          --tests 'fr.neamar.kiss.LauncherHomeLifecycleStateTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardViewportPolicyTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardUserScrollGesturePolicyTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardRefreshIdlePolicyTest'
          --stacktrace
      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Remove guard and verify final source-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-33066-vertical-card-search-bells.yml
          mapfile -t final_files < <({ git diff --name-only fb5b2fe7731e99551de5682e824cd6fda5bfb146 -- app; git ls-files --others --exclude-standard app; } | sort -u)
          printf '%s\n' "${final_files[@]}"
          test ${#final_files[@]} -eq 5
          grep -Fq 'versionName "3.30.66"' app/build.gradle
      - name: Commit verified 3.30.66 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reuse Vertical Cards search views and mark notifications in 3.30.66'
          git push origin HEAD:fix/3.30.66-vertical-card-search-bells
