name: Repair double keyboard
on:
  push:
    paths:
      - '.github/workflows/fix-double-keyboard.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore and patch
        run: |
          python3 <<'PY'
          import subprocess
          from pathlib import Path
          subprocess.run(['git','checkout','3cc63fab09d558ece607db7eda03328d4f0395d6','--','app/src/main/java/fr/neamar/kiss/MainActivity.java'], check=True)
          p=Path('app/src/main/java/fr/neamar/kiss/MainActivity.java'); s=p.read_text()
          old='''        super.onResume();
        homeLifecycleState.onResumeCompleted();
    }
'''
          new='''        super.onResume();
        // Built-in mode owns the input surface. Android may restore a previously visible
        // system IME when HOME returns here, so suppress that IME explicitly.
        if (searchEditText.isBuiltInKeyboardEnabled()) {
            suppressSystemImeForBuiltInKeyboard();
        }
        homeLifecycleState.onResumeCompleted();
    }
'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''            if (searchEditText.isBuiltInKeyboardEnabled()) {
                searchEditText.showBuiltInKeyboard();
            } else {
'''
          new='''            if (searchEditText.isBuiltInKeyboardEnabled()) {
                suppressSystemImeForBuiltInKeyboard();
                searchEditText.showBuiltInKeyboard();
            } else {
'''
          assert s.count(old)==1
          s=s.replace(old,new)
          anchor='''    @Override
    public void hideKeyboard() {
'''
          helper='''    private void suppressSystemImeForBuiltInKeyboard() {
        if (searchEditText == null || !searchEditText.isBuiltInKeyboardEnabled()) return;
        WindowCompat.getInsetsController(getWindow(), searchEditText)
                .hide(WindowInsetsCompat.Type.ime());
        InputMethodManager inputManager = ContextCompat.getSystemService(this, InputMethodManager.class);
        if (inputManager != null && searchEditText.getWindowToken() != null) {
            inputManager.hideSoftInputFromWindow(searchEditText.getWindowToken(), 0);
        }
    }

'''
          assert s.count(anchor)==1
          s=s.replace(anchor,helper+anchor); p.write_text(s)
          g=Path('app/build.gradle'); gs=g.read_text()
          assert gs.count('versionCode 461')==1 and gs.count('versionName "3.30.33"')==1
          gs=gs.replace('// Smart S Launcher 3.30.33 - launcher-owned QWERTY keyboard','// Smart S Launcher 3.30.34 - prevent system IME beside built-in keyboard')
          gs=gs.replace('versionCode 461','versionCode 462').replace('versionName "3.30.33"','versionName "3.30.34"')
          g.write_text(gs)
          PY
      - name: Verify and commit
        run: |
          git diff --check
          test "$(git diff --numstat 3cc63fab09d558ece607db7eda03328d4f0395d6 -- app/src/main/java/fr/neamar/kiss/MainActivity.java | awk '{print $2}')" -eq 0
          grep -q 'versionName "3.30.34"' app/build.gradle
          grep -q 'suppressSystemImeForBuiltInKeyboard' app/src/main/java/fr/neamar/kiss/MainActivity.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/fr/neamar/kiss/MainActivity.java app/build.gradle
          git commit -m 'Fix system IME appearing with built-in keyboard'
          git push
