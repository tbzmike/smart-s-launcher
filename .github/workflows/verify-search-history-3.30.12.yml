name: Verify search history 3.30.12

on:
  push:
    branches:
      - build/3.30.12

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message != 'Optimize history-first search and honor search switches'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.12
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Audit 3.30.11 baseline
        run: |
          set -euxo pipefail
          grep -q 'versionCode 439' app/build.gradle
          grep -q 'versionName "3.30.11"' app/build.gradle
          grep -q 'List<String> semanticHints = SemanticHints.expand(query);' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q 'app:key="use-fuzzy-score-v1"' app/src/main/res/xml/preferences.xml
          ! grep -q 'app:key="enable-fuzzy-search"' app/src/main/res/xml/preferences.xml
          grep -q 'new QuerySearcher(activity, query, isRefresh)' app/src/main/java/fr/neamar/kiss/searcher/SearchHandler.java

      - name: Apply guarded search patch
        run: python3 .github/search_history_33012.py

      - name: Verify intended search wiring
        run: |
          set -euxo pipefail
          grep -q 'versionCode 440' app/build.gradle
          grep -q 'versionName "3.30.12"' app/build.gradle
          grep -q 'PREF_ENABLE_FUZZY_SEARCH = "enable-fuzzy-search"' app/src/main/java/fr/neamar/kiss/utils/fuzzy/FuzzyFactory.java
          grep -q 'return new LiteralScore(pattern, detailedMatchIndices);' app/src/main/java/fr/neamar/kiss/utils/fuzzy/FuzzyFactory.java
          grep -q 'FuzzyFactory.isFuzzyEnabled(context)' app/src/main/java/fr/neamar/kiss/utils/fuzzy/SmartMatcher.java
          grep -q '!match && FuzzyFactory.isFuzzyEnabled(context)' app/src/main/java/fr/neamar/kiss/dataprovider/simpleprovider/SettingsProvider.java
          grep -q 'prefs.getBoolean("semantic-search-enabled", false)' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q ': Collections.emptyList();' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q 'app:key="enable-fuzzy-search"' app/src/main/res/xml/preferences.xml
          grep -q 'app:dependency="enable-fuzzy-search"' app/src/main/res/xml/preferences.xml
          grep -q 'snapshotPojos()' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -q 'historyQuerySeed = activity.adapter.snapshotPojos();' app/src/main/java/fr/neamar/kiss/searcher/SearchHandler.java
          grep -q 'prepareHistoryPreview(activity);' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'publishPreviewResults(historyMatches)' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'mergeMissingHistoryMatches();' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'normalizedQuery.length() >= 2' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'query.trim().length() >= 2' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          git diff --check

      - name: Verify previous jobs remain untouched
        run: |
          set -euxo pipefail
          # Deep-link exact launch wiring from 3.30.10.
          git diff --quiet origin/build/3.30.11 -- \
            app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java \
            app/src/main/java/fr/neamar/kiss/result/ContactsResult.java \
            app/src/main/java/fr/neamar/kiss/result/SettingsResult.java \
            app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java \
            app/src/main/java/fr/neamar/kiss/ui/NotificationPopupDialog.java
          # Frozen-app work from 3.30.08.
          git diff --quiet origin/build/3.30.11 -- \
            app/src/main/java/fr/neamar/kiss/loader/LoadAppPojos.java \
            app/src/main/java/fr/neamar/kiss/result/AppResult.java \
            app/src/main/java/fr/neamar/kiss/DataHandler.java
          # Caller-name repair from 3.30.11.
          git diff --quiet origin/build/3.30.11 -- \
            app/src/main/java/fr/neamar/kiss/utils/CallerNameResolver.java \
            app/src/main/java/fr/neamar/kiss/utils/Permission.java \
            app/src/main/java/fr/neamar/kiss/dataprovider/simpleprovider/PhoneProvider.java \
            app/src/main/java/fr/neamar/kiss/result/PhoneResult.java \
            app/src/main/java/fr/neamar/kiss/broadcast/IncomingCallHandler.java \
            app/src/main/java/fr/neamar/kiss/broadcast/IncomingCallScreeningService.java
          # KISS gesture settings and execution wiring are verified and intentionally unchanged.
          git diff --quiet origin/build/3.30.11 -- \
            app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java \
            app/src/main/res/values/arrays.xml
          grep -q 'doAction("gesture-right"' app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java
          grep -q 'doAction("gesture-left"' app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java
          grep -q 'doAction("gesture-down"' app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java
          grep -q 'doAction("gesture-up"' app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java
          grep -q 'doAction("gesture-long-press"' app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java
          grep -q 'prefs.getString(source + "-launch-id"' app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java

      - name: Verify change scope
        run: |
          set -euxo pipefail
          git diff --name-only origin/build/3.30.11...HEAD > /tmp/committed.txt
          git diff --name-only >> /tmp/working.txt
          cat /tmp/committed.txt /tmp/working.txt | sort -u > /tmp/all.txt
          cat /tmp/all.txt
          while IFS= read -r f; do
            case "$f" in
              .github/search_history_33012.py|.github/workflows/verify-search-history-3.30.12.yml|app/build.gradle|app/src/main/res/xml/preferences.xml|app/src/main/java/fr/neamar/kiss/utils/fuzzy/FuzzyFactory.java|app/src/main/java/fr/neamar/kiss/utils/fuzzy/LiteralScore.java|app/src/main/java/fr/neamar/kiss/utils/fuzzy/SmartMatcher.java|app/src/main/java/fr/neamar/kiss/dataprovider/simpleprovider/SettingsProvider.java|app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java|app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java|app/src/main/java/fr/neamar/kiss/searcher/Searcher.java|app/src/main/java/fr/neamar/kiss/searcher/SearchHandler.java|app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java) ;;
              *) echo "Unexpected changed file: $f"; exit 1 ;;
            esac
          done < /tmp/all.txt

      - name: Full Android verification
        run: |
          chmod +x gradlew
          ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify APK version
        run: |
          set -euxo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='440'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.12'" /tmp/apk-badging.txt

      - name: Commit verified production source
        run: |
          set -euxo pipefail
          git config user.name tbzmike
          git config user.email 40115947+tbzmike@users.noreply.github.com
          git add app/build.gradle \
            app/src/main/res/xml/preferences.xml \
            app/src/main/java/fr/neamar/kiss/utils/fuzzy/FuzzyFactory.java \
            app/src/main/java/fr/neamar/kiss/utils/fuzzy/LiteralScore.java \
            app/src/main/java/fr/neamar/kiss/utils/fuzzy/SmartMatcher.java \
            app/src/main/java/fr/neamar/kiss/dataprovider/simpleprovider/SettingsProvider.java \
            app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java \
            app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java \
            app/src/main/java/fr/neamar/kiss/searcher/Searcher.java \
            app/src/main/java/fr/neamar/kiss/searcher/SearchHandler.java \
            app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          git commit -m 'Optimize history-first search and honor search switches'
          git push origin HEAD:build/3.30.12
