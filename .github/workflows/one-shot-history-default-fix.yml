name: One-shot history default-screen recency fix

on:
  push:
    branches:
      - build/3.30.05
    paths:
      - .github/workflows/one-shot-history-default-fix.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.05
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Patch default History recency and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adapter = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java')
          source = adapter.read_text()
          old = '''        if (SearchHandler.getInstance().getLastSearchType() != Searcher.Type.HISTORY
                  || selected == null || results.size() < 2) return;'''
          new = '''        Searcher.Type visibleType = SearchHandler.getInstance().getLastSearchType();
          if ((visibleType != Searcher.Type.HISTORY && visibleType != Searcher.Type.NULL)
                  || selected == null || results.size() < 2) return;'''
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one History-only promotion guard')
          source = source.replace(old, new, 1)
          adapter.write_text(source)

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          checks = {
              '// Smart S Launcher 3.30.04': '// Smart S Launcher 3.30.05',
              'versionCode 432': 'versionCode 433',
              'versionName "3.30.04"': 'versionName "3.30.05"',
          }
          for oldv, newv in checks.items():
              if g.count(oldv) != 1:
                  raise SystemExit(f'Expected exactly one {oldv}')
              g = g.replace(oldv, newv, 1)
          gradle.write_text(g)

          workflow = Path('.github/workflows/build.yml')
          w = workflow.read_text()
          replacements = [
              ('versionCode 432', 'versionCode 433'),
              ('versionName "3.30.04"', 'versionName "3.30.05"'),
              ("versionCode='432'", "versionCode='433'"),
              ("versionName='3.30.04'", "versionName='3.30.05'"),
              ('smart-s-launcher-3.30.04-debug.apk', 'smart-s-launcher-3.30.05-debug.apk'),
              ('smart-s-launcher-3.30.04-debug', 'smart-s-launcher-3.30.05-debug'),
          ]
          for oldv, newv in replacements:
              if oldv not in w:
                  raise SystemExit(f'Missing build workflow token: {oldv}')
              w = w.replace(oldv, newv)
          workflow.write_text(w)
          PY

      - name: Verify exact intended source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java').read_text()
          assert a.count('visibleType != Searcher.Type.HISTORY && visibleType != Searcher.Type.NULL') == 1
          assert 'SearchHandler.getInstance().getLastSearchType() != Searcher.Type.HISTORY\n                || selected' not in a
          g = Path('app/build.gradle').read_text()
          assert 'versionCode 433' in g
          assert 'versionName "3.30.05"' in g
          w = Path('.github/workflows/build.yml').read_text()
          assert 'versionCode 433' in w and '3.30.05' in w
          PY
          git diff --check
          git diff -- app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/build.gradle .github/workflows/build.yml

      - name: Run lint unit tests and build APKs
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify built APK version
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='433'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.05'" /tmp/apk-badging.txt

      - name: Commit verified fix and remove verifier
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git rm .github/workflows/one-shot-history-default-fix.yml
          git add app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/build.gradle .github/workflows/build.yml
          git diff --cached --check
          git commit -m 'Fix default History click recency and bump to 3.30.05'
          git push origin HEAD:build/3.30.05
