name: One-shot verified history recency return fix

on:
  push:
    branches:
      - build/3.30.05
    paths:
      - .github/workflows/one-shot-history-default-fix.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.05
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Patch authoritative history refresh and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          policy = Path('app/src/main/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicy.java')
          p = policy.read_text()
          old = '''/**
           * Decides whether a repeated launcher query can safely skip rebuilding its result set. The clicked
           * history Result is promoted in memory when its launch is persisted; genuine external/provider
           * changes arrive through explicit refresh broadcasts instead of every Activity resume.
           */
          final class HistoryRefreshPolicy {
              private HistoryRefreshPolicy() { }

              static boolean shouldSkip(boolean initialResumeComplete, boolean sameQuery, boolean historySearch) {
                  return initialResumeComplete && sameQuery;
              }
          }
          '''
          new = '''/**
           * Decides whether a repeated launcher query can safely skip rebuilding its result set.
           * History is never skipped on Activity resume: the database is authoritative for launch recency,
           * and HistorySearcher must get a chance to put the latest persisted launch at the final row.
           */
          final class HistoryRefreshPolicy {
              private HistoryRefreshPolicy() { }

              static boolean shouldSkip(boolean initialResumeComplete, boolean sameQuery, boolean historySearch) {
                  return initialResumeComplete && sameQuery && !historySearch;
              }
          }
          '''
          if p.count(old) != 1:
              raise SystemExit('Expected exactly one current HistoryRefreshPolicy implementation')
          policy.write_text(p.replace(old, new, 1))

          test = Path('app/src/test/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicyTest.java')
          t = test.read_text()
          old_test = '''    @Test
              void unchangedHistoryQueryIsKeptWarmAfterResume() {
                  assertThat(HistoryRefreshPolicy.shouldSkip(true, true, true), is(true));
              }
          '''
          new_test = '''    @Test
              void unchangedHistoryQueryIsRefreshedAfterResume() {
                  assertThat(HistoryRefreshPolicy.shouldSkip(true, true, true), is(false));
              }
          '''
          if t.count(old_test) != 1:
              raise SystemExit('Expected exactly one stale history refresh test')
          test.write_text(t.replace(old_test, new_test, 1))

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          replacements = {
              '// Smart S Launcher 3.30.04': '// Smart S Launcher 3.30.05',
              'versionCode 432': 'versionCode 433',
              'versionName "3.30.04"': 'versionName "3.30.05"',
          }
          for oldv, newv in replacements.items():
              if g.count(oldv) != 1:
                  raise SystemExit(f'Expected exactly one app version token: {oldv}')
              g = g.replace(oldv, newv, 1)
          gradle.write_text(g)

          build = Path('.github/workflows/build.yml')
          b = build.read_text()
          replacements = [
              ('versionCode 432', 'versionCode 433'),
              ('versionName "3.30.04"', 'versionName "3.30.05"'),
              ("versionCode='432'", "versionCode='433'"),
              ("versionName='3.30.04'", "versionName='3.30.05'"),
              ('smart-s-launcher-3.30.04-debug.apk', 'smart-s-launcher-3.30.05-debug.apk'),
              ('smart-s-launcher-3.30.04-debug', 'smart-s-launcher-3.30.05-debug'),
          ]
          for oldv, newv in replacements:
              if oldv not in b:
                  raise SystemExit(f'Missing build workflow token: {oldv}')
              b = b.replace(oldv, newv)
          build.write_text(b)
          PY

      - name: Verify exact intended source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicy.java').read_text()
          assert 'return initialResumeComplete && sameQuery && !historySearch;' in p
          assert 'return initialResumeComplete && sameQuery;' not in p
          t = Path('app/src/test/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicyTest.java').read_text()
          assert 'unchangedHistoryQueryIsRefreshedAfterResume' in t
          assert 'shouldSkip(true, true, true), is(false)' in t
          g = Path('app/build.gradle').read_text()
          assert 'versionCode 433' in g
          assert 'versionName "3.30.05"' in g
          b = Path('.github/workflows/build.yml').read_text()
          assert 'versionCode 433' in b
          assert 'versionName "3.30.05"' in b
          assert 'smart-s-launcher-3.30.05-debug.apk' in b
          PY
          git diff --check
          git diff -- app/src/main/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicy.java \
            app/src/test/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicyTest.java \
            app/build.gradle .github/workflows/build.yml

      - name: Verify database recency semantics
        run: |
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          db.execute('CREATE TABLE history (_id INTEGER PRIMARY KEY AUTOINCREMENT, query TEXT, record TEXT, timeStamp INTEGER)')
          for record in ('A', 'B', 'C', 'D'):
              db.execute('INSERT INTO history(query, record, timeStamp) VALUES(?,?,?)', ('', record, 1))
          db.execute('INSERT INTO history(query, record, timeStamp) VALUES(?,?,?)', ('', 'B', 2))
          rows = [r[0] for r in db.execute('SELECT DISTINCT record, 1 FROM history ORDER BY _id DESC LIMIT 50')]
          assert rows == ['B', 'D', 'C', 'A'], rows
          PY

      - name: Run targeted history refresh regression test
        run: ./gradlew testDebugUnitTest --tests fr.neamar.kiss.forwarder.HistoryRefreshPolicyTest --stacktrace

      - name: Run lint full unit tests and build both APK variants
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify built APK version
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='433'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.05'" /tmp/apk-badging.txt

      - name: Commit verified fix and remove verifier
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git rm .github/workflows/one-shot-history-default-fix.yml
          git add app/src/main/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicy.java \
            app/src/test/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicyTest.java \
            app/build.gradle .github/workflows/build.yml
          git diff --cached --check
          git commit -m 'Refresh history after launches and bump to 3.30.05'
          git push origin HEAD:build/3.30.05
