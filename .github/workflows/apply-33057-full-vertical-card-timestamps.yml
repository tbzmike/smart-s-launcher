name: Apply verified 3.30.57 Vertical Cards timestamps

on:
  push:
    branches:
      - fix/3.30.57-full-vertical-card-timestamps
    paths:
      - .github/workflows/apply-33057-full-vertical-card-timestamps.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.57-full-vertical-card-timestamps
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply guarded source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_33057_full_vertical_card_timestamps.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarderTest.java')
          text = path.read_text(encoding='utf-8')
          old_assert = 'import static org.junit.Assert.assertEquals;'
          old_test = 'import org.junit.Test;'
          if text.count(old_assert) != 1 or text.count(old_test) != 1:
              raise SystemExit('Generated test did not match the verified JUnit 4 template')
          text = text.replace(old_assert, 'import static org.junit.jupiter.api.Assertions.assertEquals;', 1)
          text = text.replace(old_test, 'import org.junit.jupiter.api.Test;', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact application change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed
          cat > /tmp/expected <<'EOF'
          app/build.gradle
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          app/src/main/java/fr/neamar/kiss/result/Result.java
          app/src/main/java/fr/neamar/kiss/ui/TileLaunchCounter.java
          app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarderTest.java
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/changed
          grep -q 'versionCode 485' app/build.gradle
          grep -q 'versionName "3.30.57"' app/build.gradle
          grep -q 'DateUtils.getRelativeTimeSpanString' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          grep -q 'TileLaunchCounter.getTotal' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          grep -q 'TileLaunchCounter.record' app/src/main/java/fr/neamar/kiss/result/Result.java
          grep -q 'org.junit.jupiter.api.Test' app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarderTest.java
          grep -q 'org.junit.jupiter.api.Assertions.assertEquals' app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarderTest.java

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify APK version metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            LINE="$("$AAPT" dump badging "$APK" | head -n1)"
            echo "$APK -> $LINE"
            printf '%s\n' "$LINE" | grep -q "versionCode='485'"
            printf '%s\n' "$LINE" | grep -q "versionName='3.30.57'"
          done

      - name: Remove one-time repair helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_33057_full_vertical_card_timestamps.py
          rm .github/workflows/apply-33057-full-vertical-card-timestamps.yml
          git diff --check

      - name: Verify final committed scope
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/final-changed
          cat > /tmp/final-expected <<'EOF'
          .github/scripts/apply_33057_full_vertical_card_timestamps.py
          .github/workflows/apply-33057-full-vertical-card-timestamps.yml
          app/build.gradle
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          app/src/main/java/fr/neamar/kiss/result/Result.java
          app/src/main/java/fr/neamar/kiss/ui/TileLaunchCounter.java
          app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarderTest.java
          EOF
          sort -o /tmp/final-expected /tmp/final-expected
          diff -u /tmp/final-expected /tmp/final-changed

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix complete Vertical Cards timestamps in 3.30.57'
          git push origin HEAD:fix/3.30.57-full-vertical-card-timestamps
