name: One-time interaction marquee fix

on:
  push:
    branches:
      - fix/3.30.41-interaction-marquee

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add guarded interaction marquee patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.41-interaction-marquee
          fetch-depth: 0
      - name: Apply exact guarded changes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java',
              '''        TextView timestamp = new TextView(context);\n        timestamp.setTag(VIEW_TAG);\n        timestamp.setSingleLine(true);\n        timestamp.setEllipsize(TextUtils.TruncateAt.END);\n        timestamp.setTextDirection(View.TEXT_DIRECTION_LOCALE);\n''',
              '''        TextView timestamp = new AutoMarqueeTextView(context);\n        timestamp.setTag(VIEW_TAG);\n        timestamp.setTextDirection(View.TEXT_DIRECTION_LOCALE);\n''')

          replace_exact(
              'app/build.gradle',
              '''        // Smart S Launcher 3.30.40 - UI-lock-aware long-press routing\n        versionCode 468\n        versionName "3.30.40"\n''',
              '''        // Smart S Launcher 3.30.41 - marquee universal history interaction metadata\n        versionCode 469\n        versionName "3.30.41"\n''')
      - name: Verify focused diff and commit
        run: |
          git diff --check
          git diff -- app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java app/build.gradle
          git add app/src/main/java/fr/neamar/kiss/ui/UniversalHistoryTimestamp.java app/build.gradle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Marquee universal history interaction metadata in 3.30.41"
          git push origin HEAD:fix/3.30.41-interaction-marquee
