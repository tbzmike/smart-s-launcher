name: Smart S 3.30.81 SQLite Corruption Recovery

on:
  push:
    branches:
      - fix/3.30.81-sqlite-corruption-recovery
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-s-33081-sqlite-recovery
  cancel-in-progress: true

jobs:
  recover-build-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify exact 3.30.80 baseline
        run: |
          set -euxo pipefail
          grep -q 'versionCode 508' app/build.gradle
          grep -q 'versionName "3.30.80"' app/build.gradle
          grep -q 'Smart S Launcher 3.30.80 - Home crash guard and scroll stability' app/build.gradle
          test ! -e app/src/main/java/fr/neamar/kiss/db/DatabaseRecovery.java
          python3 - <<'PY'
          from pathlib import Path
          hits=[]
          for p in Path('app/src/main/java').rglob('*.java'):
              hits += [str(p)] * p.read_text().count('new DB(')
          expected=sorted([
              'app/src/main/java/fr/neamar/kiss/db/DBHelper.java',
              'app/src/main/java/fr/neamar/kiss/db/SmartStateStore.java',
              'app/src/main/java/fr/neamar/kiss/db/NotificationTimelineStore.java',
              'app/src/main/java/fr/neamar/kiss/db/LaunchHistoryStatsStore.java',
              'app/src/main/java/fr/neamar/kiss/db/LaunchStatsProvider.java',
              'app/src/main/java/fr/neamar/kiss/db/HistoryItemUsageTodayStore.java',
          ])
          assert sorted(hits) == expected, (hits, expected)
          PY

      - name: Apply controlled corruption recovery
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply_33081_sqlite_corruption_recovery_v2.py

      - name: Verify recovery invariants and preservation
        run: |
          set -euxo pipefail
          REC=app/src/main/java/fr/neamar/kiss/db/DatabaseRecovery.java
          DBH=app/src/main/java/fr/neamar/kiss/db/DBHelper.java
          SMART=app/src/main/java/fr/neamar/kiss/db/SmartStateStore.java
          TIMELINE=app/src/main/java/fr/neamar/kiss/db/NotificationTimelineStore.java
          grep -q 'versionCode 509' app/build.gradle
          grep -q 'versionName "3.30.81"' app/build.gradle
          grep -q 'catch (SQLiteDatabaseCorruptException corruption)' "$REC"
          grep -q 'Exactly one retry' "$REC"
          grep -q 'appContext.deleteDatabase(DB.DB_NAME)' "$REC"
          grep -q 'recoveryGeneration++' "$REC"
          grep -q 'observedGeneration != recoveryGeneration' "$REC"
          grep -q 'SmartStateStore.onDatabaseRecovered()' "$REC"
          grep -q 'return DatabaseRecovery.getDatabase(context);' "$DBH"
          grep -q 'return DatabaseRecovery.getDatabase(context);' "$SMART"
          grep -q 'return DatabaseRecovery.getDatabase(context);' "$TIMELINE"
          grep -q 'DatabaseRecovery.run(context' "$DBH"
          grep -q 'DatabaseRecovery.run(context' "$SMART"
          grep -q 'DatabaseRecovery.run(context' "$TIMELINE"
          grep -q 'DatabaseRecovery.run(context' app/src/main/java/fr/neamar/kiss/db/LaunchHistoryStatsStore.java
          grep -q 'DatabaseRecovery.run(context' app/src/main/java/fr/neamar/kiss/db/LaunchStatsProvider.java
          grep -q 'DatabaseRecovery.run(context' app/src/main/java/fr/neamar/kiss/db/HistoryItemUsageTodayStore.java
          grep -q 'latestNotificationsCache = null;' "$SMART"
          python3 - <<'PY'
          from pathlib import Path
          hits=[]
          for p in Path('app/src/main/java').rglob('*.java'):
              hits += [str(p)] * p.read_text().count('new DB(')
          assert hits == ['app/src/main/java/fr/neamar/kiss/db/DatabaseRecovery.java'], hits
          for name in ['DBHelper.java','SmartStateStore.java','NotificationTimelineStore.java']:
              p=Path('app/src/main/java/fr/neamar/kiss/db')/name
              text=p.read_text()
              assert 'static volatile SQLiteDatabase database' not in text, name
          PY
          grep -q 'matchedIndices == null || matchedIndices.isEmpty()' app/src/main/java/fr/neamar/kiss/utils/fuzzy/MatchInfo.java
          grep -q 'getGlobalVisibleRect' app/src/main/java/fr/neamar/kiss/ui/AutoMarqueeTextView.java
          grep -q 'getGlobalVisibleRect' app/src/main/java/fr/neamar/kiss/ui/AutoScrollPreviewTextView.java
          grep -q 'if (listening)' app/src/main/java/fr/neamar/kiss/ui/WidgetHost.java
          git diff --check

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify APK manifest versions
        run: |
          set -euxo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          "$AAPT" dump badging "$DEBUG_APK" | tee /tmp/debug-badging.txt
          "$AAPT" dump badging "$RELEASE_APK" | tee /tmp/release-badging.txt
          grep -q "versionCode='509'" /tmp/debug-badging.txt
          grep -q "versionName='3.30.81'" /tmp/debug-badging.txt
          grep -q "versionCode='509'" /tmp/release-badging.txt
          grep -q "versionName='3.30.81'" /tmp/release-badging.txt

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-3.30.81-debug.apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verified release APK
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-3.30.81-release-unsigned.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Commit verified source changes
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/db/DB.java \
            app/src/main/java/fr/neamar/kiss/db/DBHelper.java \
            app/src/main/java/fr/neamar/kiss/db/DatabaseRecovery.java \
            app/src/main/java/fr/neamar/kiss/db/SmartStateStore.java \
            app/src/main/java/fr/neamar/kiss/db/NotificationTimelineStore.java \
            app/src/main/java/fr/neamar/kiss/db/LaunchHistoryStatsStore.java \
            app/src/main/java/fr/neamar/kiss/db/LaunchStatsProvider.java \
            app/src/main/java/fr/neamar/kiss/db/HistoryItemUsageTodayStore.java
          git diff --cached --check
          git commit -m 'Recover safely from corrupt Smart S database'
          git push origin HEAD:fix/3.30.81-sqlite-corruption-recovery
