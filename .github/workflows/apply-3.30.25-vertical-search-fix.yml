name: Apply Smart S Launcher 3.30.25 Vertical Search Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.25

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Apply guarded source repair
        run: python3 .github/scripts/apply_33025_vertical_search_fix.py

      - name: Verify exact changed scope and invariants
        shell: bash
        run: |
          git diff --check
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' \
            .github/workflows/build.yml \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java \
            app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java | sort)
          test "$CHANGED" = "$EXPECTED" || { echo 'Unexpected changed files:'; git diff --name-only; exit 1; }
          grep -q 'versionCode 453' app/build.gradle
          grep -q 'versionName "3.30.25"' app/build.gradle
          grep -q 'build/3.30.25' .github/workflows/build.yml
          grep -q 'Vertical Cards own IME geometry' app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java
          grep -q 'boolean activeQuery = isActiveQuery();' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q '!activeQuery && prefs.getBoolean("enable-notification-history", false)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java

      - name: Full clean verification
        run: |
          chmod +x gradlew
          ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Commit verified 3.30.25 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/build.yml \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/forwarder/ExperienceTweaks.java \
            app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          git commit -m 'Fix Vertical Cards search keyboard and rebuild churn in 3.30.25'
          git push origin HEAD:build/3.30.25
