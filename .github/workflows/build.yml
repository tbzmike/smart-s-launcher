name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify source version
      run: |
        grep -q 'versionCode 446' app/build.gradle
        grep -q 'versionName "3.30.18"' app/build.gradle

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Verify built APK version
      run: |
        APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
        AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
        "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
        grep -q "versionCode='446'" /tmp/apk-badging.txt
        grep -q "versionName='3.30.18'" /tmp/apk-badging.txt
        mv "$APK" app/build/outputs/apk/debug/smart-s-launcher-3.30.18-debug.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: smart-s-launcher-3.30.18-debug
        path: app/build/outputs/apk/debug/smart-s-launcher-3.30.18-debug.apk
