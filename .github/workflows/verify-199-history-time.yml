name: Verify 3.30.199 visible History time range on Android 15 and 16

on:
  push:
    branches:
      - feature/3.30.199-visible-history-time-range

jobs:
  android:
    name: History time and retained regressions Android ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify live History time chip, scroll updates and prior fixes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/verify_199_time_range.sh
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: time-range-regressions-api-${{ matrix.api }}
          path: verification-results
          archive: true
          if-no-files-found: ignore
