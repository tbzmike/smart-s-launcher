name: Refine 3.30.69 global 400 percent history width

on:
  push:
    branches:
      - fix/3.30.69-all-history-edge-width
    paths:
      - .github/workflows/refine-33069-global-width-400.yml

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/3.30.69-all-history-edge-width
          fetch-depth: 0

      - name: Verify exact 3.30.69 source base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 3ae7421da1830b71a8b985f0d96da6c889d1270a)" = "3ae7421da1830b71a8b985f0d96da6c889d1270a"
          test "$(git diff --name-only 3ae7421da1830b71a8b985f0d96da6c889d1270a HEAD)" = ".github/workflows/refine-33069-global-width-400.yml"
          grep -F 'versionCode 497' app/build.gradle
          grep -F 'versionName "3.30.69"' app/build.gradle
          test -z "$(git status --porcelain)"

      - name: Apply audited global 48-400 percent width refinement
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '...'(truncated due to size)