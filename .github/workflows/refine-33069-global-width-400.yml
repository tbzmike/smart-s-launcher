name: Refine 3.30.69 global 400 percent history width

on:
  push:
    branches:
      - fix/3.30.69-all-history-edge-width
    paths:
      - .github/workflows/refine-33069-global-width-400.yml
      - .github/scripts/refine_33069_width_400.py

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/3.30.69-all-history-edge-width
          fetch-depth: 0

      - name: Verify exact 3.30.69 source base
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ae7421da1830b71a8b985f0d96da6c889d1270a
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          printf '%s\n' \
            .github/scripts/refine_33069_width_400.py \
            .github/workflows/refine-33069-global-width-400.yml | sort > /tmp/expected-temp
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual-temp
          diff -u /tmp/expected-temp /tmp/actual-temp
          grep -F 'versionCode 497' app/build.gradle
          grep -F 'versionName "3.30.69"' app/build.gradle
          test -z "$(git status --porcelain)"

      - name: Apply audited global 48-400 percent width refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/refine_33069_width_400.py
          git diff --check

      - name: Verify exact intended source edits
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ae7421da1830b71a8b985f0d96da6c889d1270a
          printf '%s\n' \
            .github/scripts/refine_33069_width_400.py \
            .github/workflows/refine-33069-global-width-400.yml \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java \
            app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java \
            app/src/main/java/fr/neamar/kiss/forwarder/HistoryEdgeWidthPolicy.java \
            app/src/main/java/fr/neamar/kiss/forwarder/SquareUEdgeBoundsController.java \
            app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java \
            app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicy.java \
            app/src/test/java/fr/neamar/kiss/forwarder/HistoryEdgeWidthPolicyTest.java \
            app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicyTest.java | sort > /tmp/expected-all
          git diff --name-only "$BASE" | sort > /tmp/actual-all
          diff -u /tmp/expected-all /tmp/actual-all
          grep -F 'private static final int MAX_WIDTH = 400;' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java
          grep -F 'private static final int MAX_PERCENT = 400;' app/src/main/java/fr/neamar/kiss/forwarder/HistoryEdgeWidthPolicy.java
          grep -F 'private static final int MAX_PERCENT = 400;' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicy.java
          grep -F 'return safePrefInt(PREF_HISTORY_WIDTH, 100, 48, 400);' app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java
          grep -F 'applyVerticalHistoryWidth(view, parent, context);' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -F 'Math.min(400, prefs.getInt(PREF_HISTORY_WIDTH, 100))' app/src/main/java/fr/neamar/kiss/forwarder/SquareUEdgeBoundsController.java
          grep -F 'versionCode 497' app/build.gradle
          grep -F 'versionName "3.30.69"' app/build.gradle

      - name: Focused width policy tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests fr.neamar.kiss.forwarder.HistoryEdgeWidthPolicyTest \
            --tests fr.neamar.kiss.forwarder.VerticalCardWidthPolicyTest \
            --stacktrace

      - name: Full clean verification
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Commit verified source without temporary verifier files
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ae7421da1830b71a8b985f0d96da6c889d1270a
          rm .github/scripts/refine_33069_width_400.py
          rm .github/workflows/refine-33069-global-width-400.yml
          git diff --check
          printf '%s\n' \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java \
            app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java \
            app/src/main/java/fr/neamar/kiss/forwarder/HistoryEdgeWidthPolicy.java \
            app/src/main/java/fr/neamar/kiss/forwarder/SquareUEdgeBoundsController.java \
            app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardGroupResizeController.java \
            app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicy.java \
            app/src/test/java/fr/neamar/kiss/forwarder/HistoryEdgeWidthPolicyTest.java \
            app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardWidthPolicyTest.java | sort > /tmp/expected-final
          git diff --name-only "$BASE" | sort > /tmp/actual-final
          diff -u /tmp/expected-final /tmp/actual-final
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extend global history width to 400 percent in 3.30.69'
          git push origin HEAD:fix/3.30.69-all-history-edge-width
