name: Verify Smooth Home 3.30.74

on:
  push:
    branches:
      - fix/3.30.74-smooth-home-performance

permissions:
  contents: write

concurrency:
  group: verify-smooth-home-3.30.74
  cancel-in-progress: false

jobs:
  verify-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact performance branch
        uses: actions/checkout@v6
        with:
          ref: fix/3.30.74-smooth-home-performance
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify exact 3.30.73 source base
        run: |
          set -euo pipefail
          BASE=9ab5c3d41560d6f91011e0ed382633ac995cd963
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git show "$BASE:app/build.gradle" | grep -F 'versionCode 501'
          git show "$BASE:app/build.gradle" | grep -F 'versionName "3.30.73"'
          test -z "$(git status --porcelain)"

      - name: Apply exact smoothness patch
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_smooth_home_33074.py
          git diff --check

      - name: Verify periodic jank paths are removed
        run: |
          set -euo pipefail
          NOTIF=app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardNotificationHistoryForwarder.java
          APPS=app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java

          grep -F 'versionCode 502' app/build.gradle
          grep -F 'versionName "3.30.74"' app/build.gradle

          # Unread notifications retain a static visible border, but there must be no perpetual UI pulse.
          grep -F 'border.setStroke(dp(2), Color.argb(235, 255, 176, 32));' "$NOTIF"
          ! grep -E 'ATTENTION_PULSE_MS|attentionHandler|attentionPulse|startAttentionPulse|postDelayed\(this, *550' "$NOTIF"

          # Frozen-app fallback remains functional but must run at low priority and avoid an all-app UI pass.
          grep -F 'new Thread(r, "smart-s-frozen-state")' "$APPS"
          grep -F 'thread.setPriority(Thread.MIN_PRIORITY);' "$APPS"
          grep -F 'android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_BACKGROUND);' "$APPS"
          grep -F 'final ArrayList<Integer> changedIndices = new ArrayList<>();' "$APPS"
          grep -F 'if (changedIndices.isEmpty()) {' "$APPS"
          grep -F 'for (int index : changedIndices) {' "$APPS"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java').read_text()
          start = p.index('            stateHandler.post(() -> {')
          end = p.index('        });\n    };', start)
          ui = p[start:end]
          assert 'for (int i = 0; i < snapshot.size(); i++)' not in ui
          assert 'for (int index : changedIndices)' in ui
          print('Verified: frozen reconciliation UI callback iterates changed packages only')
          PY

      - name: Full clean verification
        run: |
          set -euo pipefail
          ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify APK manifests are the upgrade
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          APK_ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [ -n "$APK_ANALYZER" ]; then
            for apk in "$DEBUG_APK" "$RELEASE_APK"; do
              NAME="$($APK_ANALYZER manifest version-name "$apk")"
              CODE="$($APK_ANALYZER manifest version-code "$apk")"
              echo "$apk => versionName=$NAME versionCode=$CODE"
              test "$NAME" = "3.30.74"
              test "$CODE" = "502"
            done
          else
            AAPT="$(find "$ANDROID_HOME" -type f -name aapt 2>/dev/null | sort -V | tail -n 1 || true)"
            test -n "$AAPT"
            for apk in "$DEBUG_APK" "$RELEASE_APK"; do
              BADGING="$($AAPT dump badging "$apk" | head -n 1)"
              echo "$BADGING"
              echo "$BADGING" | grep -F "versionCode='502'"
              echo "$BADGING" | grep -F "versionName='3.30.74'"
            done
          fi

      - name: Upload verified Smart S Launcher 3.30.74 APK
        uses: actions/upload-artifact@v7
        with:
          name: Smart-S-Launcher-3.30.74-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: Verify final changed-file surface and commit source only
        run: |
          set -euo pipefail
          BASE=9ab5c3d41560d6f91011e0ed382633ac995cd963

          git rm .github/scripts/apply_smooth_home_33074.py
          git rm .github/workflows/verify-smooth-home-3.30.74.yml

          printf '%s\n' \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java \
            app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardNotificationHistoryForwarder.java | sort > /tmp/expected-final
          {
            git diff --name-only "$BASE"
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-final
          diff -u /tmp/expected-final /tmp/actual-final
          git diff --check

          grep -F 'versionCode 502' app/build.gradle
          grep -F 'versionName "3.30.74"' app/build.gradle
          ! grep -E 'ATTENTION_PULSE_MS|attentionHandler|attentionPulse|startAttentionPulse' \
            app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardNotificationHistoryForwarder.java
          grep -F 'for (int index : changedIndices) {' \
            app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix periodic Home UI jank in 3.30.74'
          git push origin HEAD:fix/3.30.74-smooth-home-performance
