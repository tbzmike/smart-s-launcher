name: F-Droid qualification

on:
  push:
  workflow_dispatch:

jobs:
  fdroid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install F-Droid server tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver
          fdroid --version

      - name: Validate official F-Droid category
        run: |
          curl --fail --location --silent --show-error \
            https://gitlab.com/fdroid/fdroiddata/-/raw/master/config/categories.yml \
            --output /tmp/fdroid-categories.yml
          grep -q '^Launcher:' /tmp/fdroid-categories.yml
          mkdir -p config
          cat > config/categories.yml <<'EOF'
          Launcher:
            name: Launcher
            description: Home screen replacements and desktop environment apps
          EOF

      - name: Lint F-Droid metadata
        run: fdroid lint

      - name: Build with the F-Droid stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build unsigned

          # fdroidserver 2.4.5 currently calculates SOURCE_DATE_EPOCH before
          # creating its package checkout. Seed the expected checkout path so
          # the F-Droid build can proceed; this exists only in the CI workspace.
          git clone --no-checkout https://github.com/tbzmike/smart-s-launcher.git \
            build/com.tbzmike.smartslauncher
          git -C build/com.tbzmike.smartslauncher checkout \
            0ba5b9290d4b093ee04cf1b423652444d99b4486

          fdroid build --verbose 2>&1 | tee /tmp/fdroid-build.log
          if grep -Eq '[1-9][0-9]* build(s)? failed|Build for app .* failed|Could not build app' /tmp/fdroid-build.log; then
            echo 'F-Droid reported a failed build.' >&2
            exit 1
          fi
          APK_COUNT=$(find unsigned -maxdepth 1 -type f -name 'com.tbzmike.smartslauncher_411.apk' | wc -l)
          if [ "$APK_COUNT" -ne 1 ]; then
            echo 'Expected F-Droid unsigned APK was not produced.' >&2
            find unsigned -maxdepth 1 -type f -print || true
            exit 1
          fi
          test -f unsigned/com.tbzmike.smartslauncher_411_src.tar.gz
