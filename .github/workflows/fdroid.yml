name: F-Droid qualification

on:
  push:
  workflow_dispatch:

jobs:
  fdroid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install F-Droid server tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver
          fdroid --version

      - name: Lint F-Droid metadata
        run: fdroid lint

      - name: Build with the F-Droid stack
        run: fdroid build --test
