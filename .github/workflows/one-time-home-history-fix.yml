name: One-time home history fix

on:
  push:
    branches:
      - fix/3.30.39-home-history-restore-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry guarded home-history patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.39-home-history-restore-v2
          fetch-depth: 0
      - name: Apply exact guarded changes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java',
              '''        boolean sameQuery = TextUtils.equals(lastSearchQuery, normalized);\n        if (isVerticalCardsMode()) {\n            verticalCardViewportController.onSearchQueryChanged(\n                    !TextUtils.isEmpty(normalized), !sameQuery);\n        }\n        if (HistoryRefreshPolicy.shouldSkip(initialResumeComplete, sameQuery, isHistorySearch())) {\n            return;\n        }\n''',
              '''        boolean sameQuery = TextUtils.equals(lastSearchQuery, normalized);\n        boolean emptyQuery = TextUtils.isEmpty(normalized);\n        if (isVerticalCardsMode()) {\n            verticalCardViewportController.onSearchQueryChanged(\n                    !emptyQuery, !sameQuery);\n        }\n        if (HistoryRefreshPolicy.shouldSkip(\n                initialResumeComplete, sameQuery, isHistorySearch(), emptyQuery)) {\n            return;\n        }\n''')

          replace_exact(
              'app/src/main/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicy.java',
              '''    static boolean shouldSkip(boolean initialResumeComplete, boolean sameQuery, boolean historySearch) {\n        return initialResumeComplete && sameQuery && !historySearch;\n    }\n''',
              '''    static boolean shouldSkip(boolean initialResumeComplete, boolean sameQuery,\n                              boolean historySearch, boolean emptyQuery) {\n        return initialResumeComplete && sameQuery && !historySearch && !emptyQuery;\n    }\n''')

          replace_exact(
              'app/src/test/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicyTest.java',
              '''        assertThat(HistoryRefreshPolicy.shouldSkip(true, true, true), is(false));\n''',
              '''        assertThat(HistoryRefreshPolicy.shouldSkip(true, true, true, true), is(false));\n''')
          replace_exact(
              'app/src/test/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicyTest.java',
              '''        assertThat(HistoryRefreshPolicy.shouldSkip(true, true, false), is(true));\n''',
              '''        assertThat(HistoryRefreshPolicy.shouldSkip(true, true, false, false), is(true));\n''')
          replace_exact(
              'app/src/test/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicyTest.java',
              '''        assertThat(HistoryRefreshPolicy.shouldSkip(true, false, true), is(false));\n        assertThat(HistoryRefreshPolicy.shouldSkip(true, false, false), is(false));\n''',
              '''        assertThat(HistoryRefreshPolicy.shouldSkip(true, false, true, false), is(false));\n        assertThat(HistoryRefreshPolicy.shouldSkip(true, false, false, false), is(false));\n    }\n\n    @Test\n    void emptyQueryNeverSkipsStateRestoration() {\n        assertThat(HistoryRefreshPolicy.shouldSkip(true, true, false, true), is(false));\n''')

          replace_exact(
              'app/build.gradle',
              '''        // Smart S Launcher 3.30.38 - instant history-first search path\n        versionCode 466\n        versionName "3.30.38"\n''',
              '''        // Smart S Launcher 3.30.39 - restore History after HOME from search\n        versionCode 467\n        versionName "3.30.39"\n''')
      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java app/src/main/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicy.java app/src/test/java/fr/neamar/kiss/forwarder/HistoryRefreshPolicyTest.java
          git diff --cached --check
          git commit -m "Fix HOME restoration to History in 3.30.39"
          git push origin HEAD:fix/3.30.39-home-history-restore-v2
