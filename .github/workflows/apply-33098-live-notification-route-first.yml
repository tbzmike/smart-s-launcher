name: Apply 3.30.98 route fix

on:
  push:
    branches:
      - 'fix/3.30.98-live-notification-route-first'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/3.30.98-live-notification-route-first'
          fetch-depth: 0
      - name: Apply source patch
        run: python3 .github/patches/apply_33098.py
      - name: Verify patch
        run: |
          grep -q 'versionCode 526' app/build.gradle
          grep -q 'versionName "3.30.98"' app/build.gradle
          grep -q 'latestActive.id, latestActive.postTime' app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java
          grep -q 'Prefer Android.s current live notification object' app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java
          git diff --check
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java
          git commit -m 'Fix exact notification opening with live route first'
          git push origin HEAD:fix/3.30.98-live-notification-route-first
