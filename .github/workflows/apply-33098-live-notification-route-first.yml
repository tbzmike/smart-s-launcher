name: Apply 3.30.98 route fix

on:
  push:
    branches:
      - 'fix/3.30.98-live-notification-route-first'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/3.30.98-live-notification-route-first'
          fetch-depth: 0
      - name: Confirm patch workflow
        run: echo "3.30.98 patch workflow is active"
