name: Retry Smart S 3.30.99 History Removal

on:
  push:
    branches:
      - fix/3.30.99-history-remove-item

permissions:
  contents: write

concurrency:
  group: apply-33099-history-removal-v3
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact 3.30.98 baseline
        run: |
          set -euxo pipefail
          grep -q 'versionCode 526' app/build.gradle
          grep -q 'versionName "3.30.98"' app/build.gradle
          grep -q 'canRemoveFromHistory(context) && isShowingHistory()' app/src/main/java/fr/neamar/kiss/result/Result.java

      - name: Repair temporary patch script quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_history_remove_33099.py')
          t = p.read_text()
          t = t.replace('versionName "3.30.98""""', 'versionName \\"3.30.98\\""""')
          t = t.replace('versionName "3.30.99""""', 'versionName \\"3.30.99\\""""')
          p.write_text(t)
          PY
          python3 -m py_compile .github/scripts/apply_history_remove_33099.py

      - name: Apply guarded source patch
        run: python3 .github/scripts/apply_history_remove_33099.py

      - name: Verify intended changes
        run: |
          set -euxo pipefail
          grep -q 'versionCode 527' app/build.gradle
          grep -q 'versionName "3.30.99"' app/build.gradle
          grep -q 'isShowingHistory() && !UiEditLock.isLocked(context)' app/src/main/java/fr/neamar/kiss/result/Result.java
          grep -q 'if (UiEditLock.isLocked(context)) return true;' app/src/main/java/fr/neamar/kiss/result/Result.java
          grep -q 'NotificationTimelineState.hideFromHistory' app/src/main/java/fr/neamar/kiss/result/Result.java
          grep -q 'NotificationTimelineState.isHiddenFromHistory' app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java
          grep -q '<string name="menu_remove">Remove item</string>' app/src/main/res/values/strings.xml
          ! grep -q 'canRemoveFromHistory(context) && isShowingHistory()' app/src/main/java/fr/neamar/kiss/result/Result.java
          git diff --check

      - name: Commit targeted source changes and clean temporary patch files
        run: |
          set -euxo pipefail
          rm -f .github/workflows/apply-history-remove-3.30.99.yml
          rm -f .github/workflows/apply-history-remove-3.30.99-v2.yml
          rm -f .github/workflows/apply-history-remove-3.30.99-v3.yml
          rm -f .github/scripts/apply_history_remove_33099.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Implement universal history item removal in 3.30.99'
          git push origin HEAD:fix/3.30.99-history-remove-item
