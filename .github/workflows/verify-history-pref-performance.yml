name: Verify History preference performance fix

on:
  push:
    branches:
      - build/3.30.07

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'Retry History preference performance verifier'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.07
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle
      - name: Patch verified History preference hot path
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java"); s=p.read_text(); old="    private int safePrefInt(String key, int fallback, int min, int max) {\n        Object raw = prefs.getAll().get(key);\n        int value = fallback;\n        if (raw instanceof Number) value = Math.round(((Number) raw).floatValue());\n        else if (raw instanceof String) {\n            try { value = Math.round(Float.parseFloat((String) raw)); }\n            catch (NumberFormatException ignored) { value = fallback; }\n        }\n        return Math.max(min, Math.min(max, value));\n    }\n"; new="    private Object readPreferenceValue(String key) {\n        if (!prefs.contains(key)) return null;\n        try { return prefs.getString(key, null); } catch (ClassCastException ignored) { }\n        try { return prefs.getInt(key, 0); } catch (ClassCastException ignored) { }\n        try { return prefs.getFloat(key, 0f); } catch (ClassCastException ignored) { }\n        try { return prefs.getLong(key, 0L); } catch (ClassCastException ignored) { }\n        return null;\n    }\n\n    private int safePrefInt(String key, int fallback, int min, int max) {\n        Object raw = readPreferenceValue(key);\n        int value = fallback;\n        if (raw instanceof Number) value = Math.round(((Number) raw).floatValue());\n        else if (raw instanceof String) {\n            try { value = Math.round(Float.parseFloat((String) raw)); }\n            catch (NumberFormatException ignored) { value = fallback; }\n        }\n        return Math.max(min, Math.min(max, value));\n    }\n"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
      - name: Verify intended source delta
        run: |
          grep -q 'Object raw = readPreferenceValue(key);' app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java
          ! grep -q 'Object raw = prefs.getAll().get(key);' app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java
          grep -q 'versionCode 435' app/build.gradle
          grep -q 'versionName "3.30.07"' app/build.gradle
          git diff --check
      - name: Full verification
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify built APK version
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='435'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.07'" /tmp/apk-badging.txt
      - name: Commit only after verification
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java
          git rm .github/workflows/verify-history-pref-performance.yml
          git diff --cached --check
          git commit -m 'Reduce History preference allocation overhead'
          git push origin HEAD:build/3.30.07
