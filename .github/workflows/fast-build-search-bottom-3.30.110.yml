name: Fast build search-bottom 3.30.110

on:
  push:
    branches:
      - feature/search-bottom-fix-3.30.110

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/fix_search_bottom_3_30_110.py
      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Verify
        run: |
          grep -q 'versionName "3.30.110"' app/build.gradle
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartSLauncher-3.30.110-fast
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
