name: Fast build search-bottom 3.30.110

on:
  push:
    branches:
      - feature/search-bottom-fix-3.30.110

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Apply patch
        run: python3 .github/scripts/fix_search_bottom_3_30_110.py
      - name: Verify source before build
        run: |
          set -euo pipefail
          grep -q 'versionName "3.30.110"' app/build.gradle
          grep -q 'versionCode 538' app/build.gradle
          grep -q 'EXACT_REACHABILITY_RELEVANCE = 1_000_000' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'isExactReachabilityMatch(pojo)' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'First stage: search the already-rendered history rows in memory' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'publishHistoryPreview' app/src/main/java/fr/neamar/kiss/searcher/SearchHandler.java
          grep -q 'moveExactLaunchTargetsToBottom(updatedResults, query)' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -q 'class PixelLauncherScreenOffReceiver' app/src/main/java/fr/neamar/kiss/PixelLauncherScreenOffReceiver.java
      - name: Build APKs
        run: bash ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Final source cleanup and commit
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix_search_bottom_3_30_110.py .github/workflows/fix-search-bottom-3.30.110.yml .github/workflows/fast-build-search-bottom-3.30.110.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java .github/scripts/fix_search_bottom_3_30_110.py .github/workflows/fix-search-bottom-3.30.110.yml .github/workflows/fast-build-search-bottom-3.30.110.yml
          git diff --cached --check
          git commit -m 'Fix exact launch targets staying at search bottom'
          git push origin HEAD:feature/search-bottom-fix-3.30.110
      - name: Verify final source scope
        run: |
          set -euo pipefail
          git fetch origin feature/search-bottom-fix-3.30.110
          changed=$(git diff --name-only e6ffc1dc7675f0997527b0652b2748d1c3408555..origin/feature/search-bottom-fix-3.30.110)
          echo "$changed"
          test "$(echo "$changed" | wc -l)" -eq 2
          echo "$changed" | grep -qx 'app/build.gradle'$'\n''app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java'
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartSLauncher-3.30.110-final
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
