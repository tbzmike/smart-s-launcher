name: One-time privacy hardening migration

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/privacy-hardening-migration.yml'

permissions:
  contents: write

jobs:
  harden-map-privacy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Make online map previews explicit opt-in
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          java = Path('app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java')
          text = java.read_text(encoding='utf-8')

          old = 'import androidx.core.content.ContextCompat;\n'
          new = old + 'import androidx.preference.PreferenceManager;\n'
          if old not in text or 'androidx.preference.PreferenceManager' in text:
              raise SystemExit('Unexpected MapLiveTileProvider import state')
          text = text.replace(old, new, 1)

          old = '    private static final int LOCATION_REQUEST_CODE = 4704;\n'
          new = old + '    private static final String PREF_ONLINE_MAP_PREVIEWS = "smart-online-map-previews";\n'
          if old not in text:
              raise SystemExit('Map preference insertion point not found')
          text = text.replace(old, new, 1)

          old = '    private MapLiveTileProvider() { }\n\n'
          new = old + '''    private static boolean onlineMapPreviewsEnabled(Context context) {\n        return context != null\n                && PreferenceManager.getDefaultSharedPreferences(context)\n                .getBoolean(PREF_ONLINE_MAP_PREVIEWS, false);\n    }\n\n'''
          if old not in text:
              raise SystemExit('Map helper insertion point not found')
          text = text.replace(old, new, 1)

          old = '    static void requestFreshLocation(MainActivity activity, Runnable onChanged) {\n        if (activity == null) return;\n'
          new = old + '        if (!onlineMapPreviewsEnabled(activity)) return;\n'
          if old not in text:
              raise SystemExit('requestFreshLocation insertion point not found')
          text = text.replace(old, new, 1)

          old = '    static LiveTileDataProvider.LiveTileData latest(Context context) {\n        if (!hasLocationPermission(context)) return null;\n'
          new = '    static LiveTileDataProvider.LiveTileData latest(Context context) {\n        if (!onlineMapPreviewsEnabled(context)) return null;\n        if (!hasLocationPermission(context)) return null;\n'
          if old not in text:
              raise SystemExit('latest insertion point not found')
          text = text.replace(old, new, 1)
          java.write_text(text, encoding='utf-8')

          prefs = Path('app/src/main/res/xml/preferences_smart_features.xml')
          p = prefs.read_text(encoding='utf-8')
          marker = '</PreferenceScreen>'
          block = '''    <PreferenceCategory app:title="Privacy &amp; network">\n        <SwitchPreference\n            app:defaultValue="false"\n            app:key="smart-online-map-previews"\n            app:title="Online map previews"\n            app:summary="When enabled, Google Maps history cards may send an approximate location tile request to OpenStreetMap. Off keeps this network preview disabled." />\n    </PreferenceCategory>\n\n'''
          if marker not in p or 'smart-online-map-previews' in p:
              raise SystemExit('Unexpected preferences state')
          p = p.replace(marker, block + marker, 1)
          prefs.write_text(p, encoding='utf-8')
          PY

      - name: Verify privacy default and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'app:key="smart-online-map-previews"' app/src/main/res/xml/preferences_smart_features.xml
          grep -F 'app:defaultValue="false"' app/src/main/res/xml/preferences_smart_features.xml
          grep -F 'if (!onlineMapPreviewsEnabled(activity)) return;' app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java
          grep -F 'if (!onlineMapPreviewsEnabled(context)) return null;' app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/fr/neamar/kiss/forwarder/MapLiveTileProvider.java app/src/main/res/xml/preferences_smart_features.xml
          git commit -m 'Make online map previews explicit opt-in'
          git push origin HEAD:master
