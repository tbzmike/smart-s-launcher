name: One-shot direct history reorder 3.30.04

on:
  push:
    branches:
      - build/3.30.04
    paths:
      - .github/workflows/one-shot-history-direct-reorder-3.30.04.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.04
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply guarded direct-click history reorder fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def lines(items):
              return "\n".join(items)

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          adapter = Path("app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java")
          text = adapter.read_text()
          notification_old = lines([
              "        View.OnClickListener openHistory = v -> {",
              "            RecentLaunchTracker.remember(result.getPojo());",
              "            if (NotificationHistoryResolver.showForPojo(v.getContext(), result.getPojo())) {",
          ])
          notification_new = lines([
              "        View.OnClickListener openHistory = v -> {",
              "            RecentLaunchTracker.remember(result.getPojo());",
              "            promoteHistoryResult(result);",
              "            if (NotificationHistoryResolver.showForPojo(v.getContext(), result.getPojo())) {",
          ])
          if text.count(notification_old) != 1:
              raise SystemExit("notification click anchor mismatch")
          text = text.replace(notification_old, notification_new, 1)

          click_old = lines([
              "            final Result<?> result = getItem(position);",
              "            RecentLaunchTracker.remember(result.getPojo());",
              "            if (result.getPojo() instanceof NotificationPojo",
          ])
          click_new = lines([
              "            final Result<?> result = getItem(position);",
              "            RecentLaunchTracker.remember(result.getPojo());",
              "            promoteHistoryResult(result);",
              "            if (result.getPojo() instanceof NotificationPojo",
          ])
          if text.count(click_old) != 1:
              raise SystemExit("main click anchor mismatch")
          text = text.replace(click_old, click_new, 1)

          old_start = "    /** Move the selected warm history object to the newest position without reloading its icon. */\n"
          next_method = "    public void updateWithPojos(@NonNull Context context, @NonNull List<Pojo> pojos, boolean isRefresh, String query) {"
          if text.count(old_start) != 1 or text.count(next_method) != 1:
              raise SystemExit("old delayed promotion method boundaries mismatch")
          start = text.index(old_start)
          end = text.index(next_method, start)
          direct_method = lines([
              "    /**",
              "     * Move the exact row the user clicked to the final/newest history position immediately.",
              "     * This is click-driven rather than lifecycle-driven so a later Home restoration cannot",
              "     * lose the identity of the selected row.",
              "     */",
              "    private void promoteHistoryResult(Result<?> selected) {",
              "        if (SearchHandler.getInstance().getLastSearchType() != Searcher.Type.HISTORY",
              "                || selected == null || results.size() < 2) return;",
              "",
              "        int position = results.indexOf(selected);",
              "        if (!HistoryRecencyPolicy.shouldMoveToNewest(position, results.size())) return;",
              "",
              "        parent.beforeListChange();",
              "        HistoryRecencyPolicy.moveSelectedToNewest(results, position);",
              "        notifyDataSetChanged();",
              "        // Leave transcript mode enabled: this deliberate recency change should reveal the",
              "        // selected item at the final/bottom position rather than preserving the old viewport.",
              "        parent.afterListChange();",
              "    }",
              "",
              "",
          ])
          text = text[:start] + direct_method + text[end:]
          adapter.write_text(text)

          result = Path("app/src/main/java/fr/neamar/kiss/result/Result.java")
          replace_once(result, "import fr.neamar.kiss.utils.RecentLaunchTracker;\n", "", "remove failed Result tracker import")
          replace_once(result, "            RecentLaunchTracker.remember(pojo);\n", "", "remove failed delayed tracker write")

          main = Path("app/src/main/java/fr/neamar/kiss/MainActivity.java")
          main_old = lines([
              "        } else if (isViewingAllApps()) {",
              "            displayKissBar(false);",
              "        } else {",
              "            // History is chronological from older to newer. Move the selected warm object—not a",
              "            // rebuilt row—to the bottom so the latest app, shortcut or feature is always last.",
              "            adapter.promoteMostRecentHistoryResult();",
              "        }",
          ])
          main_new = lines([
              "        } else if (isViewingAllApps()) {",
              "            displayKissBar(false);",
              "        }",
          ])
          replace_once(main, main_old, main_new, "remove delayed lifecycle reorder")

          policy = Path("app/src/main/java/fr/neamar/kiss/adapter/HistoryRecencyPolicy.java")
          expected_policy = lines([
              "package fr.neamar.kiss.adapter;",
              "",
              "/** Pure ordering rule for oldest-to-newest launcher history. */",
              "final class HistoryRecencyPolicy {",
              "    private HistoryRecencyPolicy() { }",
              "",
              "    static boolean shouldMoveToNewest(int selectedPosition, int itemCount) {",
              "        return itemCount > 1 && selectedPosition >= 0 && selectedPosition < itemCount - 1;",
              "    }",
              "}",
              "",
          ])
          if policy.read_text() != expected_policy:
              raise SystemExit("HistoryRecencyPolicy source changed unexpectedly")
          policy.write_text(lines([
              "package fr.neamar.kiss.adapter;",
              "",
              "import java.util.List;",
              "",
              "/** Pure ordering rule for oldest-to-newest launcher history. */",
              "final class HistoryRecencyPolicy {",
              "    private HistoryRecencyPolicy() { }",
              "",
              "    static boolean shouldMoveToNewest(int selectedPosition, int itemCount) {",
              "        return itemCount > 1 && selectedPosition >= 0 && selectedPosition < itemCount - 1;",
              "    }",
              "",
              "    static <T> boolean moveSelectedToNewest(List<T> items, int selectedPosition) {",
              "        if (items == null || !shouldMoveToNewest(selectedPosition, items.size())) return false;",
              "        T selected = items.remove(selectedPosition);",
              "        items.add(selected);",
              "        return true;",
              "    }",
              "}",
              "",
          ]))

          test = Path("app/src/test/java/fr/neamar/kiss/adapter/HistoryRecencyPolicyTest.java")
          test.write_text(lines([
              "package fr.neamar.kiss.adapter;",
              "",
              "import static org.hamcrest.MatcherAssert.assertThat;",
              "import static org.hamcrest.Matchers.is;",
              "",
              "import org.junit.jupiter.api.Test;",
              "",
              "import java.util.ArrayList;",
              "import java.util.Arrays;",
              "import java.util.List;",
              "",
              "class HistoryRecencyPolicyTest {",
              "    @Test",
              "    void everyValidNonNewestHistoryItemMovesToBottom() {",
              "        assertThat(HistoryRecencyPolicy.shouldMoveToNewest(0, 4), is(true));",
              "        assertThat(HistoryRecencyPolicy.shouldMoveToNewest(1, 4), is(true));",
              "        assertThat(HistoryRecencyPolicy.shouldMoveToNewest(2, 4), is(true));",
              "    }",
              "",
              "    @Test",
              "    void exactClickedObjectIsMovedToFinalPosition() {",
              "        List<String> history = new ArrayList<>(Arrays.asList(\"oldest\", \"clicked\", \"newest\"));",
              "        assertThat(HistoryRecencyPolicy.moveSelectedToNewest(history, 1), is(true));",
              "        assertThat(history, is(Arrays.asList(\"oldest\", \"newest\", \"clicked\")));",
              "    }",
              "",
              "    @Test",
              "    void newestMissingAndSingleItemsDoNotTriggerAListChange() {",
              "        List<String> history = new ArrayList<>(Arrays.asList(\"oldest\", \"newest\"));",
              "        assertThat(HistoryRecencyPolicy.moveSelectedToNewest(history, 1), is(false));",
              "        assertThat(history, is(Arrays.asList(\"oldest\", \"newest\")));",
              "        assertThat(HistoryRecencyPolicy.shouldMoveToNewest(-1, 4), is(false));",
              "        assertThat(HistoryRecencyPolicy.shouldMoveToNewest(0, 1), is(false));",
              "    }",
              "}",
              "",
          ]))

          gradle = Path("app/build.gradle")
          replace_once(gradle, "// Smart S Launcher 3.30.03", "// Smart S Launcher 3.30.04", "version comment")
          replace_once(gradle, "versionCode 431", "versionCode 432", "version code")
          replace_once(gradle, "versionName \"3.30.03\"", "versionName \"3.30.04\"", "version name")

          build = Path(".github/workflows/build.yml")
          build_text = build.read_text()
          if build_text.count("431") != 2 or build_text.count("3.30.03") != 5:
              raise SystemExit("build workflow version references changed unexpectedly")
          build.write_text(build_text.replace("431", "432").replace("3.30.03", "3.30.04"))
          PY

      - name: Verify exact source wiring before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          adapter = Path("app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java").read_text()
          result = Path("app/src/main/java/fr/neamar/kiss/result/Result.java").read_text()
          main = Path("app/src/main/java/fr/neamar/kiss/MainActivity.java").read_text()
          policy = Path("app/src/main/java/fr/neamar/kiss/adapter/HistoryRecencyPolicy.java").read_text()
          test = Path("app/src/test/java/fr/neamar/kiss/adapter/HistoryRecencyPolicyTest.java").read_text()
          gradle = Path("app/build.gradle").read_text()
          build = Path(".github/workflows/build.yml").read_text()
          assert adapter.count("promoteHistoryResult(result);") == 2
          assert adapter.count("private void promoteHistoryResult(Result<?> selected)") == 1
          assert "promoteMostRecentHistoryResult" not in adapter
          promote = adapter[adapter.index("private void promoteHistoryResult"):adapter.index("public void updateWithPojos")]
          assert "temporarilyDisableTranscriptMode();" not in promote
          assert "RecentLaunchTracker.remember(pojo);" not in result
          assert "import fr.neamar.kiss.utils.RecentLaunchTracker;" not in result
          assert "adapter.promoteMostRecentHistoryResult();" not in main
          assert policy.count("moveSelectedToNewest") == 1
          assert "exactClickedObjectIsMovedToFinalPosition" in test
          assert "versionCode 432" in gradle
          assert "versionName \"3.30.04\"" in gradle
          assert "versionCode 431" not in build
          assert "3.30.03" not in build
          assert "versionCode 432" in build
          assert "3.30.04" in build
          PY
          git diff --check
          git diff -- app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/adapter/HistoryRecencyPolicy.java app/src/main/java/fr/neamar/kiss/result/Result.java app/src/main/java/fr/neamar/kiss/MainActivity.java app/src/test/java/fr/neamar/kiss/adapter/HistoryRecencyPolicyTest.java app/build.gradle .github/workflows/build.yml

      - name: Run lint, unit tests, and build both APK variants
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Commit verified 3.30.04 and remove one-shot verifier
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git rm .github/workflows/one-shot-history-direct-reorder-3.30.04.yml
          git add app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/adapter/HistoryRecencyPolicy.java app/src/main/java/fr/neamar/kiss/result/Result.java app/src/main/java/fr/neamar/kiss/MainActivity.java app/src/test/java/fr/neamar/kiss/adapter/HistoryRecencyPolicyTest.java app/build.gradle .github/workflows/build.yml
          git diff --cached --check
          git commit -m 'Move clicked history row directly to bottom in 3.30.04'
          git push origin HEAD:build/3.30.04
