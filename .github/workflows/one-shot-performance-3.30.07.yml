name: One-shot verified 3.30.07 performance upgrade

on:
  push:
    branches:
      - performance-3.30.07

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'Fix strict 3.30.07 verifier writeback'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: performance-3.30.07
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Patch RecordAdapter audited lookup
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java"); s=p.read_text(); old="        Object raw = prefs.getAll().get(key);\n"; assert s.count(old)==1, s.count(old); s=s.replace(old,"        Object raw = readPreferenceValue(prefs, key);\n",1); marker="    private int safePercent(SharedPreferences prefs, String key, int fallback, int min, int max) {\n"; assert s.count(marker)==1, s.count(marker); helper="    /** Read one preference without allocating the complete SharedPreferences map on every row bind. */\n    private Object readPreferenceValue(SharedPreferences prefs, String key) {\n        if (!prefs.contains(key)) return null;\n        try { return prefs.getString(key, null); } catch (ClassCastException ignored) { }\n        try { return prefs.getInt(key, 0); } catch (ClassCastException ignored) { }\n        try { return prefs.getFloat(key, 0f); } catch (ClassCastException ignored) { }\n        try { return prefs.getLong(key, 0L); } catch (ClassCastException ignored) { }\n        return null;\n    }\n\n"; p.write_text(s.replace(marker,helper+marker,1))'
      - name: Patch animation preference cache
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java"); s=p.read_text(); old="    private static SharedPreferences prefs(Context context) {\n        return PreferenceManager.getDefaultSharedPreferences(context);\n    }\n"; assert s.count(old)==1, s.count(old); new="    private static volatile SharedPreferences cachedPreferences;\n\n    private static SharedPreferences prefs(Context context) {\n        SharedPreferences local = cachedPreferences;\n        if (local == null) {\n            synchronized (SmartAnimationEngine.class) {\n                local = cachedPreferences;\n                if (local == null) {\n                    local = PreferenceManager.getDefaultSharedPreferences(context.getApplicationContext());\n                    cachedPreferences = local;\n                }\n            }\n        }\n        return local;\n    }\n"; p.write_text(s.replace(old,new,1))'
      - name: Patch animation preference lookups
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java"); s=p.read_text(); pairs=[("        Object value = prefs(context).getAll().get(key);\n","        Object value = readPreferenceValue(prefs(context), key);\n"),("        Object percentValue = preferences.getAll().get(\"smart-animation-speed-percent\");\n","        Object percentValue = readPreferenceValue(preferences, \"smart-animation-speed-percent\");\n"),("        Object legacyValue = preferences.getAll().get(\"smart-animation-speed\");\n","        Object legacyValue = readPreferenceValue(preferences, \"smart-animation-speed\");\n")]; assert all(s.count(a)==1 for a,b in pairs), [(a.strip(),s.count(a)) for a,b in pairs]; s=s.replace(pairs[0][0],pairs[0][1],1).replace(pairs[1][0],pairs[1][1],1).replace(pairs[2][0],pairs[2][1],1); marker="    private static Float parseNumber(Object value) {\n"; assert s.count(marker)==1, s.count(marker); helper="    private static Object readPreferenceValue(SharedPreferences preferences, String key) {\n        if (!preferences.contains(key)) return null;\n        try { return preferences.getString(key, null); } catch (ClassCastException ignored) { }\n        try { return preferences.getInt(key, 0); } catch (ClassCastException ignored) { }\n        try { return preferences.getFloat(key, 0f); } catch (ClassCastException ignored) { }\n        try { return preferences.getLong(key, 0L); } catch (ClassCastException ignored) { }\n        return null;\n    }\n\n"; p.write_text(s.replace(marker,helper+marker,1))'
      - name: Bump verified version
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/build.gradle"); s=p.read_text(); pairs=[("// Smart S Launcher 3.30.06","// Smart S Launcher 3.30.07"),("versionCode 434","versionCode 435"),("versionName \"3.30.06\"","versionName \"3.30.07\"")]; assert all(s.count(a)==1 for a,b in pairs), [(a,s.count(a)) for a,b in pairs]; s=s.replace(pairs[0][0],pairs[0][1],1).replace(pairs[1][0],pairs[1][1],1).replace(pairs[2][0],pairs[2][1],1); p.write_text(s)'
      - name: Verify intended source state
        run: |
          grep -q 'versionCode 435' app/build.gradle
          grep -q 'versionName "3.30.07"' app/build.gradle
          ! grep -q 'Object raw = prefs.getAll().get(key);' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -q 'readPreferenceValue(prefs, key)' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          ! grep -q 'getAll().get(' app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java
          grep -q 'cachedPreferences' app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java
          git diff --check
          git diff -- app/build.gradle app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java
      - name: Full verification
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify APK metadata
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='435'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.07'" /tmp/apk-badging.txt
      - name: Commit only after verification
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java
          git rm .github/workflows/one-shot-performance-3.30.07.yml
          git diff --cached --check
          git commit -m 'Optimize hot paths and bump Smart S Launcher to 3.30.07'
          git push origin HEAD:performance-3.30.07
