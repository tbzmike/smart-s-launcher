name: One-shot verified 3.30.07 performance upgrade

on:
  push:
    branches:
      - performance-3.30.07

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'Retry verified 3.30.07 performance upgrade'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: performance-3.30.07
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply audited hot-path optimizations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adapter = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java')
          a = adapter.read_text()
          raw_lookup = '        Object raw = prefs.getAll().get(key);\n'
          if a.count(raw_lookup) != 1:
              raise SystemExit(f'Expected exactly one RecordAdapter getAll lookup, found {a.count(raw_lookup)}')
          a = a.replace(raw_lookup, '        Object raw = readPreferenceValue(prefs, key);\n', 1)

          safe_marker = '    private int safePercent(SharedPreferences prefs, String key, int fallback, int min, int max) {\n'
          if a.count(safe_marker) != 1:
              raise SystemExit(f'Expected exactly one RecordAdapter safePercent marker, found {a.count(safe_marker)}')
          helper = '''    /** Read one preference without allocating the complete SharedPreferences map on every row bind. */
    private Object readPreferenceValue(SharedPreferences prefs, String key) {
        if (!prefs.contains(key)) return null;
        try { return prefs.getString(key, null); } catch (ClassCastException ignored) { }
        try { return prefs.getInt(key, 0); } catch (ClassCastException ignored) { }
        try { return prefs.getFloat(key, 0f); } catch (ClassCastException ignored) { }
        try { return prefs.getLong(key, 0L); } catch (ClassCastException ignored) { }
        return null;
    }

'''
          a = a.replace(safe_marker, helper + safe_marker, 1)
          adapter.write_text(a)

          animation = Path('app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java')
          s = animation.read_text()
          prefs_method = '''    private static SharedPreferences prefs(Context context) {
        return PreferenceManager.getDefaultSharedPreferences(context);
    }
'''
          if s.count(prefs_method) != 1:
              raise SystemExit(f'Expected exactly one SmartAnimationEngine prefs method, found {s.count(prefs_method)}')
          cached_prefs_method = '''    private static volatile SharedPreferences cachedPreferences;

    private static SharedPreferences prefs(Context context) {
        SharedPreferences local = cachedPreferences;
        if (local == null) {
            synchronized (SmartAnimationEngine.class) {
                local = cachedPreferences;
                if (local == null) {
                    local = PreferenceManager.getDefaultSharedPreferences(context.getApplicationContext());
                    cachedPreferences = local;
                }
            }
        }
        return local;
    }
'''
          s = s.replace(prefs_method, cached_prefs_method, 1)

          replacements = {
              '        Object value = prefs(context).getAll().get(key);\n': '        Object value = readPreferenceValue(prefs(context), key);\n',
              '        Object percentValue = preferences.getAll().get("smart-animation-speed-percent");\n': '        Object percentValue = readPreferenceValue(preferences, "smart-animation-speed-percent");\n',
              '        Object legacyValue = preferences.getAll().get("smart-animation-speed");\n': '        Object legacyValue = readPreferenceValue(preferences, "smart-animation-speed");\n',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one SmartAnimationEngine anchor: {old.strip()} (found {s.count(old)})')
              s = s.replace(old, new, 1)

          parse_marker = '    private static Float parseNumber(Object value) {\n'
          if s.count(parse_marker) != 1:
              raise SystemExit(f'Expected exactly one SmartAnimationEngine parseNumber marker, found {s.count(parse_marker)}')
          pref_helper = '''    private static Object readPreferenceValue(SharedPreferences preferences, String key) {
        if (!preferences.contains(key)) return null;
        try { return preferences.getString(key, null); } catch (ClassCastException ignored) { }
        try { return preferences.getInt(key, 0); } catch (ClassCastException ignored) { }
        try { return preferences.getFloat(key, 0f); } catch (ClassCastException ignored) { }
        try { return preferences.getLong(key, 0L); } catch (ClassCastException ignored) { }
        return null;
    }

'''
          s = s.replace(parse_marker, pref_helper + parse_marker, 1)
          animation.write_text(s)

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          version_replacements = {
              '// Smart S Launcher 3.30.06': '// Smart S Launcher 3.30.07',
              'versionCode 434': 'versionCode 435',
              'versionName "3.30.06"': 'versionName "3.30.07"',
          }
          for old, new in version_replacements.items():
              if g.count(old) != 1:
                  raise SystemExit(f'Expected exactly one version token {old}, found {g.count(old)}')
              g = g.replace(old, new, 1)
          gradle.write_text(g)
          PY
      - name: Verify intended source state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java').read_text()
          assert 'Object raw = prefs.getAll().get(key);' not in a
          assert a.count('readPreferenceValue(prefs, key)') == 1
          s = Path('app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java').read_text()
          assert 'private static volatile SharedPreferences cachedPreferences;' in s
          assert '.getAll().get(' not in s
          assert s.count('readPreferenceValue(') >= 4
          g = Path('app/build.gradle').read_text()
          assert '// Smart S Launcher 3.30.07' in g
          assert 'versionCode 435' in g
          assert 'versionName "3.30.07"' in g
          PY
          git diff --check
          git diff -- app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java app/build.gradle
      - name: Full verification
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify APK metadata
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='435'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.07'" /tmp/apk-badging.txt
      - name: Commit verified performance upgrade and remove one-shot workflow
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java app/build.gradle
          git rm .github/workflows/one-shot-performance-3.30.07.yml
          git diff --cached --check
          git commit -m 'Optimize hot paths and bump Smart S Launcher to 3.30.07'
          git push origin HEAD:performance-3.30.07
