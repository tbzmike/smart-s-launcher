name: One-shot verified 3.30.07 performance upgrade

on:
  push:
    branches:
      - performance-3.30.07

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'Run verified 3.30.07 performance upgrade'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: performance-3.30.07
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply audited hot-path optimizations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adapter = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java')
          a = adapter.read_text()
          old = '''    private int safePercent(SharedPreferences prefs, String key, int fallback, int min, int max) {\n        Object raw = prefs.getAll().get(key);\n        int value = fallback;\n        if (raw instanceof Number) value = Math.round(((Number) raw).floatValue());\n        else if (raw instanceof String) {\n            try { value = Math.round(Float.parseFloat((String) raw)); }\n            catch (NumberFormatException ignored) { value = fallback; }\n        }\n        return Math.max(min, Math.min(max, value));\n    }\n'''
          new = '''    private int safePercent(SharedPreferences prefs, String key, int fallback, int min, int max) {\n        Object raw = readPreferenceValue(prefs, key);\n        int value = fallback;\n        if (raw instanceof Number) value = Math.round(((Number) raw).floatValue());\n        else if (raw instanceof String) {\n            try { value = Math.round(Float.parseFloat((String) raw)); }\n            catch (NumberFormatException ignored) { value = fallback; }\n        }\n        return Math.max(min, Math.min(max, value));\n    }\n\n    /** Read one preference without allocating the complete SharedPreferences map on every row bind. */\n    private Object readPreferenceValue(SharedPreferences prefs, String key) {\n        if (!prefs.contains(key)) return null;\n        try { return prefs.getString(key, null); } catch (ClassCastException ignored) { }\n        try { return prefs.getInt(key, 0); } catch (ClassCastException ignored) { }\n        try { return prefs.getFloat(key, 0f); } catch (ClassCastException ignored) { }\n        try { return prefs.getLong(key, 0L); } catch (ClassCastException ignored) { }\n        return null;\n    }\n'''
          if a.count(old) != 1:
              raise SystemExit(f'Expected exactly one RecordAdapter safePercent block, found {a.count(old)}')
          adapter.write_text(a.replace(old, new, 1))

          animation = Path('app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java')
          s = animation.read_text()
          old_prefs = '''    private static SharedPreferences prefs(Context context) {\n        return PreferenceManager.getDefaultSharedPreferences(context);\n    }\n'''
          new_prefs = '''    private static volatile SharedPreferences cachedPreferences;\n\n    private static SharedPreferences prefs(Context context) {\n        SharedPreferences local = cachedPreferences;\n        if (local == null) {\n            synchronized (SmartAnimationEngine.class) {\n                local = cachedPreferences;\n                if (local == null) {\n                    local = PreferenceManager.getDefaultSharedPreferences(context.getApplicationContext());\n                    cachedPreferences = local;\n                }\n            }\n        }\n        return local;\n    }\n'''
          if s.count(old_prefs) != 1:
              raise SystemExit('Expected exactly one SmartAnimationEngine prefs block')
          s = s.replace(old_prefs, new_prefs, 1)

          old_style = '''    public static String getStyle(Context context, String key, String fallback) {\n        Object value = prefs(context).getAll().get(key);\n        return value instanceof String ? (String) value : fallback;\n    }\n'''
          new_style = '''    public static String getStyle(Context context, String key, String fallback) {\n        try {\n            return prefs(context).getString(key, fallback);\n        } catch (ClassCastException ignored) {\n            return fallback;\n        }\n    }\n'''
          if s.count(old_style) != 1:
              raise SystemExit('Expected exactly one SmartAnimationEngine getStyle block')
          s = s.replace(old_style, new_style, 1)

          old_speed = '''    private static float readSpeedMultiplier(SharedPreferences preferences) {\n        Object percentValue = preferences.getAll().get("smart-animation-speed-percent");\n        Float percent = parseNumber(percentValue);\n        if (percent != null) return percent / 100f;\n\n        Object legacyValue = preferences.getAll().get("smart-animation-speed");\n        Float legacy = parseNumber(legacyValue);\n        return legacy == null ? 1f : legacy;\n    }\n'''
          new_speed = '''    private static float readSpeedMultiplier(SharedPreferences preferences) {\n        Float percent = parseNumber(readPreferenceValue(preferences, "smart-animation-speed-percent"));\n        if (percent != null) return percent / 100f;\n\n        Float legacy = parseNumber(readPreferenceValue(preferences, "smart-animation-speed"));\n        return legacy == null ? 1f : legacy;\n    }\n\n    private static Object readPreferenceValue(SharedPreferences preferences, String key) {\n        if (!preferences.contains(key)) return null;\n        try { return preferences.getString(key, null); } catch (ClassCastException ignored) { }\n        try { return preferences.getInt(key, 0); } catch (ClassCastException ignored) { }\n        try { return preferences.getFloat(key, 0f); } catch (ClassCastException ignored) { }\n        try { return preferences.getLong(key, 0L); } catch (ClassCastException ignored) { }\n        return null;\n    }\n'''
          if s.count(old_speed) != 1:
              raise SystemExit('Expected exactly one SmartAnimationEngine speed block')
          animation.write_text(s.replace(old_speed, new_speed, 1))

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          replacements = {
              '// Smart S Launcher 3.30.06': '// Smart S Launcher 3.30.07',
              'versionCode 434': 'versionCode 435',
              'versionName "3.30.06"': 'versionName "3.30.07"',
          }
          for oldv, newv in replacements.items():
              if g.count(oldv) != 1:
                  raise SystemExit(f'Expected exactly one version token: {oldv}')
              g = g.replace(oldv, newv, 1)
          gradle.write_text(g)
          PY
      - name: Verify intended source state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java').read_text()
          assert 'Object raw = prefs.getAll().get(key);' not in a
          assert 'readPreferenceValue(prefs, key)' in a
          s = Path('app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java').read_text()
          assert 'cachedPreferences' in s
          assert '.getAll().get(' not in s
          g = Path('app/build.gradle').read_text()
          assert '// Smart S Launcher 3.30.07' in g
          assert 'versionCode 435' in g
          assert 'versionName "3.30.07"' in g
          PY
          git diff --check
          git diff -- app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java app/build.gradle
      - name: Full verification
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify APK metadata
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='435'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.07'" /tmp/apk-badging.txt
      - name: Commit verified performance upgrade and remove one-shot workflow
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java app/src/main/java/fr/neamar/kiss/ui/SmartAnimationEngine.java app/build.gradle
          git rm .github/workflows/one-shot-performance-3.30.07.yml
          git diff --cached --check
          git commit -m 'Optimize hot paths and bump Smart S Launcher to 3.30.07'
          git push origin HEAD:performance-3.30.07
