name: Diagnose 3.30.65 guarded compile failure
on:
  push:
    branches: [fix/3.30.65-search-notification-routes]
    paths: ['.github/workflows/diagnose-33065.yml']
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify application baseline is untouched
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only a6bd91534c0d29d9be3e09b2f3f1dc9231687552 HEAD -- app)"
      - name: Reuse exact guarded transformation
        shell: bash
        run: |
          set -euo pipefail
          awk '/python3 - <<'\''PY'\''/{flag=1;next} /^          PY$/{flag=0} flag{sub(/^          /,""); print}' .github/workflows/apply-33065-search-notification-routes.yml > /tmp/apply33065.py
          python3 /tmp/apply33065.py
      - name: Capture focused compiler and test output
        id: gradle
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest \
            --tests 'fr.neamar.kiss.SearchLaunchReturnStateTest' \
            --tests 'fr.neamar.kiss.LauncherHomeLifecycleStateTest' \
            --tests 'fr.neamar.kiss.forwarder.VerticalCardViewportPolicyTest' \
            --tests 'fr.neamar.kiss.forwarder.VerticalCardUserScrollGesturePolicyTest' \
            --stacktrace 2>&1 | tee /tmp/gradle-33065.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/gradle-33065-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-33065-diagnostic
          path: |
            /tmp/gradle-33065.log
            /tmp/gradle-33065-exit.txt
          retention-days: 1
