name: Publish signed production APK

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full source commit to build
        required: true
        type: string
        default: '509ac6eb0c720a12b2e05e9e05b46872f407d101'
      version:
        description: Release version without the v prefix
        required: true
        type: string
        default: '3.30.110'
      version_code:
        description: Android versionCode
        required: true
        type: string
        default: '538'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-signed-release.yml'

permissions:
  contents: write

concurrency:
  group: smart-s-signed-production-release
  cancel-in-progress: false

jobs:
  sign-and-publish:
    name: Build, sign, verify, and publish production APK
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit || '509ac6eb0c720a12b2e05e9e05b46872f407d101' }}
      RELEASE_VERSION: ${{ inputs.version || '3.30.110' }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code || '538' }}
      EXPECTED_CERT_SHA256: 9da351d1880aee204832325b32bbe99f39f2b2b3dc178ec0e5d99d26ac236b53
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build unsigned production APK
        shell: bash
        run: bash ./gradlew assembleRelease --stacktrace

      - name: Sign and verify production APK
        shell: bash
        env:
          SMART_S_SIGNING_KEY_B64: ${{ secrets.SMART_S_SIGNING_KEY_B64 }}
          SMART_S_SIGNING_STORE_PASSWORD: ${{ secrets.SMART_S_SIGNING_STORE_PASSWORD }}
          SMART_S_SIGNING_KEY_ALIAS: ${{ secrets.SMART_S_SIGNING_KEY_ALIAS }}
          SMART_S_SIGNING_KEY_PASSWORD: ${{ secrets.SMART_S_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/smart-s-launcher-release.p12"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="smart-s-launcher-${RELEASE_VERSION}.apk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          trap 'rm -f "$KEYSTORE"' EXIT

          test -f "$UNSIGNED_APK"
          "$SDKMANAGER" "build-tools;34.0.0" >/dev/null
          printf '%s' "$SMART_S_SIGNING_KEY_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$SMART_S_SIGNING_KEY_ALIAS" \
            --ks-pass env:SMART_S_SIGNING_STORE_PASSWORD \
            --key-pass env:SMART_S_SIGNING_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK"
          ACTUAL_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256"

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$SIGNED_APK" | head -n 1)"
          grep -F "name='com.tbzmike.smartslauncher'" <<<"$BADGING"
          grep -F "versionCode='${RELEASE_VERSION_CODE}'" <<<"$BADGING"
          grep -F "versionName='${RELEASE_VERSION}'" <<<"$BADGING"
          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

      - name: Publish signed APK to the existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "v${RELEASE_VERSION}" "$SIGNED_APK" --clobber
          gh release view "v${RELEASE_VERSION}" --json assets --jq '.assets[].name' | grep -Fx "$SIGNED_APK"

      - name: Preserve signed APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: smart-s-launcher-${{ env.RELEASE_VERSION }}-signed
          path: ${{ env.SIGNED_APK }}
          archive: false
