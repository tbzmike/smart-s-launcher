name: Refine Smart S 3.30.76 scroll performance

on:
  push:
    branches:
      - fix/3.30.76-scroll-icon-performance-v2
    paths:
      - .github/scripts/refine_33076_scroll_performance.py
      - .github/workflows/refine-33076-scroll-performance.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Apply guarded source patch
        run: |
          set -euxo pipefail
          python3 .github/scripts/refine_33076_scroll_performance.py
          git diff --check

      - name: Verify intended performance wiring
        run: |
          set -euxo pipefail
          grep -q 'versionCode 504' app/build.gradle
          grep -q 'versionName "3.30.76"' app/build.gradle
          grep -q 'normalize it back to LinearLayout.LayoutParams' app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java
          grep -q 'firstWheelChildNear' app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java
          grep -q 'verifiedGroupSnapshots(context)' app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java
          grep -q 'smart-s-notification-reconcile' app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java
          grep -q 'smart-s-media-history' app/src/main/java/fr/neamar/kiss/notification/MediaHistoryCoordinator.java
          grep -q 'smart-s-notification-visual' app/src/main/java/fr/neamar/kiss/notification/NotificationVisualSupport.java
          grep -q 'activeTransformStyle' app/src/main/java/fr/neamar/kiss/ui/SmartScrollAnimationController.java
          grep -q 'themedBackground' app/src/main/java/fr/neamar/kiss/utils/AppIconMemoryCache.java
          for style in focus depth wave slide stack zoom tilt cascade flip whirl orbit elastic bounce helix fan; do
            grep -q "case \"$style\"" app/src/main/java/fr/neamar/kiss/ui/SmartScrollAnimationController.java
          done

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify APK manifest version
        run: |
          set -euxo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='504'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.76'" /tmp/apk-badging.txt

      - name: Commit verified source changes
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java \
            app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java \
            app/src/main/java/fr/neamar/kiss/notification/MediaHistoryCoordinator.java \
            app/src/main/java/fr/neamar/kiss/notification/NotificationVisualSupport.java
          git commit -m 'Fix wheel crash and remove scrolling hot-path scans'
          git push origin HEAD:fix/3.30.76-scroll-icon-performance-v2
