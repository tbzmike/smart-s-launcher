name: Apply 3.30.100 search removal patch

on:
  push:
    branches:
      - fix/3.30.100-search-remove-item

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.100-search-remove-item
          fetch-depth: 0

      - name: Verify source baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 6c04382c441d3e215f67721f5fee60e215c798c3 -- app/build.gradle app/src/main/java/fr/neamar/kiss/result/Result.java
          grep -F 'versionCode 527' app/build.gradle
          grep -F 'versionName "3.30.99"' app/build.gradle
          grep -F 'if (isShowingHistory() && !UiEditLock.isLocked(context)) {' app/src/main/java/fr/neamar/kiss/result/Result.java

      - name: Apply targeted source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          result_path = Path('app/src/main/java/fr/neamar/kiss/result/Result.java')
          text = result_path.read_text()

          old_condition = 'isShowingHistory() && !UiEditLock.isLocked(context)'
          new_condition = 'supportsUnlockedRemovalMenu() && !UiEditLock.isLocked(context)'
          if text.count(old_condition) != 1:
              raise SystemExit(f'Expected menu condition once, found {text.count(old_condition)}')
          text = text.replace(old_condition, new_condition, 1)

          old_helper = 'private boolean isShowingHistory() {\n        return SearchHandler.getInstance().getLastSearchType() == Searcher.Type.HISTORY;\n    }'
          new_helper = 'private boolean supportsUnlockedRemovalMenu() {\n        Searcher.Type type = SearchHandler.getInstance().getLastSearchType();\n        return type == Searcher.Type.HISTORY || type == Searcher.Type.QUERY;\n    }'
          if text.count(old_helper) != 1:
              raise SystemExit(f'Expected history helper once, found {text.count(old_helper)}')
          text = text.replace(old_helper, new_helper, 1)
          result_path.write_text(text)

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text()
          replacements = {
              '// Smart S Launcher 3.30.99 - universal unlocked long-press History item removal':
                  '// Smart S Launcher 3.30.100 - unlocked Remove item menu in History and Search',
              'versionCode 527': 'versionCode 528',
              'versionName "3.30.99"': 'versionName "3.30.100"',
          }
          for old, new in replacements.items():
              if gradle.count(old) != 1:
                  raise SystemExit(f'Expected version token once: {old!r}; found {gradle.count(old)}')
              gradle = gradle.replace(old, new, 1)
          gradle_path.write_text(gradle)
          PY

      - name: Verify intended diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = $'app/build.gradle\napp/src/main/java/fr/neamar/kiss/result/Result.java'
          grep -F 'if (supportsUnlockedRemovalMenu() && !UiEditLock.isLocked(context)) {' app/src/main/java/fr/neamar/kiss/result/Result.java
          grep -F 'return type == Searcher.Type.HISTORY || type == Searcher.Type.QUERY;' app/src/main/java/fr/neamar/kiss/result/Result.java
          grep -F 'versionCode 528' app/build.gradle
          grep -F 'versionName "3.30.100"' app/build.gradle
          if grep -Fq 'private boolean isShowingHistory()' app/src/main/java/fr/neamar/kiss/result/Result.java; then
            echo 'Old helper still present' >&2
            exit 1
          fi

      - name: Commit source changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-330100-search-remove.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/result/Result.java
          git diff --cached --check
          git commit -m 'Show Remove item in unlocked search results (3.30.100)'
          git push origin HEAD:fix/3.30.100-search-remove-item
