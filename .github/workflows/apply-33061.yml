name: Guarded 3.30.61 bottom-anchor repair
on:
  push:
    branches: [fix/3.30.61-bottom-anchor]
    paths: ['.github/workflows/apply-33061.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.61-bottom-anchor
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Apply exact guarded edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: guarded match count {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          smart='app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java'
          r(smart,'        deferredRefreshIdlePolicy.request(scroller == null ? 0 : scroller.getScrollY());\n','        deferredRefreshIdlePolicy.request(\n                scroller == null ? 0 : scroller.getScrollY(), isAtBottom());\n')
          r(smart,'    void rebuildImmediately() {\n','    boolean consumeDeferredKeepBottom() {\n        return deferredRefreshIdlePolicy.consumeKeepBottom();\n    }\n\n    private boolean isAtBottom() {\n        if (scroller == null || column == null || column.getChildCount() == 0) return true;\n        View content = scroller.getChildAt(0);\n        if (content == null) return true;\n        int viewportHeight = Math.max(0, scroller.getHeight()\n                - scroller.getPaddingTop() - scroller.getPaddingBottom());\n        int maxScrollY = Math.max(0, content.getHeight() - viewportHeight);\n        return maxScrollY - scroller.getScrollY() <= dp(6);\n    }\n\n    void rebuildImmediately() {\n')
          vp='app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportController.java'
          r(vp,'    /** Restore after the card rebuild and all synchronous decorators have been queued. */\n','    /** Preserve a bottom edge captured when the deferred data change first arrived. */\n    void forceBottomForNextRebuild() {\n        policy.requestBottomOnNextRebuild();\n    }\n\n    /** Restore after the card rebuild and all synchronous decorators have been queued. */\n')
          pol='app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicy.java'
          r(pol,'    void requestImmediateBottom() {\n        immediateBottomPending = true;\n    }\n','    void requestImmediateBottom() {\n        immediateBottomPending = true;\n    }\n\n    void requestBottomOnNextRebuild() {\n        forceBottomOnNextRebuild = true;\n    }\n')
          mgr='app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java'
          r(mgr,'        verticalCardViewportController.beforeDataSetChanged();\n        if (!smartCardListForwarder.rebuildPendingDataSetRefresh()) return;\n','        if (smartCardListForwarder.consumeDeferredKeepBottom()) {\n            verticalCardViewportController.forceBottomForNextRebuild();\n        }\n        verticalCardViewportController.beforeDataSetChanged();\n        if (!smartCardListForwarder.rebuildPendingDataSetRefresh()) return;\n')
          test='app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicyTest.java'
          r(test,'    @Test\n    void homeIsImmediateAndDoesNotArmAnUnrelatedFutureRefresh() {','    @Test\n    void deferredBottomIntentPinsExactlyTheNextRebuild() {\n        VerticalCardViewportPolicy policy = settledPolicy();\n        policy.requestBottomOnNextRebuild();\n        assertThat(policy.shouldBottomRebuild(), is(true));\n        applyBottomRebuild(policy);\n        assertThat(policy.shouldBottomRebuild(), is(false));\n        assertThat(policy.shouldPinGeometry(), is(false));\n    }\n\n    @Test\n    void homeIsImmediateAndDoesNotArmAnUnrelatedFutureRefresh() {')
          gradle='app/build.gradle'
          r(gradle,'// Smart S Launcher 3.30.60 - coherent Vertical Cards refresh and scroll stability\n        versionCode 488\n        versionName "3.30.60"','// Smart S Launcher 3.30.61 - preserve bottom anchor through deferred history refresh\n        versionCode 489\n        versionName "3.30.61"')
          PY
      - name: Verify working edits only
        run: |
          expected="$(printf '%s\n' app/build.gradle app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportController.java app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicy.java app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicyTest.java | sort)"
          actual="$(git status --porcelain | awk '{print $2}' | grep -v '^.github/workflows/apply-33061.yml$' | sort)"
          test "$actual" = "$expected"
          grep -q 'versionName "3.30.61"' app/build.gradle
          grep -q 'consumeDeferredKeepBottom' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
      - name: Focused tests
        run: bash ./gradlew testDebugUnitTest --tests 'fr.neamar.kiss.forwarder.VerticalCardRefreshIdlePolicyTest' --tests 'fr.neamar.kiss.forwarder.VerticalCardViewportPolicyTest' --stacktrace
      - name: Full verification
        run: bash ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify final diff against exact green 3.30.60
        run: |
          rm .github/workflows/apply-33061.yml
          expected="$(printf '%s\n' app/build.gradle app/src/main/java/fr/neamar/kiss/forwarder/ForwarderManager.java app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardRefreshIdlePolicy.java app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportController.java app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicy.java app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardRefreshIdlePolicyTest.java app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardViewportPolicyTest.java | sort)"
          actual="$(git diff --name-only 48f8886252f4910067774bea2d2483d2953b1148 -- | grep -v '^.github/workflows/apply-33061.yml$' | sort)"
          test "$actual" = "$expected"
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Vertical Cards anchored at bottom in 3.30.61'
          git push origin HEAD:fix/3.30.61-bottom-anchor
