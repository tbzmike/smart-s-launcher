name: Verify search latency 3.30.09

on:
  push:
    branches:
      - build/3.30.09

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message != 'Improve search first-result latency and cancellation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.09
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Apply guarded source patch
        run: python3 .github/search_latency_33009.py
      - name: Verify intended source state
        run: |
          grep -q 'versionCode 437' app/build.gradle
          grep -q 'versionName "3.30.09"' app/build.gradle
          grep -q 'publishCurrentResults' app/src/main/java/fr/neamar/kiss/searcher/Searcher.java
          grep -q 'semanticEnabled && !lexicalIds.isEmpty() && !isCancelled()' app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java
          grep -q 'SearchHandler.getInstance().cancelSearch();' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -q 'smart-detect-frozen-apps' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          grep -q 'smart-keep-frozen-searchable' app/src/main/java/fr/neamar/kiss/dataprovider/AppProvider.java
          git diff --check
      - name: Full Android verification
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify APK version
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "versionCode='437'" /tmp/apk-badging.txt
          grep -q "versionName='3.30.09'" /tmp/apk-badging.txt
      - name: Commit verified production source
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/fr/neamar/kiss/searcher/Searcher.java \
            app/src/main/java/fr/neamar/kiss/searcher/QuerySearcher.java \
            app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          git diff --cached --check
          git commit -m 'Improve search first-result latency and cancellation'
          git push origin HEAD:build/3.30.09
