name: One-time history dedup verification patch

on:
  push:
    branches:
      - feature/3.30.44-in-app-updater

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ !contains(github.event.head_commit.message, 'Avoid duplicate launch history inserts') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/3.30.44-in-app-updater
          fetch-depth: 0
      - name: Remove only duplicate pre-launch history writes
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''            RecentLaunchTracker.remember(result.getPojo());\n            recordExplicitSelection(v.getContext(), result.getPojo());\n            promoteHistoryResult(result);\n            result.launch(v.getContext(), v, parent);''',
                  '''            RecentLaunchTracker.remember(result.getPojo());\n            promoteHistoryResult(result);\n            result.launch(v.getContext(), v, parent);'''
              ),
              (
                  '''            final Result<?> result = getItem(position);\n            RecentLaunchTracker.remember(result.getPojo());\n            recordExplicitSelection(v.getContext(), result.getPojo());\n            promoteHistoryResult(result);''',
                  '''            final Result<?> result = getItem(position);\n            RecentLaunchTracker.remember(result.getPojo());\n            promoteHistoryResult(result);'''
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exact pre-launch pattern once; found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify intended diff only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java'
          git diff --check
          grep -n -A6 -B2 'public void onClick' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          grep -n -A8 -B2 'openExactTarget' app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java
          git commit -m "Avoid duplicate launch history inserts"
          git push origin HEAD:feature/3.30.44-in-app-updater
