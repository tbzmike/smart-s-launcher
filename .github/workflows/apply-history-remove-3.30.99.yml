name: Apply 3.30.99 History Remove Item

on:
  push:
    branches:
      - fix/3.30.99-history-remove-item

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply 3.30.99 history remove-item patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.99-history-remove-item
          fetch-depth: 0

      - name: Apply verified targeted patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Unlocked notification history rows must use the same long-press action menu as every other row.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java',
              '''        if (result.getPojo() instanceof NotificationPojo
                  && NotificationHistoryResolver.showForPojo(context, result.getPojo())) {
              return;
          }
          if (UiEditLock.isLocked(context)) {''',
              '''        if (UiEditLock.isLocked(context)) {''')

          # 2) Make Remove item universal for History while keeping a lock guard both when showing and executing it.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/result/Result.java',
              '''import fr.neamar.kiss.normalizer.StringNormalizer;
          import fr.neamar.kiss.pojo.AppPojo;''',
              '''import fr.neamar.kiss.normalizer.StringNormalizer;
          import fr.neamar.kiss.notification.NotificationTimelineState;
          import fr.neamar.kiss.pojo.AppPojo;''')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/result/Result.java',
              '''import fr.neamar.kiss.pojo.TagDummyPojo;
          import fr.neamar.kiss.searcher.QueryInterface;''',
              '''import fr.neamar.kiss.pojo.TagDummyPojo;
          import fr.neamar.kiss.preference.UiEditLock;
          import fr.neamar.kiss.searcher.QueryInterface;''')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/result/Result.java',
              '''        ArrayAdapter<ListPopup.Item> popupMenuAdapter = new ArrayAdapter<>(context, R.layout.popup_list_item);
          buildPopupMenu(context, popupMenuAdapter);''',
              '''        ArrayAdapter<ListPopup.Item> popupMenuAdapter = new ArrayAdapter<>(context, R.layout.popup_list_item);
          if (isShowingHistory() && !UiEditLock.isLocked(context)) {
              popupMenuAdapter.add(new ListPopup.Item(context, R.string.menu_remove));
          }
          buildPopupMenu(context, popupMenuAdapter);''')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/result/Result.java',
              '''        if (canRemoveFromHistory(context) && isShowingHistory()) {
              adapter.add(new ListPopup.Item(context, R.string.menu_remove));
          }
          if (isAllowedAsFavorite()) {''',
              '''        if (isAllowedAsFavorite()) {''')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/result/Result.java',
              '''        if (stringId == R.string.menu_remove) {
              removeFromResultsAndHistory(context, parent);
              return true;''',
              '''        if (stringId == R.string.menu_remove) {
              if (UiEditLock.isLocked(context)) return true;
              removeFromResultsAndHistory(context, parent);
              return true;''')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/result/Result.java',
              '''    void removeFromHistory(Context context) {
          DBHelper.removeFromHistory(context, pojo.getHistoryId());
      }''',
              '''    void removeFromHistory(Context context) {
          if (pojo instanceof NotificationPojo) {
              NotificationPojo notification = (NotificationPojo) pojo;
              NotificationTimelineState.hideFromHistory(
                      context, notification.exactNotificationId, notification.postTime);
          }
          DBHelper.removeFromHistory(context, pojo.getHistoryId());
      }''')

          # 3) Persist removal of the exact live notification event without dismissing Android's notification.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/notification/NotificationTimelineState.java',
              '''    private static final String READ_PREFIX = "read|";
      private static final String LAST_SCAN = "_last_persisted_scan";''',
              '''    private static final String READ_PREFIX = "read|";
      private static final String HIDDEN_HISTORY_PREFIX = "hidden-history|";
      private static final String LAST_SCAN = "_last_persisted_scan";''')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/notification/NotificationTimelineState.java',
              '''    public static boolean isUnread(Context context, String notificationId) {
          if (notificationId == null
                  || !notificationId.startsWith(NotificationListener.NOTIFICATION_SCHEME)
                  || !NotificationListener.isNotificationActive(context, notificationId)) {
              return false;
          }
          SharedPreferences p = prefs(context);
          long post = p.getLong(POST_PREFIX + notificationId, 0L);
          if (post <= 0L) return true;
          return p.getLong(READ_PREFIX + notificationId, Long.MIN_VALUE) < post;
      }

      public static long getLastPersistedScan(Context context) {''',
              '''    public static boolean isUnread(Context context, String notificationId) {
          if (notificationId == null
                  || !notificationId.startsWith(NotificationListener.NOTIFICATION_SCHEME)
                  || !NotificationListener.isNotificationActive(context, notificationId)) {
              return false;
          }
          SharedPreferences p = prefs(context);
          long post = p.getLong(POST_PREFIX + notificationId, 0L);
          if (post <= 0L) return true;
          return p.getLong(READ_PREFIX + notificationId, Long.MIN_VALUE) < post;
      }

      /** Hide only this exact notification post from launcher History; do not dismiss Android's notification. */
      public static void hideFromHistory(Context context, String notificationId, long postTime) {
          if (notificationId == null || notificationId.isEmpty() || postTime <= 0L) return;
          prefs(context).edit().putLong(HIDDEN_HISTORY_PREFIX + notificationId, postTime).apply();
      }

      /** A newer/reposted notification with the same Android key is a new History item and is not hidden. */
      public static boolean isHiddenFromHistory(Context context, String notificationId, long postTime) {
          if (notificationId == null || notificationId.isEmpty() || postTime <= 0L) return false;
          return prefs(context).getLong(HIDDEN_HISTORY_PREFIX + notificationId, Long.MIN_VALUE) == postTime;
      }

      public static long getLastPersistedScan(Context context) {''')

          # 4) Filter exact removed live-notification posts during every authoritative History rebuild.
          replace_once(
              'app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java',
              '''import fr.neamar.kiss.notification.NotificationListener;
          import fr.neamar.kiss.pojo.AppPojo;''',
              '''import fr.neamar.kiss.notification.NotificationListener;
          import fr.neamar.kiss.notification.NotificationTimelineState;
          import fr.neamar.kiss.pojo.AppPojo;''')
          replace_once(
              'app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java',
              '''        List<NotificationPojo> newestFirst = new NotificationProvider(activity).getPojos();
          if (newestFirst.isEmpty()) return;
          if (newestFirst.size() > max) {
              newestFirst = new ArrayList<>(newestFirst.subList(0, max));
          } else {
              newestFirst = new ArrayList<>(newestFirst);
          }
          newestFirst.sort(Comparator.comparingLong(p -> p.postTime));''',
              '''        List<NotificationPojo> newestFirst = new ArrayList<>(
                  new NotificationProvider(activity).getPojos());
          newestFirst.removeIf(notification -> NotificationTimelineState.isHiddenFromHistory(
                  activity, notification.exactNotificationId, notification.postTime));
          if (newestFirst.isEmpty()) return;
          if (newestFirst.size() > max) {
              newestFirst = new ArrayList<>(newestFirst.subList(0, max));
          }
          newestFirst.sort(Comparator.comparingLong(p -> p.postTime));''')

          # 5) User-facing label and version bump.
          replace_once(
              'app/src/main/res/values/strings.xml',
              '<string name="menu_remove">Remove from history</string>',
              '<string name="menu_remove">Remove item</string>')
          replace_once(
              'app/build.gradle',
              '''        // Smart S Launcher 3.30.98 - prefer the live exact notification route before retained fallbacks
          versionCode 526
          versionName "3.30.98"''',
              '''        // Smart S Launcher 3.30.99 - universal unlocked long-press History item removal
          versionCode 527
          versionName "3.30.99"''')

          # Source-level invariants: the locked guard remains, the action is universal, and old features stay untouched.
          record = Path('app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java').read_text()
          result = Path('app/src/main/java/fr/neamar/kiss/result/Result.java').read_text()
          history = Path('app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java').read_text()
          timeline = Path('app/src/main/java/fr/neamar/kiss/notification/NotificationTimelineState.java').read_text()
          gradle = Path('app/build.gradle').read_text()
          assert 'if (UiEditLock.isLocked(context)) {' in record
          assert 'NotificationHistoryResolver.showForPojo(context, result.getPojo());' in record
          assert 'isShowingHistory() && !UiEditLock.isLocked(context)' in result
          assert 'if (UiEditLock.isLocked(context)) return true;' in result
          assert 'NotificationTimelineState.hideFromHistory' in result
          assert 'NotificationTimelineState.isHiddenFromHistory' in history
          assert 'HIDDEN_HISTORY_PREFIX' in timeline
          assert 'versionCode 527' in gradle and 'versionName "3.30.99"' in gradle
          PY

      - name: Review only intended source changes
        run: |
          git diff --check
          git diff -- app/src/main/java/fr/neamar/kiss/adapter/RecordAdapter.java \
                     app/src/main/java/fr/neamar/kiss/result/Result.java \
                     app/src/main/java/fr/neamar/kiss/notification/NotificationTimelineState.java \
                     app/src/main/java/fr/neamar/kiss/searcher/HistorySearcher.java \
                     app/src/main/res/values/strings.xml app/build.gradle

      - name: Commit source patch and remove temporary workflow
        run: |
          rm .github/workflows/apply-history-remove-3.30.99.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement universal history item removal"
          git push origin HEAD:fix/3.30.99-history-remove-item
