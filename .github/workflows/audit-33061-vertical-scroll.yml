name: Audit 3.30.61 Vertical Cards scroll writers

on:
  push:
    branches:
      - fix/3.30.61-vertical-cards-passive-anchor

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact 3.30.60 application baseline
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD^)" = "48f8886252f4910067774bea2d2483d2953b1148"
          grep -q 'versionName "3.30.60"' app/build.gradle

      - name: Audit every source-level scroll position writer
        shell: bash
        run: |
          set -o pipefail
          echo '=== DIRECT SCROLL/SELECTION WRITERS ==='
          git grep -nE '\.(scrollTo|scrollBy|smoothScrollTo|smoothScrollBy|fullScroll|setSelection|setSelectionFromTop)\(' -- 'app/src/main/java/**/*.java' || true
          echo '=== FOCUS WRITERS THAT MAY IMPLICITLY SCROLL ==='
          git grep -nE '\.(requestFocus|requestChildFocus|bringToFront|requestRectangleOnScreen)\(' -- 'app/src/main/java/**/*.java' || true
          echo '=== VERTICAL CARDS SCROLLER REFERENCES ==='
          git grep -nE '(getScroller\(|StableCardScrollView|VerticalCardViewportController)' -- 'app/src/main/java/**/*.java' || true

      - name: Audit every Vertical Cards delayed geometry mutation
        shell: bash
        run: |
          set -o pipefail
          echo '=== ASYNC/POSTED WORK IN VERTICAL CARD COMPONENTS ==='
          git grep -nE '(postDelayed|postOnAnimation|\.post\(|runOnUiThread|AsyncTask|Executor|execute\()' -- 'app/src/main/java/fr/neamar/kiss/forwarder/Vertical*.java' 'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java' || true
          echo '=== GEOMETRY/STRUCTURE MUTATIONS IN VERTICAL CARD COMPONENTS ==='
          git grep -nE '(addView\(|removeView|removeAllViews|setLayoutParams|setVisibility|setText\()' -- 'app/src/main/java/fr/neamar/kiss/forwarder/Vertical*.java' 'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java' || true

      - name: Audit viewport protection calls
        shell: bash
        run: |
          set -o pipefail
          echo '=== CAPTURE/RESTORE CALLERS ==='
          git grep -nE '(beforeDataSetChanged|afterDataSetChanged|captureForContentMutation|restoreAfterContentMutation|scheduleRestore|scrollToBottom)' -- 'app/src/main/java/**/*.java' || true
