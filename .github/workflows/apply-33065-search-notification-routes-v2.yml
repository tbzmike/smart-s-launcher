name: Guarded 3.30.65 search return and durable notification routes v2
on:
  push:
    branches: [fix/3.30.65-search-notification-routes]
    paths: ['.github/workflows/apply-33065-search-notification-routes-v2.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact untouched application baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only a6bd91534c0d29d9be3e09b2f3f1dc9231687552 HEAD -- app)"
          grep -Fq 'versionName "3.30.64"' app/build.gradle
          grep -Fq 'private final VerticalCardUserScrollGesturePolicy userScrollGesturePolicy' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
      - name: Reuse exact first guarded transformation
        shell: bash
        run: |
          set -euo pipefail
          awk '/python3 - <<'\''PY'\''/{flag=1;next} /^          PY$/{flag=0} flag{sub(/^          /,""); print}' \
            .github/workflows/apply-33065-search-notification-routes.yml > /tmp/apply33065.py
          python3 /tmp/apply33065.py
      - name: Apply only verified compile corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count}, found {found}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          path = 'app/src/main/java/fr/neamar/kiss/db/SmartStateStore.java'
          patch(path,
                '''        values.put("user_serial", userSerial);\n        values.put("route_uri", routeUri == null ? "" : routeUri);\n        SQLiteDatabase database = db(context);''',
                '''        values.put("user_serial", userSerial);\n        SQLiteDatabase database = db(context);''')

          path = 'app/src/main/java/fr/neamar/kiss/appusage/AppUsagePackageReceiver.java'
          patch(path,
                'import android.content.pm.PackageManager;\n',
                'import android.content.pm.PackageManager;\nimport android.content.pm.ResolveInfo;\n')
          patch(path,
                '''                    info.lastUpdateTime,\n                    install.source,\n                    install.sourceUri));''',
                '''                    info.lastUpdateTime,\n                    install.installerPackage,\n                    install.source,\n                    install.sourceUri));''')
          patch(path,
                '''        String sourceUri = "com.android.vending".equals(installer)\n                ? "https://play.google.com/store/apps/details?id=" + packageName : null;\n        return new InstallMeta(source, sourceUri);\n    }\n\n    private static String packageSourceLabel(int source) {''',
                '''        String sourceUri = verifiedStorePageUri(pm, installer, packageName);\n        return new InstallMeta(installer, source, sourceUri);\n    }\n\n    private static String verifiedStorePageUri(PackageManager pm, String installer,\n                                               String packageName) {\n        if (TextUtils.isEmpty(installer)) return null;\n        String market = "market://details?id=" + Uri.encode(packageName);\n        if (resolvesToInstaller(pm, installer, market)) return market;\n        if ("com.android.vending".equals(installer)) {\n            return "https://play.google.com/store/apps/details?id=" + Uri.encode(packageName);\n        }\n        return null;\n    }\n\n    private static boolean resolvesToInstaller(PackageManager pm, String installer, String uri) {\n        try {\n            Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(uri)).setPackage(installer);\n            ResolveInfo resolved = pm.resolveActivity(intent, PackageManager.MATCH_DEFAULT_ONLY);\n            return resolved != null && resolved.activityInfo != null\n                    && TextUtils.equals(installer, resolved.activityInfo.packageName);\n        } catch (RuntimeException e) {\n            return false;\n        }\n    }\n\n    private static String packageSourceLabel(int source) {''')
          patch(path,
                '''    private static final class InstallMeta {\n        final String source;\n        final String sourceUri;\n        InstallMeta(String source, String sourceUri) {\n            this.source = source;\n            this.sourceUri = sourceUri;\n        }\n    }''',
                '''    private static final class InstallMeta {\n        final String installerPackage;\n        final String source;\n        final String sourceUri;\n        InstallMeta(String installerPackage, String source, String sourceUri) {\n            this.installerPackage = installerPackage;\n            this.source = source;\n            this.sourceUri = sourceUri;\n        }\n    }''')
          PY
      - name: Verify exact corrected source scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --short | sed -E 's/^.. //' | grep '^app/' | sort)
          printf '%s\n' "${files[@]}"
          allowed='^(app/build.gradle|app/src/main/java/fr/neamar/kiss/(MainActivity.java|NotificationHistoryActivity.java|SearchLaunchReturnState.java|AppUsageActivity.java|appusage/AppUsageStore.java|appusage/AppUsageSync.java|appusage/AppUsagePackageReceiver.java|db/DB.java|db/NotificationHistoryRecord.java|db/NotificationTimelineStore.java|db/SmartStateStore.java|forwarder/ForwarderManager.java|forwarder/SmartCardListForwarder.java|notification/NotificationListener.java|result/SettingsResult.java|ui/RichNotificationHistoryDialog.java|utils/AppLaunchUtils.java|utils/AppReinstallSupport.java|utils/NotificationHistoryResolver.java|utils/SavedNotificationDestinationResolver.java)|app/src/test/java/fr/neamar/kiss/SearchLaunchReturnStateTest.java)$'
          for f in "${files[@]}"; do [[ "$f" =~ $allowed ]] || { echo "Unexpected app file: $f"; exit 1; }; done
          test ${#files[@]} -eq 22
          grep -Fq 'versionCode 493' app/build.gradle
          grep -Fq 'versionName "3.30.65"' app/build.gradle
          grep -Fq 'values.put("route_uri", routeUri == null ? "" : routeUri);' app/src/main/java/fr/neamar/kiss/db/SmartStateStore.java
          test "$(grep -Fc 'values.put("route_uri", routeUri == null ? "" : routeUri);' app/src/main/java/fr/neamar/kiss/db/SmartStateStore.java)" -eq 1
          grep -Fq 'install.installerPackage' app/src/main/java/fr/neamar/kiss/appusage/AppUsagePackageReceiver.java
          grep -Fq 'installer_package' app/src/main/java/fr/neamar/kiss/appusage/AppUsageStore.java
          grep -Fq 'forceHistoryRebuildOnNextDataSetChange' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -Fq 'capturePublishedShortcutRoute' app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java
          grep -Fq 'APP_NOT_INSTALLED' app/src/main/java/fr/neamar/kiss/utils/SavedNotificationDestinationResolver.java
      - name: Focused search return and viewport tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests 'fr.neamar.kiss.SearchLaunchReturnStateTest'
          --tests 'fr.neamar.kiss.LauncherHomeLifecycleStateTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardViewportPolicyTest'
          --tests 'fr.neamar.kiss.forwarder.VerticalCardUserScrollGesturePolicyTest'
          --stacktrace
      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Remove all temporary 3.30.65 workflows and verify source-only final diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-33065-search-notification-routes.yml
          rm .github/workflows/diagnose-33065.yml
          rm .github/workflows/apply-33065-search-notification-routes-v2.yml
          test ! -e .github/workflows/apply-33065-search-notification-routes.yml
          test ! -e .github/workflows/diagnose-33065.yml
          test ! -e .github/workflows/apply-33065-search-notification-routes-v2.yml
          mapfile -t final_files < <({ git diff --name-only a6bd91534c0d29d9be3e09b2f3f1dc9231687552 -- app; git ls-files --others --exclude-standard app; } | sort -u)
          printf '%s\n' "${final_files[@]}"
          test ${#final_files[@]} -eq 22
          grep -Fq 'versionName "3.30.65"' app/build.gradle
      - name: Commit only verified 3.30.65 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix search return and persist verified notification routes in 3.30.65'
          git push origin HEAD:fix/3.30.65-search-notification-routes
