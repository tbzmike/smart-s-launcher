name: One-shot history recency wiring fix

on:
  push:
    branches:
      - build/3.30.03
    paths:
      - .github/workflows/one-shot-history-recency-fix.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.03
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Patch the verified shared history launch path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/fr/neamar/kiss/result/Result.java')
          source = path.read_text()

          import_line = 'import fr.neamar.kiss.utils.RecentLaunchTracker;\n'
          import_anchor = 'import fr.neamar.kiss.utils.Log;\n'
          old = '''        if (canAddToHistory()) {
              KissApplication.getApplication(context).getDataHandler().addToHistory(pojo.getHistoryId());
          }'''
          new = '''        if (canAddToHistory()) {
              RecentLaunchTracker.remember(pojo);
              KissApplication.getApplication(context).getDataHandler().addToHistory(pojo.getHistoryId());
          }'''

          if import_line in source:
              raise SystemExit('RecentLaunchTracker import unexpectedly already present')
          if source.count(import_anchor) != 1:
              raise SystemExit('Expected exactly one import anchor')
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one history recording block')

          source = source.replace(import_anchor, import_anchor + import_line, 1)
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Verify the intended source wiring before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/fr/neamar/kiss/result/Result.java').read_text()
          assert source.count('import fr.neamar.kiss.utils.RecentLaunchTracker;') == 1
          assert source.count('RecentLaunchTracker.remember(pojo);') == 1
          assert source.index('RecentLaunchTracker.remember(pojo);') < source.index('getDataHandler().addToHistory(pojo.getHistoryId())')
          PY
          git diff --check
          git diff -- app/src/main/java/fr/neamar/kiss/result/Result.java

      - name: Run lint, unit tests, and build both APK variants
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Commit only the verified source fix and remove this one-shot workflow
        run: |
          git config user.name 'tbzmike'
          git config user.email '40115947+tbzmike@users.noreply.github.com'
          git rm .github/workflows/one-shot-history-recency-fix.yml
          git add app/src/main/java/fr/neamar/kiss/result/Result.java
          git diff --cached --check
          git commit -m 'Wire history click identity into recency reorder'
          git push origin HEAD:build/3.30.03
