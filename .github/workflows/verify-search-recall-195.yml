name: Verify instant search recall 3.30.195

on:
  push:
    branches:
      - fix/3.30.195-instant-search-recall

jobs:
  android:
    name: Persisted search recall on Android ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Enable hardware acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify actual SQLite upgrade, persistence, eviction and reset
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eu
            # Match the working 3.30.194 test setup; only emulator APKs are unminified.
            sed -i 's/minifyEnabled true/minifyEnabled false/g; s/shrinkResources = true/shrinkResources = false/g' app/build.gradle
            bash ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class fr.neamar.kiss.db.SearchRecallDatabase195RegressionTest com.tbzmike.smartslauncher.debug.test/androidx.test.runner.AndroidJUnitRunner | tee search-recall-195.log
            grep -F 'OK (2 tests)' search-recall-195.log
            grep -F 'INSTRUMENTATION_CODE: -1' search-recall-195.log
      - name: Upload result XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: search-recall-api-${{ matrix.api }}
          path: app/build/outputs/androidTest-results
          archive: true
          if-no-files-found: ignore
