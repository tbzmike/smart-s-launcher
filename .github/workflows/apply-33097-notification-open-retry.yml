name: Refine 3.30.97 notification open retry

on:
  push:
    branches:
      - fix/3.30.97-notification-open-retry

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refine retry placement and verify anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          listener_path = Path('app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java')
          listener = listener_path.read_text(encoding='utf-8')

          public_old = '''        long expectedPostTime = activePostTime > 0L ? activePostTime\n                : saved == null ? 0L : saved.postTime;\n        return openNotification(context, notificationId, expectedPostTime, saved);\n'''
          public_new = '''        long expectedPostTime = activePostTime > 0L ? activePostTime\n                : saved == null ? 0L : saved.postTime;\n        if (openNotification(context, notificationId, expectedPostTime, saved)) return true;\n\n        // This overload is the active-card entry point. If the card was rendered from a verified\n        // snapshot but Android disconnected the listener before the tap, preserve the user's exact\n        // open request and let the resolver's existing rebind loop retry it after verification.\n        return saved != null\n                && !isReadyForExactNotificationLookup()\n                && SavedNotificationDestinationResolver\n                .scheduleExactOpenAfterListenerReconnectIfNeeded(context, saved);\n'''
          if listener.count(public_old) != 1:
              raise SystemExit(f'NotificationListener public active-open anchor count={listener.count(public_old)}')
          listener = listener.replace(public_old, public_new, 1)

          private_old = '''        // Cached listener metadata can be cleared during process recreation or an app update while\n        // Android still holds the notification. Re-resolve the exact platform row from the stable\n        // encoded StatusBarNotification identity and post time before reporting a lost destination.\n        if (openExactActiveNotification(context, notificationId, expectedPostTime, saved)) {\n            return true;\n        }\n\n        // A card can be bound from a verified snapshot and then tapped during the short listener\n        // disconnect/rebind window. Do not fail that click immediately. Hand only the scheduling\n        // step to the resolver; calling openExact() here would recurse back into this method.\n        return saved != null\n                && !isReadyForExactNotificationLookup()\n                && SavedNotificationDestinationResolver\n                .scheduleExactOpenAfterListenerReconnectIfNeeded(context, saved);\n'''
          private_new = '''        // Cached listener metadata can be cleared during process recreation or an app update while\n        // Android still holds the notification. Re-resolve the exact platform row from the stable\n        // encoded StatusBarNotification identity and post time before reporting a lost destination.\n        return openExactActiveNotification(context, notificationId, expectedPostTime, saved);\n'''
          if listener.count(private_old) != 1:
              raise SystemExit(f'NotificationListener private synchronous-open anchor count={listener.count(private_old)}')
          listener = listener.replace(private_old, private_new, 1)
          listener_path.write_text(listener, encoding='utf-8')

          resolver_path = Path('app/src/main/java/fr/neamar/kiss/utils/SavedNotificationDestinationResolver.java')
          resolver = resolver_path.read_text(encoding='utf-8')
          resolver_old = '''    /**\n     * A package replacement can leave notification access granted while Android is still rebinding\n     * the listener. Keep the user's exact-open request pending instead of reporting that the route\n     * is missing before Android makes the active notification available again.\n     */\n    /**\n     * Queue the existing listener-reconnect retry without re-entering openExact(). Notification\n     * clicks use this only after their immediate exact-route attempts fail while listener state is\n     * unverified, so accepting the retry suppresses a premature "destination unavailable" toast.\n     */\n    public static boolean scheduleExactOpenAfterListenerReconnectIfNeeded(\n            @NonNull Context context, @Nullable NotificationHistoryRecord record) {\n        return record != null\n                && scheduleExactOpenAfterListenerReconnect(context, record);\n    }\n\n    private static boolean scheduleExactOpenAfterListenerReconnect(\n'''
          resolver_new = '''    /**\n     * Queue the existing listener-reconnect retry without re-entering openExact(). Active\n     * notification clicks use this after immediate exact-route resolution fails while listener\n     * state is unverified, suppressing a premature destination-unavailable error.\n     */\n    public static boolean scheduleExactOpenAfterListenerReconnectIfNeeded(\n            @NonNull Context context, @Nullable NotificationHistoryRecord record) {\n        return record != null\n                && scheduleExactOpenAfterListenerReconnect(context, record);\n    }\n\n    /**\n     * A package replacement can leave notification access granted while Android is still rebinding\n     * the listener. Keep the user's exact-open request pending instead of reporting that the route\n     * is missing before Android makes the active notification available again.\n     */\n    private static boolean scheduleExactOpenAfterListenerReconnect(\n'''
          if resolver.count(resolver_old) != 1:
              raise SystemExit(f'Resolver comment/wrapper anchor count={resolver.count(resolver_old)}')
          resolver_path.write_text(resolver.replace(resolver_old, resolver_new, 1), encoding='utf-8')

          shortcuts = Path('app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java').read_text(encoding='utf-8')
          if 'openNotification(context, latestActive.id)' not in shortcuts:
              raise SystemExit('ShortcutsResult is not using the bound notification id')
          if 'openLatestNotification(context, groupKey)' in shortcuts:
              raise SystemExit('ShortcutsResult still re-queries notification group at tap time')

          gradle = Path('app/build.gradle').read_text(encoding='utf-8')
          if 'versionCode 525' not in gradle or 'versionName "3.30.97"' not in gradle:
              raise SystemExit('3.30.97 version bump missing')
          PY

          git diff --check

      - name: Commit refined source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/fr/neamar/kiss/notification/NotificationListener.java \
            app/src/main/java/fr/neamar/kiss/utils/SavedNotificationDestinationResolver.java
          git commit -m "Keep saved notification opens synchronous before reconnect retry"
          git push origin HEAD:fix/3.30.97-notification-open-retry
