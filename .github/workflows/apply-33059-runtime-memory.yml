name: Apply verified 3.30.59 runtime memory repair

on:
  push:
    branches:
      - fix/3.30.59-runtime-memory

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Apply guarded source repair
        run: python3 .github/scripts/apply_33059_runtime_memory.py

      - name: Verify exact source scope and invariants
        shell: bash
        run: |
          set -euxo pipefail
          git diff --name-only | sort > /tmp/changed
          cat > /tmp/expected <<'EOF'
          app/build.gradle
          app/src/main/java/fr/neamar/kiss/KissApplication.java
          app/src/main/java/fr/neamar/kiss/appusage/AppUsageSync.java
          app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/changed

          grep -q 'versionCode 487' app/build.gradle
          grep -q 'versionName "3.30.59"' app/build.gradle
          grep -q 'RAW_EVENT_QUERY_WINDOW_MS = 7L' app/src/main/java/fr/neamar/kiss/appusage/AppUsageSync.java
          grep -q 'manager.queryEvents(windowStart, windowEnd)' app/src/main/java/fr/neamar/kiss/appusage/AppUsageSync.java
          grep -q 'packageMetaCache.computeIfAbsent' app/src/main/java/fr/neamar/kiss/appusage/AppUsageSync.java
          grep -q 'releaseDiscardedSource(source)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'populateDetails(detailsPanel, adapterPosition, expectedPojoId)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'detailsPanel.removeAllViews()' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'AppIconMemoryCache.clear()' app/src/main/java/fr/neamar/kiss/KissApplication.java

          if grep -q 'detailsPanel.addView(source' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java; then
            echo 'Eager hidden source retention still present' >&2
            exit 1
          fi
          if grep -q 'manager.queryEvents(begin, now)' app/src/main/java/fr/neamar/kiss/appusage/AppUsageSync.java; then
            echo 'Unbounded raw UsageEvents query still present' >&2
            exit 1
          fi

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Remove temporary repair helpers
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/scripts/apply_33059_runtime_memory.py
          git rm .github/workflows/apply-33059-runtime-memory.yml

      - name: Verify final branch diff is application-only
        shell: bash
        run: |
          set -euxo pipefail
          git diff --name-only HEAD~2 | sort > /tmp/final-scope || true
          git status --short
          grep -q 'versionCode 487' app/build.gradle
          grep -q 'versionName "3.30.59"' app/build.gradle

      - name: Commit verified repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Bound Smart S Launcher runtime memory in 3.30.59'
          git push origin HEAD:fix/3.30.59-runtime-memory
