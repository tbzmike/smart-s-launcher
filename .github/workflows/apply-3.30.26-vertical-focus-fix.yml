name: Apply Smart S Launcher 3.30.26 Vertical Focus Fix

on:
  push:
    branches:
      - build/3.30.26
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.26

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Apply guarded source repair
        run: python3 .github/scripts/apply_33026_vertical_focus_fix.py

      - name: Verify exact changed scope and invariants
        shell: bash
        run: |
          git diff --check
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' \
            app/build.gradle \
            app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java | sort)
          test "$CHANGED" = "$EXPECTED" || { echo 'Unexpected changed files:'; git diff --name-only; exit 1; }
          grep -q 'versionCode 454' app/build.gradle
          grep -q 'versionName "3.30.26"' app/build.gradle
          grep -q 'FOCUS_BLOCK_DESCENDANTS' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'boolean preserveSearchFocus' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          grep -q 'card.setFocusable(false)' app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java

      - name: Full clean verification
        run: |
          chmod +x gradlew
          ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java
          git commit -m 'Prevent Vertical Cards from stealing IME focus in 3.30.26'
          git push origin HEAD:build/3.30.26
