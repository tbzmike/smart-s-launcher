name: Fix 3.30.31 global text baseline
on:
  push:
    branches: [build/3.30.31]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/3.30.31
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Replace unsafe keyed View tags with weak baseline map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/fr/neamar/kiss/MainActivity.java')
          s=p.read_text()
          def once(old,new):
              global s
              n=s.count(old)
              if n != 1: raise SystemExit(f'anchor count {n}: {old[:80]}')
              s=s.replace(old,new,1)
          once('import java.util.List;\n', 'import java.util.List;\nimport java.util.WeakHashMap;\n')
          once('''    private static final String PREF_GLOBAL_TEXT_SIZE_PERCENT = "global-text-size-percent";\n    private static final int TAG_GLOBAL_TEXT_BASELINE = 0x4b495353;''', '''    private static final String PREF_GLOBAL_TEXT_SIZE_PERCENT = "global-text-size-percent";\n    private final WeakHashMap<TextView, Float> globalTextBaselines = new WeakHashMap<>();''')
          once('''            Object baseline = text.getTag(TAG_GLOBAL_TEXT_BASELINE);\n            float basePx;\n            if (baseline instanceof Float) {\n                basePx = (Float) baseline;\n            } else {\n                basePx = text.getTextSize();\n                text.setTag(TAG_GLOBAL_TEXT_BASELINE, basePx);\n            }''', '''            Float baseline = globalTextBaselines.get(text);\n            float basePx;\n            if (baseline != null) {\n                basePx = baseline;\n            } else {\n                basePx = text.getTextSize();\n                globalTextBaselines.put(text, basePx);\n            }''')
          p.write_text(s)
          PY
      - name: Verify exact scope and invariants
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/fr/neamar/kiss/MainActivity.java"
          grep -q 'WeakHashMap<TextView, Float> globalTextBaselines' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -q 'globalTextBaselines.put(text, basePx)' app/src/main/java/fr/neamar/kiss/MainActivity.java
          ! grep -q 'TAG_GLOBAL_TEXT_BASELINE' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -q 'showGlobalTextSizeDialog' app/src/main/java/fr/neamar/kiss/MainActivity.java
          grep -q 'NotificationAvatarSupport.loadHistoryAvatarsAsync' app/src/main/java/fr/neamar/kiss/MainActivity.java
      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/fr/neamar/kiss/MainActivity.java
          git commit -m 'Use safe weak baselines for global text scaling'
          git push origin HEAD:build/3.30.31
