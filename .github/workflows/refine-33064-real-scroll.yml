name: Guard 3.30.64 real user scroll refinement
on:
  push:
    branches: [fix/3.30.64-stationary-vertical-cards]
    paths: ['.github/workflows/refine-33064-real-scroll.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.64-stationary-vertical-cards
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Apply guarded real-scroll refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java')
          s = p.read_text()
          old = '''    private final class StableCardScrollView extends ScrollView {\n        StableCardScrollView() {\n            super(mainActivity);\n        }\n\n        @Override\n        public boolean dispatchTouchEvent(MotionEvent event) {\n            int action = event.getActionMasked();\n            if (action == MotionEvent.ACTION_DOWN) {\n                deferredRefreshIdlePolicy.onTouchDown();\n                cancelDeferredRefreshIdleProbe();\n                Runnable callback = userScrollStartedCallback;\n                if (callback != null) callback.run();\n            }\n            boolean handled = super.dispatchTouchEvent(event);\n            if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {\n                if (pendingDataSetRefresh) {\n                    deferredRefreshIdlePolicy.request(getScrollY(), false);\n                    deferredRefreshIdlePolicy.onTouchReleased(getScrollY());\n                    scheduleDeferredRefreshIdleProbe();\n                }\n            }\n            return handled;\n        }\n    }'''
          new = '''    private final class StableCardScrollView extends ScrollView {\n        private final VerticalCardUserScrollGesturePolicy userScrollGesturePolicy =\n                new VerticalCardUserScrollGesturePolicy();\n\n        StableCardScrollView() {\n            super(mainActivity);\n        }\n\n        @Override\n        public boolean dispatchTouchEvent(MotionEvent event) {\n            int action = event.getActionMasked();\n            if (action == MotionEvent.ACTION_DOWN) {\n                deferredRefreshIdlePolicy.onTouchDown();\n                cancelDeferredRefreshIdleProbe();\n                userScrollGesturePolicy.onTouchDown(getScrollY());\n            }\n            boolean handled = super.dispatchTouchEvent(event);\n            if (action == MotionEvent.ACTION_MOVE\n                    && userScrollGesturePolicy.onTouchMove(getScrollY())) {\n                Runnable callback = userScrollStartedCallback;\n                if (callback != null) callback.run();\n            }\n            if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {\n                userScrollGesturePolicy.onTouchEnd();\n                if (pendingDataSetRefresh) {\n                    deferredRefreshIdlePolicy.request(getScrollY(), false);\n                    deferredRefreshIdlePolicy.onTouchReleased(getScrollY());\n                    scheduleDeferredRefreshIdleProbe();\n                }\n            }\n            return handled;\n        }\n    }'''
          if s.count(old) != 1:
              raise SystemExit(f'SmartCard scroll block match count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          Path('app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUserScrollGesturePolicy.java').write_text('''package fr.neamar.kiss.forwarder;\n\n/** Distinguishes a real touch-driven viewport move from a tap/press on a Vertical Card. */\nfinal class VerticalCardUserScrollGesturePolicy {\n    private boolean touchActive;\n    private boolean movementReported;\n    private int initialScrollY;\n\n    void onTouchDown(int scrollY) {\n        touchActive = true;\n        movementReported = false;\n        initialScrollY = scrollY;\n    }\n\n    /** Returns true exactly once when this gesture has actually changed the viewport scroll Y. */\n    boolean onTouchMove(int scrollY) {\n        if (!touchActive || movementReported || scrollY == initialScrollY) return false;\n        movementReported = true;\n        return true;\n    }\n\n    void onTouchEnd() {\n        touchActive = false;\n        movementReported = false;\n    }\n}\n''')

          Path('app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardUserScrollGesturePolicyTest.java').write_text('''package fr.neamar.kiss.forwarder;\n\nimport static org.hamcrest.MatcherAssert.assertThat;\nimport static org.hamcrest.Matchers.is;\n\nimport org.junit.jupiter.api.Test;\n\nclass VerticalCardUserScrollGesturePolicyTest {\n    @Test\n    void tapWithoutScrollNeverReportsMovement() {\n        VerticalCardUserScrollGesturePolicy policy = new VerticalCardUserScrollGesturePolicy();\n        policy.onTouchDown(420);\n        assertThat(policy.onTouchMove(420), is(false));\n        policy.onTouchEnd();\n    }\n\n    @Test\n    void actualScrollChangeReportsExactlyOncePerGesture() {\n        VerticalCardUserScrollGesturePolicy policy = new VerticalCardUserScrollGesturePolicy();\n        policy.onTouchDown(420);\n        assertThat(policy.onTouchMove(418), is(true));\n        assertThat(policy.onTouchMove(390), is(false));\n        policy.onTouchEnd();\n    }\n\n    @Test\n    void nextGestureCanReportItsOwnMovement() {\n        VerticalCardUserScrollGesturePolicy policy = new VerticalCardUserScrollGesturePolicy();\n        policy.onTouchDown(420);\n        assertThat(policy.onTouchMove(400), is(true));\n        policy.onTouchEnd();\n        policy.onTouchDown(400);\n        assertThat(policy.onTouchMove(380), is(true));\n    }\n\n    @Test\n    void movesOutsideAnActiveTouchDoNotCancelPin() {\n        VerticalCardUserScrollGesturePolicy policy = new VerticalCardUserScrollGesturePolicy();\n        assertThat(policy.onTouchMove(100), is(false));\n        policy.onTouchDown(100);\n        policy.onTouchEnd();\n        assertThat(policy.onTouchMove(80), is(false));\n    }\n}\n''')

          assert 'versionName "3.30.64"' in Path('app/build.gradle').read_text()
          assert 'userScrollGesturePolicy.onTouchDown(getScrollY())' in p.read_text()
          assert 'action == MotionEvent.ACTION_MOVE' in p.read_text()
          PY
      - name: Verify exact refinement scope
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
            'app/src/main/java/fr/neamar/kiss/forwarder/SmartCardListForwarder.java',
            'app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUserScrollGesturePolicy.java',
            'app/src/test/java/fr/neamar/kiss/forwarder/VerticalCardUserScrollGesturePolicyTest.java',
          }
          tracked=set(filter(None,subprocess.check_output(['git','diff','--name-only']).decode().splitlines()))
          untracked=set(filter(None,subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines()))
          actual=(tracked|untracked)-{'.github/workflows/refine-33064-real-scroll.yml'}
          if actual != expected: raise SystemExit(f'scope={sorted(actual)} expected={sorted(expected)}')
          PY
      - name: Focused gesture and viewport tests
        run: ./gradlew testDebugUnitTest --tests 'fr.neamar.kiss.forwarder.VerticalCardUserScrollGesturePolicyTest' --tests 'fr.neamar.kiss.forwarder.VerticalCardViewportPolicyTest' --tests 'fr.neamar.kiss.forwarder.LauncherHomeNavigationPolicyTest' --stacktrace
      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Commit only after verification
        run: |
          rm .github/workflows/refine-33064-real-scroll.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          git commit -m 'Cancel bottom pin only on real user scroll'
          git push origin HEAD:fix/3.30.64-stationary-vertical-cards
