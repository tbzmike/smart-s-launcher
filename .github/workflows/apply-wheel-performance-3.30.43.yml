name: Apply guarded 3.30.43 wheel persistence performance

on:
  push:
    branches:
      - fix/3.30.43-wheel-persistence-performance
    paths:
      - .github/workflows/apply-wheel-performance-3.30.43.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3.30.43-wheel-persistence-performance
          fetch-depth: 0
      - name: Apply exact verified patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected_parent = "f39806bb29629bf2efe31d15c305f4610a75a97f"
          head_parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          if head_parent != expected_parent:
              raise SystemExit(f"Unexpected source parent {head_parent}; expected {expected_parent}")

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          arrays = Path('app/src/main/res/values/arrays.xml')
          a = arrays.read_text()
          marker = '''    <string-array name="historyModeValues" translatable="false">\n        <item>recency</item><item>frecency</item><item>frequency</item><item>adaptive</item><item>time</item><item>alphabetically</item>\n    </string-array>\n'''
          addition = marker + '''    <string-array name="smartHistoryLayoutEntries" translatable="false">\n        <item>Vertical list</item>\n        <item>Vertical cards</item>\n        <item>3D wheel</item>\n        <item>Horizontal icons</item>\n        <item>Horizontal cards</item>\n        <item>Horizontal app names</item>\n        <item>Square-U cards</item>\n    </string-array>\n    <string-array name="smartHistoryLayoutValues" translatable="false">\n        <item>vertical</item>\n        <item>vertical_cards</item>\n        <item>wheel_3d</item>\n        <item>horizontal_icons</item>\n        <item>horizontal_cards</item>\n        <item>horizontal_names</item>\n        <item>square_u</item>\n    </string-array>\n'''
          if a.count(marker) != 1:
              raise SystemExit('arrays insertion guard failed')
          arrays.write_text(a.replace(marker, addition, 1))

          prefs = Path('app/src/main/res/xml/preferences.xml')
          p = prefs.read_text()
          marker = '''        <EditTextPreference\n            android:inputType="number"\n            app:defaultValue="20"\n            app:key="number-of-search-results"\n            app:title="Max number of search results"\n            app:useSimpleSummaryProvider="true" />\n'''
          addition = marker + '''        <ListPreference\n            app:defaultValue="vertical"\n            app:entries="@array/smartHistoryLayoutEntries"\n            app:entryValues="@array/smartHistoryLayoutValues"\n            app:key="smart-history-layout"\n            app:title="App history layout"\n            app:useSimpleSummaryProvider="true" />\n'''
          if p.count(marker) != 1:
              raise SystemExit('preferences insertion guard failed')
          prefs.write_text(p.replace(marker, addition, 1))

          settings = 'app/src/main/java/fr/neamar/kiss/SmartCategorySettingsFragment.java'
          old = '''    private void addHistoryLayoutPreference() {\n        String key = "smart-history-layout";\n        if (findPreference(key) != null) return;\n\n        ListPreference preference = new ListPreference(requireContext());\n        preference.setKey(key);\n        preference.setTitle("App history layout");\n        preference.setEntries(new CharSequence[]{\n                "Vertical list", "Vertical cards", "3D wheel", "Horizontal icons", "Horizontal cards",\n                "Horizontal app names", "Square-U cards"\n        });\n        preference.setEntryValues(new CharSequence[]{\n                "vertical", "vertical_cards", "wheel_3d", "horizontal_icons", "horizontal_cards",\n                "horizontal_names", "square_u"\n        });\n        preference.setDefaultValue("vertical");\n        preference.setSummaryProvider(ListPreference.SimpleSummaryProvider.getInstance());\n        preference.setOnPreferenceChangeListener((changedPreference, newValue) -> {\n            markLayoutDirty();\n            return true;\n        });\n        getPreferenceScreen().addPreference(preference);\n    }\n'''
          new = '''    private void addHistoryLayoutPreference() {\n        // The selector is XML-backed so it is always present, including after Settings recreation\n        // and when this category is reached through Settings search. This fragment only attaches\n        // Smart S live-refresh behavior; it no longer owns creation of the preference.\n        ListPreference preference = findPreference("smart-history-layout");\n        if (preference == null) return;\n        preference.setSummaryProvider(ListPreference.SimpleSummaryProvider.getInstance());\n        preference.setOnPreferenceChangeListener((changedPreference, newValue) -> {\n            markLayoutDirty();\n            return true;\n        });\n    }\n'''
          replace_once(settings, old, new, 'stable wheel settings selector')

          history = 'app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java'
          replace_once(history,
              'import java.util.LinkedHashMap;\nimport java.util.Map;\n',
              'import java.util.ArrayList;\nimport java.util.LinkedHashMap;\nimport java.util.Map;\n',
              'wheel import')

          replace_once(history,
              '''    private WheelScrollView wheelScroller;\n    private LinearLayout wheelColumn;\n    private ScrollView notificationScroller;\n''',
              '''    private WheelScrollView wheelScroller;\n    private LinearLayout wheelColumn;\n    private final ArrayList<Integer> wheelViewTypes = new ArrayList<>();\n    private boolean wheelTransformFramePosted;\n    private ScrollView notificationScroller;\n''',
              'wheel performance state')

          replace_once(history,
              '''        wheelColumn.addOnLayoutChangeListener((v, left, top, right, bottom,\n                                               oldLeft, oldTop, oldRight, oldBottom) -> {\n            if (WHEEL_3D.equals(activeMode)) updateWheelTransforms();\n        });\n''',
              '''        wheelColumn.addOnLayoutChangeListener((v, left, top, right, bottom,\n                                               oldLeft, oldTop, oldRight, oldBottom) -> {\n            if (WHEEL_3D.equals(activeMode)) scheduleWheelTransforms();\n        });\n''',
              'coalesce wheel layout transforms')

          old_rebuild = '''    private void rebuildWheel() {\n        if (wheelColumn == null || mainActivity.adapter == null) return;\n\n        resetWheelTransforms();\n        wheelColumn.removeAllViews();\n\n        final int count = mainActivity.adapter.getCount();\n        String currentQuery = mainActivity.searchEditText == null\n                ? "" : mainActivity.searchEditText.getText().toString().trim();\n        long currentPriorityId = count > 0\n                ? mainActivity.adapter.getItem(count - 1).getUniqueId() : Long.MIN_VALUE;\n        boolean refocusFront = !wheelHasBeenEntered\n                || !currentQuery.equals(lastWheelQuery)\n                || currentPriorityId != lastWheelPriorityId;\n\n        for (int position = 0; position < count; position++) {\n            // Ask the existing ListView adapter for the real Smart S row so icons, text,\n            // notifications, history metadata, tags, custom icons and long-press behavior stay shared.\n            View source = mainActivity.adapter.getView(position, null, mainActivity.list);\n            resetWheelTransform(source);\n            source.setCameraDistance(mainActivity.getResources().getDisplayMetrics().density * 8000f);\n            bindResultInteraction(source, position);\n\n            LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(\n                    ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);\n            lp.setMargins(dp(3), dp(4), dp(3), dp(4));\n            wheelColumn.addView(source, lp);\n        }\n\n        wheelHasBeenEntered = true;\n        lastWheelQuery = currentQuery;\n        lastWheelPriorityId = currentPriorityId;\n        wheelScroller.post(() -> {\n            if (refocusFront && count > 0) centerWheelItem(count - 1);\n            updateWheelTransforms();\n        });\n    }\n'''
          new_rebuild = '''    private void rebuildWheel() {\n        if (wheelColumn == null || mainActivity.adapter == null) return;\n\n        final int count = mainActivity.adapter.getCount();\n        String currentQuery = mainActivity.searchEditText == null\n                ? "" : mainActivity.searchEditText.getText().toString().trim();\n        long currentPriorityId = count > 0\n                ? mainActivity.adapter.getItem(count - 1).getUniqueId() : Long.MIN_VALUE;\n        boolean refocusFront = !wheelHasBeenEntered\n                || !currentQuery.equals(lastWheelQuery)\n                || currentPriorityId != lastWheelPriorityId;\n\n        // Rebind through the real List View adapter, but recycle rows by view type instead of\n        // destroying the whole wheel for every history/search dataset update. This keeps every\n        // List View feature while avoiding repeated inflate/layout/GC churn.\n        for (int position = 0; position < count; position++) {\n            int viewType = mainActivity.adapter.getItemViewType(position);\n            View existing = position < wheelColumn.getChildCount()\n                    ? wheelColumn.getChildAt(position) : null;\n            int oldType = position < wheelViewTypes.size() ? wheelViewTypes.get(position) : -1;\n            View reusable = existing != null && oldType == viewType ? existing : null;\n            View source = mainActivity.adapter.getView(position, reusable, mainActivity.list);\n\n            if (source != existing) {\n                if (existing != null) wheelColumn.removeViewAt(position);\n                LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(\n                        ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);\n                lp.setMargins(dp(3), dp(4), dp(3), dp(4));\n                wheelColumn.addView(source, position, lp);\n            }\n\n            while (wheelViewTypes.size() <= position) wheelViewTypes.add(-1);\n            wheelViewTypes.set(position, viewType);\n            resetWheelTransform(source);\n            source.setCameraDistance(mainActivity.getResources().getDisplayMetrics().density * 8000f);\n            bindResultInteraction(source, position);\n        }\n\n        while (wheelColumn.getChildCount() > count) {\n            wheelColumn.removeViewAt(wheelColumn.getChildCount() - 1);\n        }\n        while (wheelViewTypes.size() > count) {\n            wheelViewTypes.remove(wheelViewTypes.size() - 1);\n        }\n\n        wheelHasBeenEntered = true;\n        lastWheelQuery = currentQuery;\n        lastWheelPriorityId = currentPriorityId;\n        wheelScroller.post(() -> {\n            if (refocusFront && count > 0) centerWheelItem(count - 1);\n            scheduleWheelTransforms();\n        });\n    }\n'''
          replace_once(history, old_rebuild, new_rebuild, 'incremental wheel rebuild')

          marker = '''    private void updateWheelTransforms() {\n'''
          scheduler = '''    private void scheduleWheelTransforms() {\n        if (wheelScroller == null || wheelTransformFramePosted || !WHEEL_3D.equals(activeMode)) return;\n        wheelTransformFramePosted = true;\n        wheelScroller.postOnAnimation(() -> {\n            wheelTransformFramePosted = false;\n            if (WHEEL_3D.equals(activeMode)) updateWheelTransforms();\n        });\n    }\n\n'''
          h = Path(history).read_text()
          if h.count(marker) != 1:
              raise SystemExit('wheel transform scheduler insertion guard failed')
          Path(history).write_text(h.replace(marker, scheduler + marker, 1))

          replace_once(history,
              '''        float viewportCenter = wheelScroller.getScrollY() + wheelScroller.getHeight() / 2f;\n        float radius = Math.max(dp(160), wheelScroller.getHeight() * 0.52f);\n        float density = mainActivity.getResources().getDisplayMetrics().density;\n\n        for (int i = 0; i < wheelColumn.getChildCount(); i++) {\n            View child = wheelColumn.getChildAt(i);\n            float childCenter = child.getTop() + child.getHeight() / 2f;\n''',
              '''        float viewportTop = wheelScroller.getScrollY();\n        float viewportBottom = viewportTop + wheelScroller.getHeight();\n        float viewportCenter = viewportTop + wheelScroller.getHeight() / 2f;\n        float radius = Math.max(dp(160), wheelScroller.getHeight() * 0.52f);\n        float overscan = wheelScroller.getHeight() * 0.35f;\n        float density = mainActivity.getResources().getDisplayMetrics().density;\n\n        for (int i = 0; i < wheelColumn.getChildCount(); i++) {\n            View child = wheelColumn.getChildAt(i);\n            if (child.getBottom() < viewportTop - overscan\n                    || child.getTop() > viewportBottom + overscan) {\n                // Keep off-screen rows laid out for ScrollView geometry, but skip perspective work\n                // until they approach the viewport.\n                child.setAlpha(0.12f);\n                child.setRotationX(0f);\n                child.setScaleX(0.82f);\n                child.setScaleY(0.82f);\n                child.setTranslationY(0f);\n                child.setTranslationZ(0f);\n                continue;\n            }\n            float childCenter = child.getTop() + child.getHeight() / 2f;\n''',
              'visible wheel transform window')

          replace_once(history,
              '''        protected void onScrollChanged(int l, int t, int oldl, int oldt) {\n            super.onScrollChanged(l, t, oldl, oldt);\n            updateWheelTransforms();\n        }\n''',
              '''        protected void onScrollChanged(int l, int t, int oldl, int oldt) {\n            super.onScrollChanged(l, t, oldl, oldt);\n            scheduleWheelTransforms();\n        }\n''',
              'scroll frame coalescing')

          replace_once(history,
              '''            post(() -> {\n                if (WHEEL_3D.equals(activeMode)) updateWheelTransforms();\n            });\n''',
              '''            post(() -> {\n                if (WHEEL_3D.equals(activeMode)) scheduleWheelTransforms();\n            });\n''',
              'size transform coalescing')

          gradle = 'app/build.gradle'
          replace_once(gradle,
              '''        // Smart S Launcher 3.30.42 - add isolated 3D Wheel history view mode\n        versionCode 470\n        versionName "3.30.42"\n''',
              '''        // Smart S Launcher 3.30.43 - persist and optimize 3D Wheel view mode\n        versionCode 471\n        versionName "3.30.43"\n''',
              'version bump')

          workflow = Path('.github/workflows/apply-wheel-performance-3.30.43.yml')
          workflow.unlink()
          PY

          git diff --check
          git status --short
          git diff -- app/src/main/java/fr/neamar/kiss/forwarder/HistoryDisplayForwarder.java \
            app/src/main/java/fr/neamar/kiss/SmartCategorySettingsFragment.java \
            app/src/main/res/xml/preferences.xml app/src/main/res/values/arrays.xml app/build.gradle

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist and optimize 3D Wheel view mode 3.30.43"
          git push
