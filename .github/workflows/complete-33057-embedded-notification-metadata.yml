name: Complete 3.30.57 embedded notification metadata

on:
  push:
    branches:
      - fix/3.30.57-full-vertical-card-timestamps
    paths:
      - .github/workflows/complete-33057-embedded-notification-metadata.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/3.30.57-full-vertical-card-timestamps
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply guarded embedded-notification completion
        run: python3 .github/scripts/complete_33057_embedded_notification_metadata.py

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed
          cat > /tmp/expected <<'EOF'
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          app/src/main/java/fr/neamar/kiss/result/AppResult.java
          app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java
          app/src/main/java/fr/neamar/kiss/ui/TileLaunchCounter.java
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/changed
          grep -q 'formatEventTime("Received", notification.postTime)' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          grep -q 'getNotificationTotal' app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          grep -q 'TileLaunchCounter.recordNotification(context, latest.id, latest.postTime)' app/src/main/java/fr/neamar/kiss/result/AppResult.java
          test "$(grep -c 'TileLaunchCounter.recordNotification' app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java)" -eq 2
          grep -q 'versionCode 485' app/build.gradle
          grep -q 'versionName "3.30.57"' app/build.gradle

      - name: Full clean verification
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify both APK versions
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            LINE="$("$AAPT" dump badging "$APK" | head -n1)"
            printf '%s\n' "$LINE" | grep -q "versionCode='485'"
            printf '%s\n' "$LINE" | grep -q "versionName='3.30.57'"
          done

      - name: Remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/complete_33057_embedded_notification_metadata.py
          rm .github/workflows/complete-33057-embedded-notification-metadata.yml
          git diff --check

      - name: Verify final scope
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/final
          cat > /tmp/expected <<'EOF'
          .github/scripts/complete_33057_embedded_notification_metadata.py
          .github/workflows/complete-33057-embedded-notification-metadata.yml
          app/src/main/java/fr/neamar/kiss/forwarder/VerticalCardUsageForwarder.java
          app/src/main/java/fr/neamar/kiss/result/AppResult.java
          app/src/main/java/fr/neamar/kiss/result/ShortcutsResult.java
          app/src/main/java/fr/neamar/kiss/ui/TileLaunchCounter.java
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/final

      - name: Commit verified completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete embedded notification timestamps in 3.30.57'
          git push origin HEAD:fix/3.30.57-full-vertical-card-timestamps
